<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>תרגול תורת המוזיקה - מעודכן</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

    @font-face {
      font-family: 'Bravura';
      src: url('https://cdn.jsdelivr.net/npm/smufl-bravura-font@1.39.0/redist/woff/bravura.woff') format('woff');
    }

    :root {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #171717;
      --primary-hover: #000000;
      --secondary: #404040;
      --text-dark: #171717;
      --text-muted: #525252;
      --success: #16a34a;
      --error: #dc2626;
      --border: 1px solid #e5e5e5;
      --btn-bg: #ffffff;
      --btn-color: #171717;
      --radius-card: 16px;
      --radius-btn: 10px;
    }

    /* ערכת חם / WARM */
    body.theme-warm {
      --bg-gradient: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-shadow: 0 4px 16px rgba(234, 88, 12, 0.08);
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #d97706;
      --text-dark: #431407;
      --text-muted: #78350f;
      --success: #10b981;
      --error: #ef4444;
      --border: 1px solid #fed7aa;
      --btn-bg: #ffffff;
      --btn-color: #431407;
    }

    /* ערכת לילה / VIVID */
    body.theme-vivid {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.37);
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --secondary: #c084fc;
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --border: 1px solid rgba(51, 65, 85, 0.8);
      --btn-bg: #1e293b;
      --btn-color: #f8fafc;
    }

    /* ערכת אוקיינוס / OCEAN */
    body.theme-ocean {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 4px 16px rgba(3, 105, 161, 0.1);
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --secondary: #0d9488;
      --text-dark: #0c4a6e;
      --text-muted: #0369a1;
      --border: 1px solid #7dd3fc;
      --btn-bg: #ffffff;
      --btn-color: #0c4a6e;
    }

    /* ערכה: לבן בלבד (נקי, ללא צבע וללא צל) */
    body.theme-white-clean {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #171717;
      --primary-hover: #000000;
      --secondary: #404040;
      --text-dark: #171717;
      --text-muted: #525252;
      --success: #16a34a;
      --error: #dc2626;
      --border: 1px solid #e5e5e5;
      --btn-bg: #ffffff;
      --btn-color: #171717;
    }

    /* ערכה: לבן עם קווים עדינים ובלתי אחידים (עיפרון דק ידני) */
    body.theme-pencil-thin {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #262626;
      --primary-hover: #000000;
      --secondary: #525252;
      --text-dark: #1a1a1a;
      --text-muted: #525252;
      --success: #15803d;
      --error: #b91c1c;
      --border: 1px solid #737373;
      --btn-bg: #ffffff;
      --btn-color: #1a1a1a;
      --radius-card: 255px 15px 225px 15px/15px 225px 15px 255px;
      --radius-btn: 255px 12px 225px 10px/12px 225px 10px 255px;
    }

    body.theme-pencil-thin .card,
    body.theme-pencil-thin .opt-btn,
    body.theme-pencil-thin .play-btn,
    body.theme-pencil-thin .next-btn,
    body.theme-pencil-thin .help-btn,
    body.theme-pencil-thin .share-btn,
    body.theme-pencil-thin .tag-pill,
    body.theme-pencil-thin .theme-selector,
    body.theme-pencil-thin .staff-container,
    body.theme-pencil-thin select,
    body.theme-pencil-thin details,
    body.theme-pencil-thin .tag-container,
    body.theme-pencil-thin .chord-answers-container,
    body.theme-pencil-thin .piano-keyboard,
    body.theme-pencil-thin .acc-btn {
      border-top: 1.2px solid #525252 !important;
      border-right: 0.8px solid #737373 !important;
      border-bottom: 1.4px solid #404040 !important;
      border-left: 0.9px solid #737373 !important;
      border-radius: var(--radius-btn);
    }

    body.theme-pencil-thin .card {
      border-radius: var(--radius-card);
    }

    body.theme-white-clean h1,
    body.theme-pencil-thin h1 {
      background: none;
      -webkit-text-fill-color: initial;
      color: var(--text-dark);
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: 8px;
      color: var(--text-dark);
      direction: rtl;
      transition: background 0.3s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      flex: 1; 
      width: 100%; 
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
    }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 1.3rem;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: 12px;
      border: var(--border);
    }
    .theme-selector label { font-size: 11px; font-weight: 600; color: var(--text-dark); }
    
    select {
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 8px;
      border: var(--border);
      background: var(--btn-bg);
      color: var(--text-dark);
      outline: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card, 16px);
      padding: 8px 12px;
      box-shadow: var(--card-shadow);
      border: var(--border);
      backdrop-filter: blur(16px);
      margin-bottom: 4px;
    }

    details {
      background: rgba(0,0,0,0.02);
      border: var(--border);
      border-radius: 10px;
      padding: 4px 8px;
    }
    summary {
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--primary);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .control-group { display: flex; flex-direction: column; gap: 2px; }
    label { font-weight: 600; font-size: 11px; color: var(--text-dark); }

    .tag-selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .tag-selector-header button {
      padding: 1px 5px;
      font-size: 10px;
      cursor: pointer;
      background: transparent;
      border: var(--border);
      border-radius: 6px;
      font-weight: 600;
      color: var(--primary);
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 75px;
      overflow-y: auto;
      padding: 4px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      border: var(--border);
    }

    .tag-pill {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--btn-bg);
      border: var(--border);
      color: var(--text-dark);
      cursor: pointer;
    }
    .tag-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    body.theme-white-clean .tag-pill.active,
    body.theme-pencil-thin .tag-pill.active {
      background: #171717;
      color: #ffffff;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: var(--border);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      border-radius: var(--radius-btn, 10px);
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    body.theme-white-clean .btn-main,
    body.theme-pencil-thin .btn-main {
      background: #ffffff;
      color: #171717;
    }

    .practice-area { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    
    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .play-btn, .next-btn, .help-btn, .share-btn {
      padding: 6px 10px;
      border-radius: var(--radius-btn, 16px);
      font-weight: 700;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: var(--border);
    }

    .play-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
    body.theme-white-clean .play-btn,
    body.theme-pencil-thin .play-btn { background: #ffffff; color: #171717; }

    .next-btn, .help-btn, .share-btn { background: var(--btn-bg); color: var(--text-dark); }

    .help-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .help-popover {
      display: none;
      font-size: 11px;
      font-weight: 700;
      background: var(--btn-bg);
      color: var(--primary);
      border: var(--border);
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      animation: fadeIn 0.2s ease-in-out;
    }
    .help-popover.visible { display: inline-block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .staff-container { 
      background: #ffffff; 
      border-radius: 12px; 
      padding: 4px; 
      border: var(--border); 
      margin: 2px 0; 
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
    }
    body.theme-white-clean .staff-container,
    body.theme-pencil-thin .staff-container {
      box-shadow: none;
    }

    .staff-svg { width: 100%; height: 110px; }

    .music-clef {
      font-family: 'Bravura', serif;
      fill: currentColor;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .g-clef-symbol { font-size: 82px; }
    .f-clef-symbol { font-size: 43px; }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
      gap: 6px;
      margin-top: 4px;
    }

    .chord-answers-container, .mode-answers-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(0, 0, 0, 0.02);
      padding: 6px;
      border-radius: 10px;
      border: var(--border);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      color: var(--text-dark);
    }

    .opt-btn {
      background: var(--btn-bg);
      border: var(--border);
      padding: 6px 4px;
      border-radius: var(--radius-btn, 8px);
      font-weight: 600;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      color: var(--btn-color);
    }
    .opt-btn.correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .opt-btn.wrong { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }

    .acc-selector {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .acc-btn {
      background: var(--btn-bg);
      border: var(--border);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-dark);
    }
    .acc-btn.selected { background: var(--primary); color: white; }
    body.theme-white-clean .acc-btn.selected,
    body.theme-pencil-thin .acc-btn.selected { background: #171717; color: #ffffff; }

    .piano-keyboard {
      display: flex;
      justify-content: center;
      position: relative;
      height: 70px;
      margin: 4px auto;
      direction: ltr;
      width: fit-content;
      padding: 4px;
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
      border: var(--border);
    }
    .key-white {
      width: 28px;
      height: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 0 5px 5px;
      cursor: pointer;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      font-weight: 700;
      font-size: 10px;
      color: #334155;
    }
    .key-black {
      width: 18px;
      height: 60%;
      background: #1e293b;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      z-index: 2;
      margin-left: -9px;
      margin-right: -9px;
    }

    .feedback { font-size: 13px; font-weight: 700; min-height: 18px; margin-top: 2px; }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }
    .feedback.info { color: var(--secondary); }

    .stats { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

    footer {
      text-align: center;
      padding: 2px 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body class="theme-white-clean">

<div class="container">
  <div class="header-bar">
    <h1>תרגול תורת המוזיקה</h1>
    <div class="theme-selector">
      <label for="themeSelect">🎨 ערכה:</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="theme-white-clean" selected>לבן נקי</option>
        <option value="theme-warm">חם</option>
        <option value="theme-vivid">לילה</option>
        <option value="theme-ocean">אוקיינוס</option>
        <option value="theme-pencil-thin">✏️ עיפרון דק (ידני)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <details id="settingsCollapse">
      <summary>⚙️ הגדרות תרגיל</summary>
      <div class="controls-grid">
        <div class="control-group">
          <label>סוג התרגיל:</label>
          <select id="exType" onchange="onExerciseTypeChange()">
            <option value="note_id">זיהוי תווים</option>
            <option value="intervals" selected>מרווחים</option>
            <option value="chords">אקורדים משולשים</option>
            <option value="septachords">ספטאקורדים</option>
            <option value="scales">סולמות</option>
            <option value="modes">מודוסים יווניים</option>
          </select>
        </div>

        <div class="control-group" id="intervalFormatGroup">
          <label>תצוגת מרווחים:</label>
          <select id="intervalFormatSelect" onchange="updateOptionsList()">
            <option value="full">מילים מלאות</option>
            <option value="abbr" selected>קיצורים (2.מוג)</option>
          </select>
        </div>

        <div class="control-group">
          <label>תצוגה:</label>
          <select id="displayMode">
            <option value="both">כתוב ומושמע</option>
            <option value="audio_only">מושמע בלבד</option>
          </select>
        </div>

        <div class="control-group">
          <label>כלי נגינה:</label>
          <select id="instrumentSelect">
            <option value="marimba" selected>🪵 מרימבה</option>
            <option value="piano">🎹 פסנתר</option>
          </select>
        </div>

        <div class="control-group">
          <label>מפתח:</label>
          <select id="clefSelect">
            <option value="rand" selected>אקראי</option>
            <option value="sol">סול</option>
            <option value="fa">פה</option>
          </select>
        </div>

        <div class="control-group" id="accidentalGroup" style="display: none;">
          <label>סימני התק:</label>
          <select id="accidentalSelect">
            <option value="with">עם סימני התק</option>
            <option value="without">רק טבעיים</option>
          </select>
        </div>

        <div class="control-group" id="playModeGroup">
          <label>נגינה:</label>
          <select id="playMode">
            <option value="random" selected>אקראי</option>
            <option value="harmonic">הרמוני</option>
            <option value="ascending">מלודי עולה</option>
            <option value="descending">מלודי יורד</option>
          </select>
        </div>
      </div>

      <div class="control-group" id="inversionsGroup" style="display: none; margin-top:4px;">
        <div class="tag-selector-header">
          <label>היפוך:</label>
          <div>
            <button onclick="selectAllInversions(true)">הכל</button>
            <button onclick="selectAllInversions(false)">נקה</button>
          </div>
        </div>
        <div class="tag-container" id="inversionsTags"></div>
      </div>

      <div class="control-group" id="optionsGroup" style="margin-top:4px;">
        <div class="tag-selector-header">
          <label id="optionsListLabel">סינון סוגים:</label>
          <div>
            <button onclick="selectAllOptions(true)">הכל</button>
            <button onclick="selectAllOptions(false)">נקה</button>
          </div>
        </div>
        <div class="tag-container" id="optionsTags"></div>
      </div>
    </details>

    <button class="btn-main" onclick="startPractice(); closeSettings();">צור תרגיל חדש ➔</button>
  </div>

  <div class="card practice-area" id="practiceArea">
    <div class="action-bar">
      <button class="play-btn" id="playAudioBtn" onclick="playCurrentExercise()">🎵 השמע</button>
      <button class="play-btn" id="playFirstNoteBtn" onclick="playFirstNoteOnly()" style="display:none;">🎯 נגן צליל ראשון</button>
      <button class="next-btn" onclick="startPractice()">➡️ לתרגיל הבא</button>
      <button class="share-btn" onclick="shareCurrentExercise()">🔗 שתף</button>
      <div class="help-wrapper">
        <button class="help-btn" onclick="revealAnswer()">💡 עזרה</button>
        <span class="help-popover" id="helpPopover"></span>
      </div>
    </div>
    
    <div class="staff-container" id="staffContainer">
      <svg id="staffSvg" class="staff-svg" viewBox="0 0 520 110"></svg>
    </div>

    <div id="standardAnswersArea">
      <div class="options-grid" id="optionsButtons"></div>
    </div>

    <div id="chordAnswersArea" class="chord-answers-container" style="display: none;">
      <div class="section-title">1. בחירת הטיפוס:</div>
      <div class="options-grid" id="chordTypeButtons"></div>
      <div class="section-title">2. בחירת ההיפוך:</div>
      <div class="options-grid" id="chordInvButtons"></div>
    </div>

    <div id="modeAnswersArea" class="mode-answers-container" style="display: none;">
      <div class="section-title">1. בחירת תו היסוד:</div>
      <div class="acc-selector">
        <button class="acc-btn" id="modeAccFlat" onclick="toggleAccidental('-1')">במול (♭)</button>
        <button class="acc-btn" id="modeAccSharp" onclick="toggleAccidental('1')">דיאז (♯)</button>
      </div>
      <div class="options-grid" id="modeNoteNameButtons"></div>
      <div class="section-title">2. בחירת המודוס / הסולם:</div>
      <div class="options-grid" id="modeTypeButtons"></div>
    </div>

    <div id="noteIdAnswersArea" style="display: none;">
      <div class="acc-selector">
        <button class="acc-btn" id="accFlat" onclick="toggleAccidental('-1')">במול (♭)</button>
        <button class="acc-btn" id="accSharp" onclick="toggleAccidental('1')">דיאז (♯)</button>
      </div>
      <div class="options-grid" id="noteNameButtons"></div>
      <div class="piano-keyboard" id="pianoKeyboard"></div>
    </div>

    <div>
      <div class="feedback" id="feedback"></div>
      <div class="stats" id="stats">ניקוד מצטבר: <span id="scoreDisplay">0</span></div>
    </div>
  </div>

  <footer>
    נעם ברטוב <a href="https://noambartov.com" target="_blank" rel="noopener noreferrer">noambartov.com</a>
  </footer>
</div>

<script>
const NOTE_NAMES = [
  { name: 'דו', eng: 'C', pc: 0 },
  { name: 'רה', eng: 'D', pc: 2 },
  { name: 'מי', eng: 'E', pc: 4 },
  { name: 'פה', eng: 'F', pc: 5 },
  { name: 'סול', eng: 'G', pc: 7 },
  { name: 'לה', eng: 'A', pc: 9 },
  { name: 'סי', eng: 'B', pc: 11 }

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playInstrumentNote(freq, startTime, duration = 1.2) {
  const ctx = getAudioContext();
  const inst = document.getElementById('instrumentSelect').value;

  if (inst === 'marimba') {
    const partials = [
      { ratio: 1.0, gain: 1.0, decay: duration },
      { ratio: 3.9, gain: 0.4, decay: duration * 0.2 }
    ];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * p.ratio, startTime);
      gainNode.gain.setValueAtTime(0, startTime);
      gainNode.gain.linearRampToValueAtTime(p.gain * 0.35, startTime + 0.005);
      gainNode.gain.exponentialRampToValueAtTime(0.00001, startTime + p.decay);
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + p.decay);
    });
  } else {
    const osc1 = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc1.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, startTime);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.4, startTime + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 1.5);
    osc1.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc1.start(startTime);
    osc1.stop(startTime + duration * 1.5);
  }
}

function getNoteDetails(absLine, acc, clef) {
  let baseIndex = (clef === 'sol') ? 2 : 4; 
  let diatonicIdx = baseIndex + absLine;
  let nameIndex = (diatonicIdx % 7 + 7) % 7;
  let octave = Math.floor(diatonicIdx / 7) + (clef === 'sol' ? 4 : 2);
  let midiNum = (octave + 1) * 12 + DIATONIC_SEMITONES[nameIndex] + acc;
  return { absLine, acc, diatonicIdx, midiNum, nameIndex };
}

function buildNotes(baseLine, baseAcc, struct, clef, inversionShift = 0) {
  let baseDetails = getNoteDetails(baseLine, baseAcc, clef);
  let rawNotes = [];
  
  struct.stepOffsets.forEach((step, idx) => {
    let line = baseLine + step;
    let diatonicIdx = ((clef === 'sol' ? 2 : 4) + line);
    let nameIdx = (diatonicIdx % 7 + 7) % 7;
    let octave = Math.floor(diatonicIdx / 7) + (clef === 'sol' ? 4 : 2);
    
    let targetSemitones = struct.semitones[idx];
    let naturalSemitones = DIATONIC_SEMITONES[nameIdx] + (octave * 12);
    let rootNatural = DIATONIC_SEMITONES[(baseDetails.diatonicIdx % 7 + 7) % 7] + (Math.floor(baseDetails.diatonicIdx / 7) + (clef === 'sol' ? 4 : 2)) * 12 + baseAcc;
    
    let requiredAcc = (rootNatural + targetSemitones) - naturalSemitones;
    rawNotes.push({ line, acc: requiredAcc });
  });

  if (inversionShift > 0) {
    for (let i = 0; i < inversionShift; i++) {
      let shifted = rawNotes.shift();
      shifted.line += 7;
      rawNotes.push(shifted);
    }
  }

  return rawNotes.map(n => getNoteDetails(n.line, n.acc, clef));
}

function generateExercise() {
  const type = document.getElementById('exType').value;
  let clefSelectVal = document.getElementById('clefSelect').value;
  let clef = clefSelectVal === 'rand' ? (Math.random() < 0.5 ? 'sol' : 'fa') : clefSelectVal;

  if (type === 'note_id') {
    const accOption = document.getElementById('accidentalSelect').value;
    let acc = 0;
    if (accOption === 'with') {
      acc = Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0;
    }
    let line = Math.floor(Math.random() * 9) - 2;
    let note = getNoteDetails(line, acc, clef);

    if (note.absLine < -4 || note.absLine > 12) return generateExercise();

    return { type, clef, notes: [note], correctNote: note };
  }

  const activeOptionPills = Array.from(document.querySelectorAll('#optionsTags .tag-pill.active')).map(el => el.dataset.value);
  if (activeOptionPills.length === 0) {
    alert("יש לבחור לפחות אפשרות אחת לתרגול!");
    return null;
  }

  let activeInvPills = [0];
  if (type === 'chords' || type === 'septachords') {
    activeInvPills = Array.from(document.querySelectorAll('#inversionsTags .tag-pill.active')).map(el => parseInt(el.dataset.value));
    if (activeInvPills.length === 0) {
      alert("יש לבחור לפחות היפוך אחד לתרגול!");
      return null;
    }
  }

  const poolStructs = BASE_STRUCTURES[type].filter(s => activeOptionPills.includes(s.name));
  const chosenStruct = poolStructs[Math.floor(Math.random() * poolStructs.length)];
  const chosenInversion = activeInvPills[Math.floor(Math.random() * activeInvPills.length)];

  let baseLine = (clef === 'sol') ? Math.floor(Math.random() * 3) - 2 : Math.floor(Math.random() * 3) - 1;
  let baseAcc = Math.random() < 0.25 ? (Math.random() < 0.5 ? -1 : 1) : 0;
  let notes = buildNotes(baseLine, baseAcc, chosenStruct, clef, chosenInversion);

  let isValid = notes.every(n => Math.abs(n.acc) <= 2 && n.absLine >= -4 && n.absLine <= 14);
  if (!isValid) {
    return generateExercise();
  }

  const hasDoubleAccidental = notes.some(n => Math.abs(n.acc) >= 2);
  if (hasDoubleAccidental) {
    const isAllowedScale = (type === 'scales') && (chosenStruct.name === 'מינור הרמוני' || chosenStruct.name === 'מינור מלודי');
    if (!isAllowedScale) {
      return generateExercise();
    }
  }

  return {
    type,
    struct: chosenStruct,
    clef,
    notes,
    inversion: chosenInversion,
    optionsPool: poolStructs,
    inversionsPool: INVERSIONS_DATA[type] ? INVERSIONS_DATA[type].filter(i => activeInvPills.includes(i.id)) : []
  };
}

      else if (n.acc === -1) accHref = '#acc-flat';
      else if (n.acc === 2) accHref = '#acc-double-sharp';

      let accX = baseX - 15 - accOffsets[idx];
      svgContent += `<use href="${accHref}" x="${accX}" y="${y}" />`;
    }

    svgContent += `<ellipse cx="${noteX}" cy="${y}" rx="4.4" ry="3.2" fill="currentColor" transform="rotate(-20 ${noteX} ${y})"/>`;
  });

  svg.innerHTML = svgContent;
}

function updateFirstNoteButtonUI() {
  const btn = document.getElementById('playFirstNoteBtn');
  if (!currentExercise || currentExercise.type === 'note_id') {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-flex';

  if (currentPlayDirection === 'descending') {
    btn.innerText = '🎯 נגן צליל ראשון (סופרן)';
  } else {
    btn.innerText = '🎯 נגן צליל ראשון (בס)';
  }
}

function playCurrentExercise() {
  if (!currentExercise) return;
  const freqs = currentExercise.notes.map(n => midiToFreq(n.midiNum));
  const ctx = getAudioContext();

  if (currentExercise.type === 'scales' || currentExercise.type === 'modes') {
    currentPlayDirection = 'ascending';
    updateFirstNoteButtonUI();
    const now = ctx.currentTime + 0.05;
    freqs.forEach((f, idx) => playInstrumentNote(f, now + idx * 0.3, 0.7));
    const scaleDesc = [...freqs].reverse().slice(1);
    scaleDesc.forEach((f, idx) => playInstrumentNote(f, now + (freqs.length + idx) * 0.3, 0.7));
    return;
  }

  const modeSelect = document.getElementById('playMode').value;
  let mode = modeSelect;
  if (mode === 'random') {
    const modes = ['harmonic', 'ascending', 'descending'];
    mode = modes[Math.floor(Math.random() * modes.length)];
  }

  currentPlayDirection = mode;
  updateFirstNoteButtonUI();

  const now = ctx.currentTime + 0.05;
  if (mode === 'harmonic') {
    freqs.forEach(f => playInstrumentNote(f, now, 1.4));
  } else if (mode === 'ascending') {
    freqs.forEach((f, idx) => playInstrumentNote(f, now + idx * 0.35, 0.9));
  } else if (mode === 'descending') {
    [...freqs].reverse().forEach((f, idx) => playInstrumentNote(f, now + idx * 0.35, 0.9));
  }
}

function playFirstNoteOnly() {
  if (!currentExercise || !currentExercise.notes || currentExercise.notes.length === 0) return;
  
  let targetNote;
  if (currentPlayDirection === 'descending') {
    targetNote = currentExercise.notes[currentExercise.notes.length - 1];
  } else {
    targetNote = currentExercise.notes[0];
  }

  const freq = midiToFreq(targetNote.midiNum);
  const ctx = getAudioContext();
  playInstrumentNote(freq, ctx.currentTime + 0.05, 1.2);
}

function triggerSuccessAndNext() {
  playCurrentExercise();
  setTimeout(startPractice, 1200);
}

function startPractice() {
  currentExercise = generateExercise();
  if (!currentExercise) return;

  document.getElementById('practiceArea').style.display = 'flex';
  document.getElementById('feedback').innerText = '';
  document.getElementById('feedback').className = 'feedback';

  const popover = document.getElementById('helpPopover');
  popover.classList.remove('visible');
  popover.innerText = '';

  selectedAccidental = '0';
  selectedChordType = null;
  selectedChordInv = null;
  selectedNoteNameIdx = null;
  selectedModeType = null;
  typeAnsweredCorrectly = false;
  currentPlayDirection = 'ascending';

  renderStaff(currentExercise);
  setupAnswerUI();
  updateFirstNoteButtonUI();
}

function setupAnswerUI() {
  const stdArea = document.getElementById('standardAnswersArea');
  const chordArea = document.getElementById('chordAnswersArea');
  const modeArea = document.getElementById('modeAnswersArea');
  const noteArea = document.getElementById('noteIdAnswersArea');

  stdArea.style.display = 'none';
  chordArea.style.display = 'none';
  modeArea.style.display = 'none';
  noteArea.style.display = 'none';

  if (currentExercise.type === 'chords' || currentExercise.type === 'septachords') {
    chordArea.style.display = 'flex';
    setupChordUI();
  } else if (currentExercise.type === 'modes' || currentExercise.type === 'scales') {
    modeArea.style.display = 'flex';
    setupModeUI();
  } else if (currentExercise.type === 'note_id') {
    noteArea.style.display = 'block';
    setupNoteIdUI();
  } else {
    stdArea.style.display = 'block';
    setupStandardUI();
  }
}

function setupStandardUI() {
  const container = document.getElementById('optionsButtons');
  container.innerHTML = '';
  currentExercise.optionsPool.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = getStructureLabel(opt);
    btn.onclick = () => {
      clearWrongButtons();
      if (opt.name === currentExercise.struct.name) {
        btn.classList.add('correct');
        currentScore += 1;
        document.getElementById('scoreDisplay').innerText = currentScore;
        document.getElementById('feedback').innerText = 'נכון מאוד! ✨';
        document.getElementById('feedback').className = 'feedback success';
        triggerSuccessAndNext();
      } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').innerText = 'נסה שוב...';
        document.getElementById('feedback').className = 'feedback error';
      }
    };
    container.appendChild(btn);
  });
}

function setupChordUI() {
  const typeContainer = document.getElementById('chordTypeButtons');
  const invContainer = document.getElementById('chordInvButtons');
  typeContainer.innerHTML = '';
  invContainer.innerHTML = '';

  currentExercise.optionsPool.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = getStructureLabel(opt);
    btn.onclick = () => checkChordType(opt.name, btn);
    typeContainer.appendChild(btn);
  });

  currentExercise.inversionsPool.forEach(inv => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = inv.name;
    btn.onclick = () => checkChordInv(inv.id, btn);
    invContainer.appendChild(btn);
  });
}

function checkChordType(typeName, btn) {
  clearWrongButtons();
  if (selectedChordType === typeName) return;
  
  if (typeName === currentExercise.struct.name) {
    btn.classList.add('correct');
    selectedChordType = typeName;
    if (!typeAnsweredCorrectly) {
      currentScore += 0.5;
      typeAnsweredCorrectly = true;
      document.getElementById('scoreDisplay').innerText = currentScore;
    }
    document.getElementById('feedback').innerText = 'טיפוס נכון!';
    document.getElementById('feedback').className = 'feedback success';
    checkChordComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'טיפוס שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkChordInv(invId, btn) {
  clearWrongButtons();
  if (invId === currentExercise.inversion) {
    btn.classList.add('correct');
    selectedChordInv = invId;
    document.getElementById('feedback').innerText = 'היפוך נכון!';
    document.getElementById('feedback').className = 'feedback success';
    checkChordComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'היפוך שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkChordComplete() {
  if (selectedChordType === currentExercise.struct.name && selectedChordInv === currentExercise.inversion) {
    currentScore += 0.5;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'מצוין! אקורד הושלם 🎉';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  }
}

function setupModeUI() {
  const rootContainer = document.getElementById('modeNoteNameButtons');
  const typeContainer = document.getElementById('modeTypeButtons');
  rootContainer.innerHTML = '';
  typeContainer.innerHTML = '';

  toggleAccidental('0');

  NOTE_NAMES.forEach((n, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = `${n.eng} / ${n.name}`;
    btn.onclick = () => checkModeNoteName(idx, btn);
    rootContainer.appendChild(btn);
  });

  currentExercise.optionsPool.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = opt.name;
    btn.onclick = () => checkModeType(opt.name, btn);
    typeContainer.appendChild(btn);
  });
}

function checkModeNoteName(nameIdx, btn) {
  clearWrongButtons();
  const rootNote = currentExercise.notes[0];
  
  if (nameIdx === rootNote.nameIndex && parseInt(selectedAccidental) === rootNote.acc) {
    btn.classList.add('correct');
    selectedNoteNameIdx = nameIdx;
    if (!typeAnsweredCorrectly) {
      currentScore += 0.5;
      typeAnsweredCorrectly = true;
      document.getElementById('scoreDisplay').innerText = currentScore;
    }
    document.getElementById('feedback').innerText = 'צליל יסוד נכון!';
    document.getElementById('feedback').className = 'feedback success';
    checkModeComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'צליל יסוד שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkModeType(typeName, btn) {
  clearWrongButtons();
  if (typeName === currentExercise.struct.name) {
    btn.classList.add('correct');
    selectedModeType = typeName;
    document.getElementById('feedback').innerText = 'סוג נכון!';
    document.getElementById('feedback').className = 'feedback success';
    checkModeComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'סוג שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkModeComplete() {
  const rootNote = currentExercise.notes[0];

  if (selectedNoteNameIdx === rootNote.nameIndex && parseInt(selectedAccidental) === rootNote.acc && selectedModeType === currentExercise.struct.name) {
    currentScore += 0.5;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'מצוין! הושלם בהצלחה 🎉';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  }
}

function setupNoteIdUI() {
  const container = document.getElementById('noteNameButtons');
  container.innerHTML = '';
  
  toggleAccidental('0');

  NOTE_NAMES.forEach((n, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = `${n.eng} / ${n.name}`;
    btn.onclick = () => checkNoteAnswer(idx, btn);
    container.appendChild(btn);
  });

  renderPianoKeyboard();
}

function toggleAccidental(val) {
  clearWrongButtons();
  if (selectedAccidental === val) {
    selectedAccidental = '0';
  } else {
    selectedAccidental = val;
  }
  
  const accFlat = document.getElementById('accFlat');
  const accSharp = document.getElementById('accSharp');
  if (accFlat) accFlat.classList.toggle('selected', selectedAccidental === '-1');
  if (accSharp) accSharp.classList.toggle('selected', selectedAccidental === '1');

  const modeAccFlat = document.getElementById('modeAccFlat');
  const modeAccSharp = document.getElementById('modeAccSharp');
  if (modeAccFlat) modeAccFlat.classList.toggle('selected', selectedAccidental === '-1');
  if (modeAccSharp) modeAccSharp.classList.toggle('selected', selectedAccidental === '1');
}

function renderPianoKeyboard() {
  const kb = document.getElementById('pianoKeyboard');
  kb.innerHTML = '';
  
  const keysLayout = [
    { name: 'C', pc: 0, hasBlack: true },
    { name: 'D', pc: 2, hasBlack: true },
    { name: 'E', pc: 4, hasBlack: false },
    { name: 'F', pc: 5, hasBlack: true },
    { name: 'G', pc: 7, hasBlack: true },
    { name: 'A', pc: 9, hasBlack: true },
    { name: 'B', pc: 11, hasBlack: false }
  ];

  keysLayout.forEach((k) => {
    const wKey = document.createElement('div');
    wKey.className = 'key-white';
    wKey.innerText = k.name;
    wKey.onclick = () => checkNoteAnswerByPc(k.pc, wKey);
    kb.appendChild(wKey);

    if (k.hasBlack) {
      const bKey = document.createElement('div');
      bKey.className = 'key-black';
      bKey.onclick = (e) => {
        e.stopPropagation();
        checkNoteAnswerByPc((k.pc + 1) % 12, bKey);
      };
      kb.appendChild(bKey);
    }
  });
}

function checkNoteAnswer(nameIdx, el) {
  clearWrongButtons();
  const correctNote = currentExercise.correctNote;
  const userAcc = parseInt(selectedAccidental);

  if (nameIdx === correctNote.nameIndex && userAcc === correctNote.acc) {
    el.classList.add('correct');
    currentScore += 1;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'נכון מאוד! 🎵';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  } else {
    el.classList.add('wrong');
    document.getElementById('feedback').innerText = 'תו שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkNoteAnswerByPc(pc, el) {
  clearWrongButtons();
  const correctNote = currentExercise.correctNote;
  let targetPc = (DIATONIC_SEMITONES[correctNote.nameIndex] + correctNote.acc + 12) % 12;

  if (targetPc === pc) {
    el.classList.add('correct');
    currentScore += 1;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'נכון מאוד! 🎵';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  } else {
    el.classList.add('wrong');
    document.getElementById('feedback').innerText = 'תו שגוי...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function revealAnswer() {
  if (!currentExercise) return;
  const popover = document.getElementById('helpPopover');
  let text = '';

  if (currentExercise.type === 'note_id') {
    const n = currentExercise.correctNote;
    let name = NOTE_NAMES[n.nameIndex].eng + ' / ' + NOTE_NAMES[n.nameIndex].name;
    let accStr = n.acc === 1 ? ' דיאז' : (n.acc === -1 ? ' במול' : '');
    text = `${name}${accStr}`;
  } else if (currentExercise.type === 'modes' || currentExercise.type === 'scales') {
    const rootNote = currentExercise.notes[0];
    const rootStr = NOTE_NAMES[rootNote.nameIndex].name + (rootNote.acc === 1 ? '♯' : (rootNote.acc === -1 ? '♭' : ''));
    text = `${rootStr} ${currentExercise.struct.name}`;
  } else if (currentExercise.type === 'chords' || currentExercise.type === 'septachords') {
    const invName = INVERSIONS_DATA[currentExercise.type].find(i => i.id === currentExercise.inversion).name;
    text = `${getStructureLabel(currentExercise.struct)} (${invName})`;
  } else {
    text = `${getStructureLabel(currentExercise.struct)}`;
  }

  popover.innerText = text;
  popover.classList.add('visible');
}

onExerciseTypeChange();
if (!loadExerciseFromUrl()) {
  startPractice();
}
</script>
