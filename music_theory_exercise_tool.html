<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>תרגול תורת המוזיקה - מרווחים, אקורדים, היפוכים וסולמות</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 12px 32px 0 rgba(234, 88, 12, 0.08);
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #d97706;
      --text-dark: #431407;
      --text-muted: #78350f;
      --success: #10b981;
      --error: #ef4444;
      --border: #fed7aa;
      --btn-bg: #ffffff;
      --btn-shadow: 0 4px 12px rgba(234, 88, 12, 0.08);
    }

    body.theme-vivid {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --secondary: #c084fc;
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(51, 65, 85, 0.8);
      --btn-bg: #1e293b;
      --btn-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    body.theme-emerald {
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 12px 32px 0 rgba(5, 150, 105, 0.08);
      --primary: #059669;
      --primary-hover: #047857;
      --secondary: #0d9488;
      --text-dark: #064e3b;
      --text-muted: #047857;
      --border: #a7f3d0;
      --btn-bg: #ffffff;
      --btn-shadow: 0 4px 12px rgba(5, 150, 105, 0.08);
    }

    body.theme-violet {
      --bg-gradient: linear-gradient(135deg, #2e1065 0%, #3b0764 100%);
      --card-bg: rgba(88, 28, 135, 0.4);
      --card-shadow: 0 12px 32px 0 rgba(192, 132, 252, 0.15);
      --primary: #c084fc;
      --primary-hover: #a855f7;
      --secondary: #f472b6;
      --text-dark: #faf5ff;
      --text-muted: #e9d5ff;
      --border: rgba(168, 85, 247, 0.3);
      --btn-bg: #3b0764;
      --btn-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    body.theme-ocean {
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 12px 32px 0 rgba(2, 132, 199, 0.08);
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --secondary: #06b6d4;
      --text-dark: #0c4a6e;
      --text-muted: #0369a1;
      --border: #bae6fd;
      --btn-bg: #ffffff;
      --btn-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    body.theme-sunset {
      --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-shadow: 0 12px 32px 0 rgba(225, 29, 72, 0.08);
      --primary: #e11d48;
      --primary-hover: #be123c;
      --secondary: #f43f5e;
      --text-dark: #881337;
      --text-muted: #be123c;
      --border: #fecdd3;
      --btn-bg: #ffffff;
      --btn-shadow: 0 4px 12px rgba(225, 29, 72, 0.08);
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 14px;
      color: var(--text-dark);
      direction: rtl;
      transition: background 0.4s ease, color 0.4s ease;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
    }

    .container { max-width: 900px; margin: 0 auto; flex: 1; width: 100%; }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
    }
    .theme-selector label { font-size: 13px; font-weight: 600; color: var(--text-dark); white-space: nowrap; }
    
    select {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text-dark);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: var(--btn-shadow);
    }
    select:focus { border-color: var(--primary); }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      margin-bottom: 20px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; font-size: 13px; color: var(--text-dark); }

    .tag-selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .tag-selector-header button {
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-weight: 600;
      color: var(--primary);
      transition: all 0.2s;
    }
    .tag-selector-header button:hover { background: var(--primary); color: white; }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding: 8px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tag-pill {
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text-dark);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .btn-main:active { transform: translateY(0); }

    .practice-area { text-align: center; display: none; }
    
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .play-btn, .help-btn, .share-btn {
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: none;
    }

    .play-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    .play-btn:hover { transform: scale(1.03); }

    .help-btn, .share-btn {
      background: var(--btn-bg);
      color: var(--text-dark);
      border: 2px solid var(--border);
      box-shadow: var(--btn-shadow);
    }
    .help-btn:hover, .share-btn:hover { border-color: var(--primary); transform: scale(1.03); }

    .staff-container { 
      background: #ffffff; 
      border-radius: 20px; 
      padding: 16px 8px; 
      border: 1px solid var(--border); 
      margin: 16px 0 20px 0; 
      overflow-x: auto;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }
    .staff-svg { width: 100%; min-width: 320px; max-width: 780px; height: 130px; }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .chord-answers-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.02);
      padding: 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    .opt-btn {
      background: var(--btn-bg);
      border: 2px solid var(--border);
      padding: 12px 10px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-dark);
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
    }
    .opt-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
    .opt-btn.correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .opt-btn.wrong { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }

    .acc-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .acc-btn {
      background: var(--btn-bg);
      border: 2px solid var(--border);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-dark);
      transition: all 0.2s;
    }
    .acc-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }

    .piano-keyboard {
      display: flex;
      justify-content: center;
      position: relative;
      height: 120px;
      margin: 20px auto;
      user-select: none;
      direction: ltr;
      width: fit-content;
      padding: 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 16px;
    }
    .key-white {
      width: 42px;
      height: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
      color: #334155;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
      transition: background 0.1s;
    }
    .key-white:active { background: #f1f5f9; }
    .key-black {
      width: 26px;
      height: 60%;
      background: #1e293b;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      z-index: 2;
      margin-left: -13px;
      margin-right: -13px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: background 0.1s;
    }
    .key-black:active { background: #0f172a; }

    .feedback { font-size: 18px; font-weight: 700; margin-top: 16px; min-height: 28px; }
    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }
    .feedback.info { color: var(--secondary); }

    .stats { font-size: 14px; color: var(--text-muted); margin-top: 12px; font-weight: 600; }

    footer {
      text-align: center;
      padding: 16px 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    footer a:hover {
      text-decoration: underline;
      opacity: 0.85;
    }
  </style>
</head>
<body class="theme-warm">

<div class="container">
  <div class="header-bar">
    <h1>תרגול תורת המוזיקה</h1>
    <div class="theme-selector">
      <label for="themeSelect">🎨 עיצוב:</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="theme-warm" selected>חם (Warm Amber)</option>
        <option value="theme-vivid">מפתח לילה (Modern Dark)</option>
        <option value="theme-emerald">אמרלד (Emerald)</option>
        <option value="theme-violet">סגול ניאון (Cyber Violet)</option>
        <option value="theme-ocean">כחול אוקיינוס (Ocean Blue)</option>
        <option value="theme-sunset">ורוד שקיעה (Sunset Pink)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="controls-grid">
      <div class="control-group">
        <label>סוג התרגיל:</label>
        <select id="exType" onchange="onExerciseTypeChange()">
          <option value="note_id">זיהוי תווים</option>
          <option value="intervals" selected>מרווחים</option>
          <option value="chords">אקורדים משולשים</option>
          <option value="septachords">ספטאקורדים</option>
          <option value="scales">סולמות</option>
        </select>
      </div>

      <div class="control-group" id="intervalFormatGroup">
        <label>תצוגת מרווחים:</label>
        <select id="intervalFormatSelect" onchange="updateOptionsList()">
          <option value="full" selected>מילים מלאות (למשל: סקונדה קטנה)</option>
          <option value="abbr">קיצורים (למשל: 2.ק)</option>
        </select>
      </div>

      <div class="control-group">
        <label>תצוגת התרגיל:</label>
        <select id="displayMode">
          <option value="both">כתוב ומושמע</option>
          <option value="audio_only">מושמע בלבד</option>
        </select>
      </div>

      <div class="control-group">
        <label>כלי נגינה:</label>
        <select id="instrumentSelect">
          <option value="marimba" selected>🪵 מרימבה</option>
          <option value="piano">🎹 פסנתר</option>
          <option value="flute">🪈 חליל</option>
          <option value="synth">🎛️ סינתאיזטור</option>
        </select>
      </div>

      <div class="control-group">
        <label>מפתח:</label>
        <select id="clefSelect">
          <option value="rand" selected>אקראי</option>
          <option value="sol">מפתח סול</option>
          <option value="fa">מפתח פה</option>
        </select>
      </div>

      <div class="control-group" id="accidentalGroup" style="display: none;">
        <label>סימני התק:</label>
        <select id="accidentalSelect">
          <option value="with">עם סימני התק</option>
          <option value="without">ללא סימני התק (רק טבעיים)</option>
        </select>
      </div>

      <div class="control-group" id="playModeGroup">
        <label>נגינת התרגיל:</label>
        <select id="playMode">
          <option value="random" selected>אקראי</option>
          <option value="harmonic">הרמוני (יחד)</option>
          <option value="ascending">מלודי (עולה)</option>
          <option value="descending">מלודי (יורד)</option>
        </select>
      </div>

      <div class="control-group" id="inversionsGroup" style="display: none;">
        <div class="tag-selector-header">
          <label>היפוכים:</label>
          <div>
            <button onclick="selectAllInversions(true)">הכל</button>
            <button onclick="selectAllInversions(false)">נקה</button>
          </div>
        </div>
        <div class="tag-container" id="inversionsTags"></div>
      </div>

      <div class="control-group" id="optionsGroup">
        <div class="tag-selector-header">
          <label id="optionsListLabel">סינון סוגים:</label>
          <div>
            <button onclick="selectAllOptions(true)">הכל</button>
            <button onclick="selectAllOptions(false)">נקה</button>
          </div>
        </div>
        <div class="tag-container" id="optionsTags"></div>
      </div>
    </div>

    <button class="btn-main" onclick="startPractice()">צור תרגיל חדש ➔</button>
  </div>

  <div class="card practice-area" id="practiceArea">
    <div class="action-bar">
      <button class="play-btn" id="playAudioBtn" onclick="playCurrentExercise()">🎵 השמע תרגיל</button>
      <button class="share-btn" onclick="shareCurrentExercise()">🔗 שתף תרגיל זה</button>
      <button class="help-btn" onclick="revealAnswer()">💡 עזור לי</button>
    </div>
    
    <div class="staff-container" id="staffContainer">
      <svg id="staffSvg" class="staff-svg" viewBox="0 0 520 100"></svg>
    </div>

    <div id="standardAnswersArea">
      <div class="options-grid" id="optionsButtons"></div>
    </div>

    <div id="chordAnswersArea" class="chord-answers-container" style="display: none;">
      <div class="section-title">1. בחירת טיפוס האקורד (חצי נקודה):</div>
      <div class="options-grid" id="chordTypeButtons"></div>
      <div class="section-title">2. בחירת ההיפוך:</div>
      <div class="options-grid" id="chordInvButtons"></div>
    </div>

    <div id="noteIdAnswersArea" style="display: none;">
      <div class="acc-selector">
        <button class="acc-btn" id="accFlat" onclick="toggleAccidental('-1')">במול (♭)</button>
        <button class="acc-btn selected" id="accNatural" onclick="toggleAccidental('0')">טבעי</button>
        <button class="acc-btn" id="accSharp" onclick="toggleAccidental('1')">דיאז (♯)</button>
      </div>
      <div class="options-grid" id="noteNameButtons"></div>
      <div class="piano-keyboard" id="pianoKeyboard"></div>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="stats" id="stats">ניקוד מצטבר: <span id="scoreDisplay">0</span></div>
  </div>
</div>

<footer>
  נעם ברטוב <a href="https://noambartov.com" target="_blank" rel="noopener noreferrer">noambartov.com</a>
</footer>

<script>
const NOTE_NAMES = [
  { name: 'דו', eng: 'C', pc: 0 },
  { name: 'רה', eng: 'D', pc: 2 },
  { name: 'מי', eng: 'E', pc: 4 },
  { name: 'פה', eng: 'F', pc: 5 },
  { name: 'סול', eng: 'G', pc: 7 },
  { name: 'לה', eng: 'A', pc: 9 },
  { name: 'סי', eng: 'B', pc: 11 }
];

const BASE_STRUCTURES = {
  intervals: [
    { name: 'פרימה זכה', abbr: '1.ז', stepOffsets: [0, 0], semitones: [0, 0] },
    { name: 'סקונדה קטנה', abbr: '2.ק', stepOffsets: [0, 1], semitones: [0, 1] },
    { name: 'סקונדה גדולה', abbr: '2.ג', stepOffsets: [0, 1], semitones: [0, 2] },
    { name: 'טרצה קטנה', abbr: '3.ק', stepOffsets: [0, 2], semitones: [0, 3] },
    { name: 'טרצה גדולה', abbr: '3.ג', stepOffsets: [0, 2], semitones: [0, 4] },
    { name: 'קוורטה זכה', abbr: '4.ז', stepOffsets: [0, 3], semitones: [0, 5] },
    { name: 'קוורטה מוגדלת', abbr: '4.מוג', stepOffsets: [0, 3], semitones: [0, 6] },
    { name: 'קווינטה מוקטנת', abbr: '5.מוק', stepOffsets: [0, 4], semitones: [0, 6] },
    { name: 'קווינטה זכה', abbr: '5.ז', stepOffsets: [0, 4], semitones: [0, 7] },
    { name: 'קווינטה מוגדלת', abbr: '5.מוג', stepOffsets: [0, 4], semitones: [0, 8] },
    { name: 'סקסטה קטנה', abbr: '6.ק', stepOffsets: [0, 5], semitones: [0, 8] },
    { name: 'סקסטה גדולה', abbr: '6.ג', stepOffsets: [0, 5], semitones: [0, 9] },
    { name: 'ספטימה קטנה', abbr: '7.ק', stepOffsets: [0, 6], semitones: [0, 10] },
    { name: 'ספטימה גדולה', abbr: '7.ג', stepOffsets: [0, 6], semitones: [0, 11] },
    { name: 'אוקטבה זכה', abbr: '8.ז', stepOffsets: [0, 7], semitones: [0, 12] }
  ],
  chords: [
    { name: 'מז׳ור', stepOffsets: [0, 2, 4], semitones: [0, 4, 7] },

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playInstrumentNote(freq, startTime, duration = 1.2) {
  const ctx = getAudioContext();
  const inst = document.getElementById('instrumentSelect').value;

  if (inst === 'marimba') {
    const partials = [
      { ratio: 1.0, gain: 1.0, decay: duration },
      { ratio: 3.9, gain: 0.4, decay: duration * 0.2 },
      { ratio: 9.8, gain: 0.15, decay: duration * 0.08 }
    ];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * p.ratio, startTime);
      gainNode.gain.setValueAtTime(0, startTime);
      gainNode.gain.linearRampToValueAtTime(p.gain * 0.35, startTime + 0.005);
      gainNode.gain.exponentialRampToValueAtTime(0.00001, startTime + p.decay);
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + p.decay);
    });
  } else if (inst === 'piano') {
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc1.type = 'triangle';
    osc2.type = 'sine';
    osc1.frequency.setValueAtTime(freq, startTime);
    osc2.frequency.setValueAtTime(freq * 2, startTime);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.4, startTime + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 1.5);
    osc1.connect(gainNode);
    osc2.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc1.start(startTime);
    osc2.start(startTime);
    osc1.stop(startTime + duration * 1.5);
    osc2.stop(startTime + duration * 1.5);
  } else if (inst === 'flute') {
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.08);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  } else {
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, startTime);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.25, startTime + 0.01);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }
}

function getNoteDetails(absLine, acc, clef) {
  let baseIndex = (clef === 'sol') ? 2 : 4; 
  let diatonicIdx = baseIndex + absLine;
  let nameIndex = (diatonicIdx % 7 + 7) % 7;
  let octave = Math.floor(diatonicIdx / 7) + (clef === 'sol' ? 4 : 2);
  let midiNum = (octave + 1) * 12 + DIATONIC_SEMITONES[nameIndex] + acc;
  return { absLine, acc, diatonicIdx, midiNum, nameIndex };
}

function buildNotes(baseLine, baseAcc, struct, clef, inversionShift = 0) {
  let baseDetails = getNoteDetails(baseLine, baseAcc, clef);
  let rawNotes = [];
  
  struct.stepOffsets.forEach((step, idx) => {
    let line = baseLine + step;
    let diatonicIdx = ((clef === 'sol' ? 2 : 4) + line);
    let nameIdx = (diatonicIdx % 7 + 7) % 7;
    let octave = Math.floor(diatonicIdx / 7) + (clef === 'sol' ? 4 : 2);
    
    let targetSemitones = struct.semitones[idx];
    let naturalSemitones = DIATONIC_SEMITONES[nameIdx] + (octave * 12);
    let rootNatural = DIATONIC_SEMITONES[(baseDetails.diatonicIdx % 7 + 7) % 7] + (Math.floor(baseDetails.diatonicIdx / 7) + (clef === 'sol' ? 4 : 2)) * 12 + baseAcc;
    
    let requiredAcc = (rootNatural + targetSemitones) - naturalSemitones;
    rawNotes.push({ line, acc: requiredAcc });
  });

  if (inversionShift > 0) {
    for (let i = 0; i < inversionShift; i++) {
      let shifted = rawNotes.shift();
      shifted.line += 7;
      rawNotes.push(shifted);
    }
  }

  return rawNotes.map(n => getNoteDetails(n.line, n.acc, clef));
}

function generateExercise() {
  const type = document.getElementById('exType').value;
  let clefSelectVal = document.getElementById('clefSelect').value;
  let clef = clefSelectVal === 'rand' ? (Math.random() < 0.5 ? 'sol' : 'fa') : clefSelectVal;

  if (type === 'note_id') {
    const accOption = document.getElementById('accidentalSelect').value;
    let acc = 0;
    if (accOption === 'with') {
      acc = Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0;
    }
    let line = Math.floor(Math.random() * 9) - 2;
    let note = getNoteDetails(line, acc, clef);
    return { type, clef, notes: [note], correctNote: note };
  }

  const activeOptionPills = Array.from(document.querySelectorAll('#optionsTags .tag-pill.active')).map(el => el.dataset.value);
  if (activeOptionPills.length === 0) {
    alert("יש לבחור לפחות אפשרות אחת לתרגול!");
    return null;
  }

  let activeInvPills = [0];
  if (type === 'chords' || type === 'septachords') {
    activeInvPills = Array.from(document.querySelectorAll('#inversionsTags .tag-pill.active')).map(el => parseInt(el.dataset.value));
    if (activeInvPills.length === 0) {
      alert("יש לבחור לפחות היפוך אחד לתרגול!");
      return null;
    }
  }

  const poolStructs = BASE_STRUCTURES[type].filter(s => activeOptionPills.includes(s.name));
  const chosenStruct = poolStructs[Math.floor(Math.random() * poolStructs.length)];
  const chosenInversion = activeInvPills[Math.floor(Math.random() * activeInvPills.length)];

  let baseLine = (clef === 'sol') ? Math.floor(Math.random() * 3) - 2 : Math.floor(Math.random() * 3) - 1;
  let baseAcc = Math.random() < 0.25 ? (Math.random() < 0.5 ? -1 : 1) : 0;
  let notes = buildNotes(baseLine, baseAcc, chosenStruct, clef, chosenInversion);

  return {
    type,
    struct: chosenStruct,
    clef,
    notes,
    inversion: chosenInversion,
    optionsPool: poolStructs,
    inversionsPool: INVERSIONS_DATA[type] ? INVERSIONS_DATA[type].filter(i => activeInvPills.includes(i.id)) : []
  };
}

function renderStaff(ex) {
  const container = document.getElementById('staffContainer');
  const dispMode = document.getElementById('displayMode').value;

  if (dispMode === 'audio_only') {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';

  const svg = document.getElementById('staffSvg');
  svg.innerHTML = '';

  const isScale = ex.type === 'scales';
  const startX = isScale ? 55 : 260;
  const spacing = isScale ? 52 : 0;

  for (let i = 0; i < 5; i++) {
    let y = 51 - i * 8;
    svg.innerHTML += `<line x1="20" y1="${y}" x2="500" y2="${y}" stroke="currentColor" opacity="0.3" stroke-width="1"/>`;
  }
  svg.innerHTML += `<line x1="20" y1="19" x2="20" y2="51" stroke="currentColor" opacity="0.3" stroke-width="2"/>`;
  svg.innerHTML += `<line x1="500" y1="19" x2="500" y2="51" stroke="currentColor" opacity="0.3" stroke-width="2"/>`;

  const clefPath = ex.clef === 'sol' 
    ? `<g transform="translate(25, 28) scale(0.125)"><path d="M 14 185 C 35 185 54 167 54 140 C 54 110 30 90 4 90 C -25 90 -45 112 -45 145 C -45 185 -10 220 30 220 C 75 220 105 180 105 125 C 105 50 40 -15 15 -75 C 5 -100 15 -130 35 -130 C 45 -130 55 -115 50 -90 C 40 -40 0 50 -5 120 L -5 270 C -5 295 -25 315 -50 315 C -65 315 -80 300 -80 285 C -80 270 -65 255 -50 255 C -40 255 -30 265 -25 275" fill="none" stroke="currentColor" stroke-width="9.5"/></g>`
    : `<g transform="translate(25, 19) scale(0.65)"><path d="M 12 12 C 12 6, 22 6, 22 14 C 22 22, 10 26, 10 38" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="11" cy="12" r="3.5" fill="currentColor"/><circle cx="27" cy="10" r="2.5" fill="currentColor"/><circle cx="27" cy="22" r="2.5" fill="currentColor"/></g>`;
  svg.innerHTML += clefPath;

  let accShiftOffset = 0;

  ex.notes.forEach((n, idx) => {
    let y = 51 - n.absLine * 4;
    let x = startX + (idx * spacing);

    if (!isScale && idx > 0) {
      const isSecond = Math.abs(ex.notes[idx].absLine - ex.notes[idx-1].absLine) === 1;
      if (isSecond) x += 11;
    }

    if (n.absLine < 0) {
      for (let l = -2; l >= n.absLine; l -= 2) {
        let ly = 51 - l * 4;
        svg.innerHTML += `<line x1="${x-10}" y1="${ly}" x2="${x+10}" y2="${ly}" stroke="currentColor" stroke-width="1.2"/>`;
      }
    } else if (n.absLine > 8) {
      for (let l = 10; l <= n.absLine; l += 2) {
        let ly = 51 - l * 4;
        svg.innerHTML += `<line x1="${x-10}" y1="${ly}" x2="${x+10}" y2="${ly}" stroke="currentColor" stroke-width="1.2"/>`;
      }
    }

    if (n.acc !== 0) {
      let sym = n.acc === 1 ? '♯' : '♭';
      let accXOffset = isScale ? 16 : (16 + (accShiftOffset * 13));
      svg.innerHTML += `<text x="${x - accXOffset}" y="${y}" font-size="17" font-weight="bold" dominant-baseline="central" text-anchor="middle" fill="currentColor">${sym}</text>`;
      accShiftOffset++;
    }

    svg.innerHTML += `<ellipse cx="${x}" cy="${y}" rx="5.5" ry="4" fill="currentColor" transform="rotate(-20 ${x} ${y})"/>`;
  });
}

function playCurrentExercise() {
  if (!currentExercise) return;
  const freqs = currentExercise.notes.map(n => midiToFreq(n.midiNum));
  const ctx = getAudioContext();

  if (currentExercise.type === 'scales') {
    const now = ctx.currentTime + 0.05;
    freqs.forEach((f, idx) => playInstrumentNote(f, now + idx * 0.35, 0.8));
    const scaleDesc = [...freqs].reverse().slice(1);
    scaleDesc.forEach((f, idx) => playInstrumentNote(f, now + (freqs.length + idx) * 0.35, 0.8));
    return;
  }

  const modeSelect = document.getElementById('playMode').value;
  let mode = modeSelect;
  if (mode === 'random') {
    const modes = ['harmonic', 'ascending', 'descending'];
    mode = modes[Math.floor(Math.random() * modes.length)];
  }

  const now = ctx.currentTime + 0.05;
  if (mode === 'harmonic') {
    freqs.forEach(f => playInstrumentNote(f, now, 1.5));
  } else if (mode === 'ascending') {
    freqs.forEach((f, idx) => playInstrumentNote(f, now + idx * 0.4, 1.0));
  } else if (mode === 'descending') {
    [...freqs].reverse().forEach((f, idx) => playInstrumentNote(f, now + idx * 0.4, 1.0));
  }
}

  document.getElementById('practiceArea').style.display = 'block';
  document.getElementById('feedback').innerText = '';
  document.getElementById('feedback').className = 'feedback';

  selectedChordInv = null;
  typeAnsweredCorrectly = false;

  renderStaff(currentExercise);
  setupAnswerUI();
}

function setupAnswerUI() {
  const stdArea = document.getElementById('standardAnswersArea');
  const chordArea = document.getElementById('chordAnswersArea');
  const noteArea = document.getElementById('noteIdAnswersArea');

  stdArea.style.display = 'none';
  chordArea.style.display = 'none';
  noteArea.style.display = 'none';

  if (currentExercise.type === 'chords' || currentExercise.type === 'septachords') {
    chordArea.style.display = 'flex';
    setupChordUI();
  } else if (currentExercise.type === 'note_id') {
    noteArea.style.display = 'block';
    setupNoteIdUI();
  } else {
    stdArea.style.display = 'block';
    setupStandardUI();
  }
}

function setupStandardUI() {
  const container = document.getElementById('optionsButtons');
  container.innerHTML = '';
  currentExercise.optionsPool.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = getStructureLabel(opt);
    btn.onclick = () => {
      if (opt.name === currentExercise.struct.name) {
        btn.classList.add('correct');
        currentScore += 1;
        document.getElementById('scoreDisplay').innerText = currentScore;
        document.getElementById('feedback').innerText = 'תשובה נכונה! ✨';
        document.getElementById('feedback').className = 'feedback success';
        setTimeout(startPractice, 1200);
      } else {
        btn.classList.add('wrong');
        document.getElementById('feedback').innerText = 'טעות, נסה שוב...';
        document.getElementById('feedback').className = 'feedback error';
      }
    };
    container.appendChild(btn);
  });
}

function setupChordUI() {
  const typeContainer = document.getElementById('chordTypeButtons');
  const invContainer = document.getElementById('chordInvButtons');
  typeContainer.innerHTML = '';
  invContainer.innerHTML = '';

  currentExercise.optionsPool.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = getStructureLabel(opt);
    btn.onclick = () => checkChordType(opt.name, btn);
    typeContainer.appendChild(btn);
  });

  currentExercise.inversionsPool.forEach(inv => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = inv.name;
    btn.onclick = () => checkChordInv(inv.id, btn);
    invContainer.appendChild(btn);
  });
}

function checkChordType(typeName, btn) {
  if (selectedChordType === typeName) return;
  
  if (typeName === currentExercise.struct.name) {
    btn.classList.add('correct');
    selectedChordType = typeName;
    if (!typeAnsweredCorrectly) {
      currentScore += 0.5;
      typeAnsweredCorrectly = true;
      document.getElementById('scoreDisplay').innerText = currentScore;
    }
    document.getElementById('feedback').innerText = 'טיפוס נכון (+0.5 pt)! בחר כעת היפוך.';
    document.getElementById('feedback').className = 'feedback success';
    checkChordComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'טיפוס שגוי, נסה שוב...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkChordInv(invId, btn) {
  if (invId === currentExercise.inversion) {
    btn.classList.add('correct');
    selectedChordInv = invId;
    document.getElementById('feedback').innerText = 'היפוך נכון!';
    document.getElementById('feedback').className = 'feedback success';
    checkChordComplete();
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText = 'היפוך שגוי, נסה שוב...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkChordComplete() {
  if (selectedChordType === currentExercise.struct.name && selectedChordInv === currentExercise.inversion) {
    currentScore += 0.5;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'כל הכבוד! אקורד מבוצע בהצלחה! 🎉';
    document.getElementById('feedback').className = 'feedback success';
    setTimeout(startPractice, 1200);
  }
}

function toggleAccidental(val) {
  selectedAccidental = val;
  document.getElementById('accFlat').classList.toggle('selected', val === '-1');
  document.getElementById('accNatural').classList.toggle('selected', val === '0');
  document.getElementById('accSharp').classList.toggle('selected', val === '1');
}

function renderPianoKeyboard() {
  const kb = document.getElementById('pianoKeyboard');
  kb.innerHTML = '';
  
  const keysLayout = [
    { name: 'C', pc: 0, hasBlack: true },
    { name: 'D', pc: 2, hasBlack: true },
    { name: 'E', pc: 4, hasBlack: false },
    { name: 'F', pc: 5, hasBlack: true },
    { name: 'G', pc: 7, hasBlack: true },
    { name: 'A', pc: 9, hasBlack: true },
    { name: 'B', pc: 11, hasBlack: false },
    { name: 'C', pc: 0, hasBlack: false }
  ];

  keysLayout.forEach((k) => {
    const wKey = document.createElement('div');
    wKey.className = 'key-white';
    wKey.innerText = k.name;
    wKey.onclick = () => checkNoteAnswer(k.pc, 0, wKey);
    kb.appendChild(wKey);

    if (k.hasBlack) {
      const bKey = document.createElement('div');
      bKey.className = 'key-black';
      bKey.onclick = (e) => {
        e.stopPropagation();
        checkNoteAnswer((k.pc + 1) % 12, 0, bKey);
      };
      kb.appendChild(bKey);
    }
  });
}

function checkNoteAnswer(pc, acc, el) {
  const correctNote = currentExercise.correctNote;
  let targetPc = (DIATONIC_SEMITONES[correctNote.nameIndex] + correctNote.acc + 12) % 12;
  let userPc = (pc + acc + 12) % 12;

  if (targetPc === userPc) {
    el.classList.add('correct');
    currentScore += 1;
    document.getElementById('scoreDisplay').innerText = currentScore;
    document.getElementById('feedback').innerText = 'זיהוי תו מדויק! 🎵';
    document.getElementById('feedback').className = 'feedback success';
    setTimeout(startPractice, 1200);
  } else {
    el.classList.add('wrong');
    document.getElementById('feedback').innerText = 'תו שגוי, נסה שוב...';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function revealAnswer() {
  if (!currentExercise) return;
  const fb = document.getElementById('feedback');
  fb.className = 'feedback info';

  if (currentExercise.type === 'note_id') {
    const n = currentExercise.correctNote;
    let name = NOTE_NAMES[n.nameIndex].eng + ' / ' + NOTE_NAMES[n.nameIndex].name;
    let accStr = n.acc === 1 ? ' דיאז' : (n.acc === -1 ? ' במול' : '');
    fb.innerText = `התו הנכון הוא: ${name}${accStr}`;
  } else if (currentExercise.type === 'chords' || currentExercise.type === 'septachords') {
    const invName = INVERSIONS_DATA[currentExercise.type].find(i => i.id === currentExercise.inversion).name;
    fb.innerText = `התשובה: ${getStructureLabel(currentExercise.struct)} (${invName})`;
  } else {
    fb.innerText = `התשובה הנכונה: ${getStructureLabel(currentExercise.struct)}`;
  }
  setTimeout(startPractice, 2500);
}

onExerciseTypeChange();
if (!loadExerciseFromUrl()) {
  startPractice();
}
</script>
