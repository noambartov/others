<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>תרגול תורת המוזיקה - מעודכן</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="תורת המוזיקה">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap');

    :root {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #171717;
      --primary-hover: #000000;
      --secondary: #404040;
      --text-dark: #171717;
      --text-muted: #525252;
      --success: #16a34a;
      --error: #dc2626;
      --border: 1px solid #e5e5e5;
      --btn-bg: #ffffff;
      --btn-color: #171717;
      --radius-card: 16px;
      --radius-btn: 10px;
    }

    /* ערכה מודרנית — זהה לדפי התרגול */
    body.theme-modern {
      --bg-gradient: #f1f5f9;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #2563eb;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
      --border: 1px solid #e2e8f0;
      --btn-bg: #ffffff;
      --btn-color: #334155;
      --radius-card: 14px;
      --radius-btn: 10px;
      --staff-line: #94a3b8;
    }
    body.theme-modern h1 {
      background: none;
      -webkit-text-fill-color: initial;
      color: var(--text-dark);
      font-weight: 600;
    }
    body.theme-modern .eyebrow { display: block; }
    body.theme-modern .btn-main,
    body.theme-modern .play-btn { background: var(--primary); color: #fff; border-color: var(--primary); }
    body.theme-modern #playFirstNoteBtn { background: var(--btn-bg); color: var(--primary); border-color: #bfdbfe; }
    body.theme-modern .btn-main:hover,
    body.theme-modern .play-btn:hover { background: var(--primary-hover); }
    body.theme-modern .opt-btn,
    body.theme-modern .next-btn,
    body.theme-modern .help-btn,
    body.theme-modern .share-btn,
    body.theme-modern .acc-btn { font-weight: 500; }
    body.theme-modern .opt-btn:hover { border-color: #93c5fd; background: #eff6ff; }
    body.theme-modern .tag-pill.active { background: var(--primary); border-color: var(--primary); }
    body.theme-modern .staff-container { box-shadow: none; border-color: #e2e8f0; }
    body.theme-modern details,
    body.theme-modern .chord-answers-container,
    body.theme-modern .mode-answers-container { background: #f8fafc; }
    body.theme-modern .section-title { font-weight: 600; color: #0f172a; }

    /* ערכה נקייה (ברירת מחדל): חמשה גדולה במרכז, תשובות כאריחים אפורים, בלי צבעים */
    body.theme-clean {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #222222;
      --primary-hover: #000000;
      --secondary: #555555;
      --text-dark: #222222;
      --text-muted: #999999;
      --success: #222222;
      --error: #999999;
      --border: none;
      --btn-bg: #efefef;
      --btn-color: #222222;
      --radius-btn: 6px;
      --staff-line: #8c8c8c;
    }
    body.theme-clean .container { max-width: 820px; }
    body.theme-clean .topbar {
      position: relative;
      border-bottom: 1px solid #eeeeee;
      padding: 10px 0;
      min-height: 22px;
    }
    body.theme-clean .topscore { position: absolute; left: 0; top: 10px; font-size: 15px; color: var(--text-muted); }
    body.theme-clean details { background: none; border: none; padding: 0; margin: 0; }
    body.theme-clean summary { color: #555555; font-weight: 500; font-size: 15px; list-style: none; display: inline-block; }
    body.theme-clean summary::-webkit-details-marker { display: none; }
    body.theme-clean details[open] summary { color: var(--text-dark); }
    body.theme-clean details[open] { padding-bottom: 6px; }
    body.theme-clean .controls-grid { margin-top: 12px; }
    body.theme-clean .btn-main { margin-top: 12px; background: #222222; color: #ffffff; border: none; border-radius: 6px; font-weight: 500; box-shadow: none; }
    body.theme-clean .btn-main:hover { background: #000000; transform: none; }
    body.theme-clean select { border: 1px solid #e2e2e2; box-shadow: none; }
    body.theme-clean .tag-selector-header button { font-weight: 400; color: #777777; }
    body.theme-clean .tag-pill { background: #ffffff; border: 1px solid #e6e6e6; color: #999999; }
    body.theme-clean .tag-pill.active { background: #e6e6e6; border-color: #e6e6e6; color: #222222; }
    body.theme-clean .card { background: none; border: none; box-shadow: none; padding: 0; }
    body.theme-clean .practice-area { padding: 0; }
    body.theme-clean .staff-container { border: none; background: none; box-shadow: none; padding: 30px 0 10px; }
    body.theme-clean .staff-svg { height: 170px; }
    body.theme-clean .action-bar { order: 9; gap: 26px; }
    body.theme-clean .play-btn,
    body.theme-clean .next-btn,
    body.theme-clean .help-btn,
    body.theme-clean .share-btn {
      background: none; border: none; box-shadow: none; color: #777777;
      padding: 2px 0; font-weight: 500; font-size: 14px;
    }
    body.theme-clean .play-btn:hover,
    body.theme-clean .next-btn:hover,
    body.theme-clean .help-btn:hover,
    body.theme-clean .share-btn:hover { color: #222222; transform: none; }
    body.theme-clean .help-popover { background: #ffffff; color: #222222; border: 1px solid #e2e2e2; box-shadow: none; font-size: 13px; font-weight: 400; }
    body.theme-clean .chord-answers-container,
    body.theme-clean .mode-answers-container { background: none; border: none; padding: 0; gap: 8px; }
    body.theme-clean .section-title { text-align: center; color: var(--text-muted); font-weight: 400; font-size: 13px; }
    body.theme-clean .options-grid { --gap: 8px; }
    body.theme-clean .opt-btn { font-weight: 400; font-size: 14px; padding: 12px 6px; }
    body.theme-clean .opt-btn:hover { background: #e2e2e2; }
    body.theme-clean .opt-btn.correct { background: #222222 !important; color: #ffffff !important; }
    .big-play-wrap { flex-direction: column; align-items: center; gap: 10px; padding: 30px 0 10px; }
    .big-play {
      width: 104px; height: 104px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--primary); color: #ffffff; display: flex; align-items: center; justify-content: center;
      padding-inline-start: 6px; direction: ltr;
    }
    .big-play:hover { background: var(--primary-hover); }
    .big-play:active { transform: scale(0.96); }
    .big-play-label { font-size: 14px; color: var(--text-muted); }
    .silent-tip { max-width: 300px; margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--text-muted); text-align: center; }
    .silent-tip button { background: none; border: none; padding: 0 4px; font: inherit; color: var(--text-dark); text-decoration: underline; cursor: pointer; }
    .mode-tabs { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 18px; white-space: nowrap; }
    .mode-tabs button { background: none; border: none; padding: 2px 0; font: inherit; font-size: 15px; color: var(--text-muted); cursor: pointer; transition: color .15s; }
    .mode-tabs button:hover, .mode-tabs button.active { color: var(--text-dark); }
    /* קריאה ושמיעה נבחרות בסרגל האתר; כאן נשארים רק חופשי / לפי שלבים בתוך השמיעה */
    .mode-tabs button[data-mode="read"], body.mode-read .mode-tabs { display: none; }
    @media (max-width: 480px) {
      .mode-tabs { gap: 12px; }
      .mode-tabs button { font-size: 14px; }
    }
    .ex-types { display: flex; justify-content: center; gap: 16px; padding: 10px 0 4px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .ex-types::-webkit-scrollbar { display: none; }
    .ex-types button { background: none; border: none; padding: 2px 0; font: inherit; font-size: 14px; color: var(--text-muted); cursor: pointer; flex: none; transition: color .15s; }
    .ex-types button:hover, .ex-types button.active { color: var(--text-dark); }
    @media (max-width: 480px) {
      .ex-types { gap: 12px; justify-content: flex-start; }
      .ex-types button { font-size: 13px; }
    }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .seg button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; background: #ffffff; border: 1px solid #e6e6e6; color: #999999; }
    .seg button.active { background: #e6e6e6; color: #222222; }
    body.mode-read .ear-only-setting { display: none !important; }
    body.mode-train #intervalFormatGroup { display: flex !important; }
    body.mode-ear .read-only-setting,
    body.mode-train .read-only-setting,
    body.mode-ear .read-only-opt,
    body.mode-train .read-only-opt,
    body.mode-train .no-train { display: none !important; }
    body:not(.in-session) .train-only { display: none !important; }
    body.mode-train .container { justify-content: flex-start; }
    body.in-session .no-train { display: none !important; }

    .training-panel { text-align: right; padding: 28px 0 24px; backdrop-filter: none; }
    .training-panel h2 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
    .training-panel .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 20px; }
    .level-list { display: grid; gap: 8px; }
    .level-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: var(--btn-bg); border: none; border-radius: 6px; padding: 14px 16px;
      font: inherit; text-align: right; cursor: pointer; color: var(--text-dark);
    }
    .level-item:hover { background: #e2e2e2; }
    .level-item .lv-name { font-size: 16px; font-weight: 500; }
    .level-item .lv-desc { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .level-item .lv-best { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
    .report-score { font-size: 44px; font-weight: 300; margin: 8px 0 0; }
    .report-section { margin-top: 26px; }
    .report-section h3 { font-size: 13px; font-weight: 400; color: var(--text-muted); margin: 0 0 10px; border-bottom: 1px solid #eeeeee; padding-bottom: 6px; }
    .report-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; align-items: center; gap: 12px; font-size: 14px; padding: 5px 0; }
    .report-bar { height: 6px; background: #efefef; border-radius: 3px; overflow: hidden; }
    .report-bar > span { display: block; height: 100%; background: #222222; }
    .report-row .num { color: var(--text-muted); text-align: left; font-size: 13px; }
    .report-list { margin: 0; padding: 0 18px 0 0; font-size: 14px; line-height: 1.8; }
    .report-advice { font-size: 15px; line-height: 1.6; }
    .shared-note { text-align: center; font-size: 14px; color: var(--text-muted); margin: 4px 0 0; }
    .share-dialog { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .share-dialog[hidden] { display: none; }
    .share-box { background: #ffffff; color: #222222; border-radius: 8px; padding: 22px; width: 100%; max-width: 420px; box-sizing: border-box; }
    .share-box h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .share-desc { margin: 0 0 12px; font-size: 14px; color: #777777; }
    .share-summary { margin: 0 0 12px; font-size: 15px; }
    .share-box input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 10px; border: 1px solid #e2e2e2; border-radius: 6px; color: #555555; background: #fafafa; }
    .share-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .share-actions button, .share-actions a { border: none; border-radius: 6px; padding: 10px 16px; font: inherit; font-size: 14px; cursor: pointer; background: #efefef; color: #222222; text-decoration: none; }
    .share-actions .primary { background: #222222; color: #ffffff; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .report-actions button { border: none; border-radius: 6px; padding: 12px 18px; font: inherit; cursor: pointer; background: var(--btn-bg); color: var(--text-dark); }
    .report-actions button.primary { background: #222222; color: #ffffff; }
    .opt-btn.pending { box-shadow: inset 0 0 0 2px var(--primary); }
    body.theme-clean .opt-btn.wrong { background: #ffffff !important; color: #bbbbbb !important; border: none !important; text-decoration: line-through; }
    body.theme-clean .acc-btn { font-weight: 400; font-size: 14px; padding: 6px 14px; border-radius: 6px; }
    body.theme-clean .acc-btn.selected { background: #222222; color: #ffffff; }
    body.theme-clean .piano-keyboard { background: none; border: none; }
    body.theme-clean .key-white { border-color: #d4d4d4; color: #777777; font-weight: 400; }
    body.theme-clean .key-black { background: #333333; }
    body.theme-clean .feedback { font-weight: 400; font-size: 15px; color: #555555; }
    body.theme-clean footer { font-weight: 400; color: #aaaaaa; }
    body.theme-clean footer a { color: #888888; }
    body.theme-clean footer a:hover { color: #222222; }

    /* ערכת חם / WARM */
    body.theme-warm {
      --bg-gradient: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-shadow: 0 4px 16px rgba(234, 88, 12, 0.08);
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #d97706;
      --text-dark: #431407;
      --text-muted: #78350f;
      --success: #10b981;
      --error: #ef4444;
      --border: 1px solid #fed7aa;
      --btn-bg: #ffffff;
      --btn-color: #431407;
    }

    /* ערכת לילה / VIVID */
    body.theme-vivid {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.37);
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --secondary: #c084fc;
      --text-dark: #f8fafc;
      --text-muted: #94a3b8;
      --border: 1px solid rgba(51, 65, 85, 0.8);
      --btn-bg: #1e293b;
      --btn-color: #f8fafc;
    }

    /* ערכת אוקיינוס / OCEAN */
    body.theme-ocean {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 4px 16px rgba(3, 105, 161, 0.1);
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --secondary: #0d9488;
      --text-dark: #0c4a6e;
      --text-muted: #0369a1;
      --border: 1px solid #7dd3fc;
      --btn-bg: #ffffff;
      --btn-color: #0c4a6e;
    }

    /* ערכה: לבן בלבד (נקי, ללא צבע וללא צל) */
    body.theme-white-clean {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #171717;
      --primary-hover: #000000;
      --secondary: #404040;
      --text-dark: #171717;
      --text-muted: #525252;
      --success: #16a34a;
      --error: #dc2626;
      --border: 1px solid #e5e5e5;
      --btn-bg: #ffffff;
      --btn-color: #171717;
    }

    /* ערכה: לבן עם קווים עדינים ובלתי אחידים (עיפרון דק ידני) */
    body.theme-pencil-thin {
      --bg-gradient: #ffffff;
      --card-bg: #ffffff;
      --card-shadow: none;
      --primary: #262626;
      --primary-hover: #000000;
      --secondary: #525252;
      --text-dark: #1a1a1a;
      --text-muted: #525252;
      --success: #15803d;
      --error: #b91c1c;
      --border: 1px solid #737373;
      --btn-bg: #ffffff;
      --btn-color: #1a1a1a;
      --radius-card: 255px 15px 225px 15px/15px 225px 15px 255px;
      --radius-btn: 255px 12px 225px 10px/12px 225px 10px 255px;
    }

    body.theme-pencil-thin .card,
    body.theme-pencil-thin .opt-btn,
    body.theme-pencil-thin .play-btn,
    body.theme-pencil-thin .next-btn,
    body.theme-pencil-thin .help-btn,
    body.theme-pencil-thin .share-btn,
    body.theme-pencil-thin .tag-pill,
    body.theme-pencil-thin .theme-selector,
    body.theme-pencil-thin .staff-container,
    body.theme-pencil-thin select,
    body.theme-pencil-thin details,
    body.theme-pencil-thin .tag-container,
    body.theme-pencil-thin .chord-answers-container,
    body.theme-pencil-thin .piano-keyboard,
    body.theme-pencil-thin .acc-btn {
      border-top: 1.2px solid #525252 !important;
      border-right: 0.8px solid #737373 !important;
      border-bottom: 1.4px solid #404040 !important;
      border-left: 0.9px solid #737373 !important;
      border-radius: var(--radius-btn);
    }

    body.theme-pencil-thin .card {
      border-radius: var(--radius-card);
    }

    body.theme-white-clean h1,
    body.theme-pencil-thin h1 {
      background: none;
      -webkit-text-fill-color: initial;
      color: var(--text-dark);
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    html { height: 100%; }
    /* הדף ממלא מסך אחד, אבל דוח ארוך או הגדרות פתוחות יכולים לגלול */
    body { min-height: 100%; }

    body {
      font-family: 'Assistant', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: 8px;
      color: var(--text-dark);
      direction: rtl;
      transition: background 0.3s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      flex: 1; 
      width: 100%; 
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
    }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      font-size: 1.3rem;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: 12px;
      border: var(--border);
    }
    .theme-selector label { font-size: 11px; font-weight: 600; color: var(--text-dark); }
    
    select {
      padding: 4px 6px;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 8px;
      border: var(--border);
      background: var(--btn-bg);
      color: var(--text-dark);
      outline: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card, 16px);
      padding: 8px 12px;
      box-shadow: var(--card-shadow);
      border: var(--border);
      backdrop-filter: blur(16px);
      margin-bottom: 4px;
    }

    details {
      background: rgba(0,0,0,0.02);
      border: var(--border);
      border-radius: 10px;
      padding: 4px 8px;
    }
    summary {
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .control-group { display: flex; flex-direction: column; gap: 2px; }
    label { font-weight: 600; font-size: 11px; color: var(--text-dark); }

    .tag-selector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .tag-selector-header button {
      padding: 1px 5px;
      font-size: 10px;
      cursor: pointer;
      background: transparent;
      border: var(--border);
      border-radius: 6px;
      font-weight: 600;
      color: var(--primary);
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 75px;
      overflow-y: auto;
      padding: 4px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      border: var(--border);
    }

    .tag-pill {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--btn-bg);
      border: var(--border);
      color: var(--text-dark);
      cursor: pointer;
    }
    .tag-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    body.theme-white-clean .tag-pill.active,
    body.theme-pencil-thin .tag-pill.active {
      background: #171717;
      color: #ffffff;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: var(--border);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;

<script>
const T = window.TheoryCore;
const STAFF = { bottomY: 66, space: 8 };

const NOTE_NAMES = T.LETTERS.map(l => ({ name: l.he, eng: l.en, pc: l.pc }));

const BASE_STRUCTURES = {};
Object.keys(T.CATALOG).forEach(type => {
  BASE_STRUCTURES[type] = T.CATALOG[type].map(s => ({ id: s.id, name: s.name, abbr: s.abbr, stepOffsets: s.steps, semitones: s.semitones }));
});

const INVERSIONS_DATA = {
  chords: [
    { id: 0, name: 'מצב יסודי' },
    { id: 1, name: 'היפוך ראשון' },
    { id: 2, name: 'היפוך שני' }
  ],
  septachords: [
    { id: 0, name: 'מצב יסודי' },
    { id: 1, name: 'היפוך ראשון' },
    { id: 2, name: 'היפוך שני' },
    { id: 3, name: 'היפוך שלישי' }
  ]
};


let audioCtx = null;
let currentExercise = null;
let currentScore = 0;
let selectedAccidental = '0';
let selectedChordType = null;
let selectedChordInv = null;
let selectedNoteNameIdx = null;
// תו שנבחר לפני סימן ההתק: נבדק שוב כשבוחרים סימן התק, כך שסדר הלחיצות לא משנה
let pendingLetter = null;
let modeRootGiven = false;
let selectedModeType = null;
let typeAnsweredCorrectly = false;
let exerciseSolved = false;
let currentPlayDirection = 'ascending';
// הרמזים שכבר הוצגו בתרגיל הנוכחי
let shownHints = new Set();

function clearWrongButtons() {
  document.querySelectorAll('.opt-btn.wrong').forEach(btn => {
    btn.classList.remove('wrong');
  });
}

function closeSettings() {
  const settings = document.getElementById('settingsCollapse');
  settingsDirty = false;
  if (settings) settings.removeAttribute('open');
}

// שינוי בהגדרות נכנס לתוקף כשסוגרים אותן, בלי כפתור "תרגיל חדש"
let settingsDirty = false;
(function watchSettings() {
  const settings = document.getElementById('settingsCollapse');
  settings.addEventListener('change', e => { if (e.target.id !== 'instrumentSelect') settingsDirty = true; });
  settings.addEventListener('click', e => { if (e.target.closest('.tag-pill, .tag-selector-header button')) settingsDirty = true; });
  settings.addEventListener('toggle', () => {
    if (settings.open || !settingsDirty) return;
    settingsDirty = false;
    if (appMode !== 'train') goToNextExercise();
  });
})();

// הגדרות עם מעט אפשרויות: כפתורים במקום תפריט נפתח. ה-select נשאר מוסתר ומקור האמת
function buildSegmentedSettings() {
  document.querySelectorAll('#settingsCollapse .controls-grid select').forEach(sel => {
    if (sel.id === 'displayMode') return;
    const seg = document.createElement('div');
    seg.className = 'seg';
    Array.from(sel.options).forEach(opt => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = opt.textContent;
      b.dataset.value = opt.value;
      b.onclick = () => {
        if (sel.value === opt.value) return;
        sel.value = opt.value;
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      };
      b.classList.toggle('active', opt.value === sel.value);
      seg.appendChild(b);
    });
    sel.style.display = 'none';
    sel.after(seg);
  });
}
buildSegmentedSettings();

function setExType(type) {
  document.getElementById('sharedNote').hidden = true;
  document.getElementById('exType').value = type;
  onExerciseTypeChange();
  closeSettings();
  goToNextExercise();
}

// אחרי יציאה מהאפליקציה באייפון ההקשר נתקע (interrupted, או "running" בלי צליל), ולכן בחזרה בונים הקשר חדש.
// הדגימות נשמרות כ-AudioBuffer ומתאימות לכל הקשר, כך שאין טעינה מחדש.
let audioStale = false;

function setPlaybackSession() {
  // iOS 17 ומעלה: השמעה גם כשמתג השקט מופעל, כמו נגן מוזיקה
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
}

function getAudioContext() {
  if (audioCtx && (audioStale || audioCtx.state === 'closed')) {
    const old = audioCtx;
    audioCtx = null;
    playBus = null;
    try { old.close(); } catch (e) {}
  }
  audioStale = false;
  if (!audioCtx) {
    setPlaybackSession();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // באייפון הקשר חדש נפתח רק כשמשמיעים בו משהו בתוך לחיצה, אז משמיעים רגע שקט
    try {
      const src = audioCtx.createBufferSource();
      src.buffer = audioCtx.createBuffer(1, 1, 22050);
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
  }
  if (audioCtx.state !== 'running') {
    const p = audioCtx.resume();
    if (p && p.catch) p.catch(() => {});
  }
  return audioCtx;
}

setPlaybackSession();

function markAudioStale() {
  if (!audioCtx) return;
  silenceAll(0);
  audioStale = true;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) markAudioStale();
  else setPlaybackSession();
});
window.addEventListener('pagehide', markAudioStale);
window.addEventListener('pageshow', setPlaybackSession);
// הלחיצה הראשונה אחרי החזרה פותחת את הקשר החדש, גם אם ההשמעה עצמה תגיע מאוחר יותר (למשל אחרי תשובה נכונה)
['touchend', 'click', 'keydown'].forEach(type => document.addEventListener(type, () => {
  if (audioStale || (audioCtx && audioCtx.state !== 'running')) getAudioContext();
}, true));

// בטלפונים של אפל מתג השקט משתיק את הדף בגרסאות ישנות, ולכן מציגים פעם אחת הסבר קצר ליד כפתור ההשמעה
const SILENT_TIP_KEY = 'mt_silent_tip_seen';
function isAppleMobile() {
  return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function initSilentTip() {
  let seen = false;
  try { seen = localStorage.getItem(SILENT_TIP_KEY) === '1'; } catch (e) {}
  document.getElementById('silentTip').hidden = seen || !isAppleMobile();
}
function dismissSilentTip() {
  document.getElementById('silentTip').hidden = true;
  try { localStorage.setItem(SILENT_TIP_KEY, '1'); } catch (e) {}
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// כל השמעה מתנגנת דרך ערוץ משלה, כדי שאפשר יהיה להשתיק את מה שעוד מצלצל לפני ההשמעה הבאה
let playBus = null;

function newPlayBus(ctx) {
  silenceAll(0.08);
  playBus = ctx.createGain();
  playBus.connect(masterOut(ctx));
}

// מחזיר true אם היה צליל שעוד מצלצל
function silenceAll(fade) {
  if (!playBus) return false;
  const bus = playBus;
  const t = audioCtx.currentTime;
  bus.gain.cancelScheduledValues(t);
  bus.gain.setValueAtTime(bus.gain.value, t);
  bus.gain.linearRampToValueAtTime(0, t + fade);
  setTimeout(() => bus.disconnect(), fade * 1000 + 200);
  playBus = null;
  return true;
}

// stopAt: בסולם כל צליל משתתק כשמגיע הבא. במרווח ובאקורד מלודי אין stopAt: הצלילים ממשיכים לצלצל, כמו עם פדל
// release: כמה מהר הצליל נדעך אחרי stopAt
// fadeLen: במקום עצירה, דעיכה הדרגתית שמתחילה ב-stopAt ומגיעה לשקט אחרי fadeLen שניות
function playInstrumentNote(freq, startTime, stopAt = null, release = 0.04, fadeLen = 0) {
  const ctx = getAudioContext();
  const inst = document.getElementById('instrumentSelect').value;
  if (!playBus) newPlayBus(ctx);
  const damper = ctx.createGain();
  damper.connect(playBus);
  let srcStop = null;
  if (stopAt !== null && fadeLen > 0) {
    fadeOut(damper.gain, stopAt, fadeLen);
    srcStop = stopAt + fadeLen + 0.1;
  } else if (stopAt !== null) {
    damper.gain.setTargetAtTime(0, stopAt, release);
    srcStop = stopAt + release * 10;
  }
  // עד שהדגימות נטענות (או כשהדף נפתח מקובץ מקומי) מנגנים פסנתר מסונתז
  if (sampleBuffers[inst]) playSampleNote(ctx, inst, freq, startTime, srcStop, damper);
  else {
    loadSamples(inst);
    playPianoNote(ctx, freq, startTime, damper);
  }
}

// דגימות אמיתיות, כל אחת כ-8 שניות של צלצול טבעי. צלילים שביניהן מוזזים בגובה מהדגימה הקרובה.
// פסנתר כנף Steinway B וויברפון בלי מנוע במקושים קשים, שניהם ממאגר VCSL (CC0). פרטים ב-sounds/README.md
const SAMPLE_SETS = {
  piano: { dir: 'sounds/piano/', gain: 0.4,
    notes: ['As1', 'C2', 'D2', 'E2', 'Fs2', 'Gs2', 'As2', 'C3', 'D3', 'E3', 'Fs3', 'Gs3', 'As3', 'C4', 'D4', 'E4', 'Fs4', 'Gs4', 'As4',
      'C5', 'D5', 'E5', 'Fs5', 'Gs5', 'As5', 'C6', 'D6', 'E6', 'Fs6', 'Gs6', 'As6', 'C7'] },
  vibraphone: { dir: 'sounds/vibraphone/', gain: 0.3,
    notes: ['A3', 'C4', 'E4', 'G4', 'B4', 'D5', 'F5', 'A5', 'C6', 'E6'] }
};
const sampleBuffers = {};
const sampleLoads = {};

function sampleNameToMidi(name) {
  const m = name.match(/^([A-G])(s?)(\d)$/);
  return 12 * (Number(m[3]) + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
}

// הפענוח נעשה בהקשר לא מקוון, כך שאפשר לטעון כבר בפתיחת הדף, לפני שהמשתמש לחץ על משהו
function loadSamples(inst) {
  const set = SAMPLE_SETS[inst];
  if (!set || sampleLoads[inst]) return;
  const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!Offline || !window.fetch) return;
  const decoder = new Offline(1, 1, 44100);
  sampleLoads[inst] = Promise.all(set.notes.map(n =>
    fetch(set.dir + n + '.mp3')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => decoder.decodeAudioData(ab, res, rej)))
      .then(buffer => ({ midi: sampleNameToMidi(n), buffer }))
  )).then(list => { sampleBuffers[inst] = list; })
    .catch(() => { setTimeout(() => { delete sampleLoads[inst]; }, 5000); });
}

function playSampleNote(ctx, inst, freq, t, stopAt, dest) {
  const midi = 69 + 12 * Math.log2(freq / 440);
  const list = sampleBuffers[inst];
  let best = list[0];
  list.forEach(s => { if (Math.abs(s.midi - midi) < Math.abs(best.midi - midi)) best = s; });
  const src = ctx.createBufferSource();
  src.buffer = best.buffer;
  src.playbackRate.value = Math.pow(2, (midi - best.midi) / 12);
  const g = ctx.createGain();
  g.gain.value = SAMPLE_SETS[inst].gain;
  src.connect(g);
  g.connect(dest);
  src.start(t);
  if (stopAt !== null) src.stop(stopAt);
}

// יציאה משותפת עם קומפרסור, כדי שאקורדים לא יתעוותו
function masterOut(ctx) {
  if (!ctx._master) {
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.knee.value = 8;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    comp.connect(ctx.destination);
    ctx._master = comp;
  }
  return ctx._master;
}

// פסנתר מסונתז, לשימוש עד שהדגימות נטענות: שני מיתרים מעט לא מכוונים, עליונים עם אי-הרמוניות קלה, דעיכה דו-שלבית וסוסטיין ארוך,
// ופילטר שמתכהה עם הזמן כמו מיתר אמיתי
function playPianoNote(ctx, freq, t, dest) {
  const sustain = 7 * Math.min(1.6, Math.max(0.6, 440 / freq) ** 0.35);
  const out = ctx.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(0.22, t + 0.004);
  out.gain.exponentialRampToValueAtTime(0.1, t + 0.3);
  out.gain.exponentialRampToValueAtTime(0.04, t + sustain * 0.5);
  out.gain.exponentialRampToValueAtTime(0.0001, t + sustain);

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 0.5;
  lp.frequency.setValueAtTime(Math.min(freq * 14, 12000), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 2.5, 400), t + sustain * 0.7);
  lp.connect(out);
  out.connect(dest);

  const B = 0.0004; // אי-הרמוניות של מיתר
  const partials = [1, 0.55, 0.32, 0.22, 0.14, 0.09, 0.06, 0.04];
  [-1.2, 1.2].forEach(cents => {
    const detune = Math.pow(2, cents / 1200);
    partials.forEach((amp, i) => {
      const n = i + 1;
      const f = freq * n * Math.sqrt(1 + B * n * n) * detune;
      if (f > 16000) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(amp * 0.2, t);
      g.gain.exponentialRampToValueAtTime(amp * 0.2 * 0.05, t + sustain / Math.sqrt(n));
      osc.connect(g);
      g.connect(lp);
      osc.start(t);
      osc.stop(t + sustain + 0.05);
    });
  });
  // מכת הפטיש
  const len = Math.floor(ctx.sampleRate * 0.012);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = Math.min(freq * 3, 6000);
  const ng = ctx.createGain();
  ng.gain.value = 0.06;
  noise.connect(bp);
  bp.connect(ng);
  ng.connect(out);
  noise.start(t);
}

function changeTheme(themeClass) {
  document.body.className = themeClass;
}

function getStructureLabel(item, type) {
  if (!item) return '';
  const t = type || (currentExercise ? currentExercise.type : document.getElementById('exType').value);
  const isInterval = t === 'intervals';
  const format = document.getElementById('intervalFormatSelect').value;
  if (isInterval && format === 'abbr' && item.abbr) {
    return item.abbr;
  }
  return item.name;
}

function onExerciseTypeChange() {
  const type = document.getElementById('exType').value;
  const invGroup = document.getElementById('inversionsGroup');
  const playGroup = document.getElementById('playModeGroup');
  const accGroup = document.getElementById('accidentalGroup');
  const optGroup = document.getElementById('optionsGroup');
  const intervalFmtGroup = document.getElementById('intervalFormatGroup');

  if (type === 'note_id') {
    invGroup.style.display = 'none';
    playGroup.style.display = 'none';
    optGroup.style.display = 'none';
    accGroup.style.display = 'flex';
    intervalFmtGroup.style.display = 'none';
  } else if (type === 'scales' || type === 'modes') {
    invGroup.style.display = 'none';
    playGroup.style.display = 'none';
    optGroup.style.display = 'flex';
    accGroup.style.display = 'none';
    intervalFmtGroup.style.display = 'none';
    updateOptionsList();
  } else if (type === 'chords' || type === 'septachords') {
    invGroup.style.display = 'flex';
    playGroup.style.display = 'flex';
    optGroup.style.display = 'flex';
    accGroup.style.display = 'none';
    intervalFmtGroup.style.display = 'none';
    updateInversionsList(type);
    updateOptionsList();
  } else {
    invGroup.style.display = 'none';
    playGroup.style.display = 'flex';
    optGroup.style.display = 'flex';
    accGroup.style.display = 'none';
    intervalFmtGroup.style.display = 'flex';
    updateOptionsList();
  }
  document.querySelectorAll('#exTypeRow button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
}

function updateInversionsList(type) {
  const container = document.getElementById('inversionsTags');
  container.innerHTML = '';
  INVERSIONS_DATA[type].forEach(inv => {
    const pill = document.createElement('div');
    pill.className = 'tag-pill active';
    pill.dataset.value = inv.id;
    pill.innerText = inv.name;
    pill.onclick = () => pill.classList.toggle('active');
    container.appendChild(pill);
  });
}

function updateOptionsList() {
  const type = document.getElementById('exType').value;
  if (!BASE_STRUCTURES[type]) return;
  const container = document.getElementById('optionsTags');
  container.innerHTML = '';

  optionStructures(type).forEach(item => {
    const pill = document.createElement('div');
    pill.className = 'tag-pill active';
    pill.dataset.value = item.name;
    pill.innerText = getStructureLabel(item, type);
    pill.onclick = () => pill.classList.toggle('active');
    container.appendChild(pill);
  });
}

function selectAllOptions(status) {
  document.querySelectorAll('#optionsTags .tag-pill').forEach(el => {
    if (status) el.classList.add('active'); else el.classList.remove('active');
  });
}

function selectAllInversions(status) {
  document.querySelectorAll('#inversionsTags .tag-pill').forEach(el => {
    if (status) el.classList.add('active'); else el.classList.remove('active');
  });
}

function getNoteDetails(absLine, acc, clef) {
  return T.note(absLine, acc, clef);
}

function buildNotes(baseLine, baseAcc, struct, clef, inversionShift = 0) {
  const shared = { steps: struct.stepOffsets, semitones: struct.semitones };
  return T.build(shared, { line: baseLine, acc: baseAcc, clef, inversion: inversionShift, given: 'root' }).notes;
}

const AUDIO_RANGE = { low: 45, high: 81 }; // A2..A5
const AUDIO_CHORD_LOW = 48; // אקורדים לא יורדים מתחת לדו שמתחת לדו האמצעי (C3)
const AUDIO_RANGE_TYPES = ['intervals', 'chords', 'septachords'];

// cfg: באימון, הקטגוריה שנבחרה מהרמה (סוג, מאגר מבנים, היפוכים, אופן נגינה) במקום ההגדרות
function generateExercise(cfg = null) {
  const type = cfg ? cfg.type : document.getElementById('exType').value;
  let clefSelectVal = document.getElementById('clefSelect').value;
  let clef = clefSelectVal === 'rand' ? (Math.random() < 0.5 ? 'sol' : 'fa') : clefSelectVal;
  // סולמות ומודוסים במושמע בלבד: רק מפתח סול, עד שני קווי עזר מעל החמשה (דו6)
  const audioScale = document.getElementById('displayMode').value === 'audio_only' && (type === 'scales' || type === 'modes');
  if (audioScale) clef = 'sol';

  if (type === 'note_id') {
    const accOption = document.getElementById('accidentalSelect').value;
    let acc = 0;
    if (accOption === 'with') {
      acc = Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0;
    }
    let line = Math.floor(Math.random() * 9) - 2;
    let note = getNoteDetails(line, acc, clef);

    if (note.absLine < -4 || note.absLine > 12) return generateExercise(cfg);

    return { type, clef, notes: [note], correctNote: note };
  }

  const activeOptionPills = cfg ? cfg.pool.map(st => st.name) : Array.from(document.querySelectorAll('#optionsTags .tag-pill.active')).map(el => el.dataset.value);
  if (activeOptionPills.length === 0) {
    alert("יש לבחור לפחות אפשרות אחת לתרגול!");
    return null;
  }

  let activeInvPills = [0];
  if (cfg) {
    activeInvPills = cfg.inversions || [0];
  } else if (type === 'chords' || type === 'septachords') {
    activeInvPills = Array.from(document.querySelectorAll('#inversionsTags .tag-pill.active')).map(el => parseInt(el.dataset.value));
    if (activeInvPills.length === 0) {
      alert("יש לבחור לפחות היפוך אחד לתרגול!");
      return null;
    }
  }

  const poolStructs = cfg ? cfg.pool : optionStructures(type).filter(s => activeOptionPills.includes(s.name));
  const chosenStruct = poolStructs[Math.floor(Math.random() * poolStructs.length)];
  let chosenInversion = activeInvPills[Math.floor(Math.random() * activeInvPills.length)];
  // למשולש מוגדל אין משמעות להיפוך: תמיד במצב יסודי, ושאלת ההיפוך נופלת
  if (inversionIrrelevant(type, chosenStruct)) chosenInversion = 0;

  // במושמע בלבד מרווחים ואקורדים נשארים ברגיסטר נעים: מלה בחלל התחתון של מפתח פה (A2) ועד לה מעל מפתח סול (A5)
  const audioRange = document.getElementById('displayMode').value === 'audio_only' && AUDIO_RANGE_TYPES.includes(type);
  let baseLine = (clef === 'sol') ? Math.floor(Math.random() * 3) - 2 : Math.floor(Math.random() * 3) - 1;
  if (audioRange) baseLine = Math.floor(Math.random() * 15) - 4;
  let baseAcc = Math.random() < 0.25 ? (Math.random() < 0.5 ? -1 : 1) : 0;
  let notes = buildNotes(baseLine, baseAcc, chosenStruct, clef, chosenInversion);

  let isValid = notes.every(n => Math.abs(n.acc) <= 2 && n.absLine >= -4 && n.absLine <= 14);
  if (audioRange) {
    const low = type === 'intervals' ? AUDIO_RANGE.low : AUDIO_CHORD_LOW;
    isValid = isValid && notes.every(n => n.midiNum >= low && n.midiNum <= AUDIO_RANGE.high);
  }
  if (audioScale) isValid = isValid && notes.every(n => n.absLine <= 12);
  if (!isValid) {
    return generateExercise(cfg);
  }

  const hasDoubleAccidental = notes.some(n => Math.abs(n.acc) >= 2);
  if (hasDoubleAccidental) {
    const isAllowedScale = (type === 'scales') && (chosenStruct.name === 'מינור הרמוני' || chosenStruct.name === 'מינור מלודי');
    if (!isAllowedScale) {
      return generateExercise(cfg);
    }
  }

  return {
    type,
    struct: chosenStruct,
    clef,
    notes,
    inversion: chosenInversion,
    optionsPool: poolStructs,
    inversionsPool: INVERSIONS_DATA[type] ? INVERSIONS_DATA[type].filter(i => activeInvPills.includes(i.id)) : [],
    playMode: cfg ? cfg.play : null,
    category: cfg ? cfg.label : null
  };
}

// שליחת תרגיל לתלמיד: הקישור נושא את המצב, סוג התרגיל וההגדרות, והשאלות עצמן אקראיות אצל התלמיד
const MODE_LABELS = { read: 'קריאה', ear: 'שמיעה' };

function buildShareParams() {
  const type = document.getElementById('exType').value;
  const params = new URLSearchParams();
  params.set('mode', appMode);
  params.set('type', type);
  if (appMode === 'read') params.set('clef', document.getElementById('clefSelect').value);
  else {
    params.set('instr', document.getElementById('instrumentSelect').value);
    if (type === 'intervals' || type === 'chords' || type === 'septachords') params.set('play', document.getElementById('playMode').value);
  }
  if (type === 'note_id') params.set('acc', document.getElementById('accidentalSelect').value);
  if (type === 'intervals') params.set('fmt', document.getElementById('intervalFormatSelect').value);
  if (type === 'chords' || type === 'septachords') {
    const pills = Array.from(document.querySelectorAll('#inversionsTags .tag-pill'));
    const on = pills.filter(el => el.classList.contains('active'));
    if (on.length && on.length < pills.length) params.set('inv', on.map(el => el.dataset.value).join(','));
  }
  if (type !== 'note_id') {
    const pills = Array.from(document.querySelectorAll('#optionsTags .tag-pill'));
    const on = pills.filter(el => el.classList.contains('active'));
    if (on.length && on.length < pills.length) {
      const ids = on.map(el => (optionStructures(type).find(st => st.name === el.dataset.value) || {}).id).filter(Boolean);
      params.set('opts', ids.join(','));
    }
  }
  return params;
}

function shareSummary() {
  const type = document.getElementById('exType').value;
  const typeName = document.querySelector(`#exType option[value="${type}"]`).textContent;
  let text = `${MODE_LABELS[appMode] || ''} · ${typeName}`;
  if (type !== 'note_id') {
    const pills = Array.from(document.querySelectorAll('#optionsTags .tag-pill'));
    const on = pills.filter(el => el.classList.contains('active'));
    if (on.length < pills.length) text += ': ' + on.map(el => el.textContent).join(', ');
  }
  return text;
}

function shareCurrentExercise() {
  const type = document.getElementById('exType').value;
  if (type !== 'note_id' && !document.querySelector('#optionsTags .tag-pill.active')) {
    alert('יש לבחור לפחות אפשרות אחת לתרגול!');
    return;
  }
  const url = location.origin + location.pathname + '?' + buildShareParams().toString().replace(/%2C/g, ',');
  const summary = shareSummary();
  document.getElementById('shareSummary').textContent = summary;
  document.getElementById('shareLink').value = url;
  document.getElementById('shareWhatsapp').href = 'https://wa.me/?text=' + encodeURIComponent('תרגיל ' + summary + '\n' + url);
  document.getElementById('shareCopy').textContent = 'העתק קישור';
  document.getElementById('shareDialog').hidden = false;
}

function closeShareDialog() {
  document.getElementById('shareDialog').hidden = true;
}

function copyShareLink() {
  const input = document.getElementById('shareLink');
  const done = () => { document.getElementById('shareCopy').textContent = 'הועתק'; };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(input.value).then(done).catch(() => { input.select(); document.execCommand('copy'); done(); });
  } else {
    input.select();
    document.execCommand('copy');
    done();
  }
}

// עדכון כפתורי ההגדרה אחרי שינוי של ה-select המוסתר
function setSettingValue(id, value) {
  const sel = document.getElementById(id);
  if (!sel || !Array.from(sel.options).some(o => o.value === value)) return false;
  sel.value = value;
  const seg = sel.nextElementSibling;
  if (seg && seg.classList.contains('seg')) seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.value === value));
  return true;
}

// קישור שהמורה שלח: מחילים את ההגדרות שבו. מחזיר true אם היה בקישור תרגיל
function applySharedSettings() {
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  if (!type || !BASE_STRUCTURES[type] || appMode === 'train') return false;
  if (type === 'note_id' && appMode !== 'read') return false;
  document.getElementById('exType').value = type;
  if (params.has('fmt')) setSettingValue('intervalFormatSelect', params.get('fmt'));
  onExerciseTypeChange();
  ['clef:clefSelect', 'acc:accidentalSelect', 'play:playMode'].forEach(pair => {
    const [key, id] = pair.split(':');
    if (params.has(key)) setSettingValue(id, params.get(key));
  });
  if (params.has('instr') && setSettingValue('instrumentSelect', params.get('instr'))) loadSamples(params.get('instr'));
  if (params.has('inv')) {
    const inv = params.get('inv').split(',');
    const pills = document.querySelectorAll('#inversionsTags .tag-pill');
    if (Array.from(pills).some(el => inv.includes(el.dataset.value))) pills.forEach(el => el.classList.toggle('active', inv.includes(el.dataset.value)));
  }
  if (params.has('opts')) {
    const ids = params.get('opts').split(',');
    const names = optionStructures(type).filter(st => ids.includes(st.id)).map(st => st.name);
    if (names.length) document.querySelectorAll('#optionsTags .tag-pill').forEach(el => el.classList.toggle('active', names.includes(el.dataset.value)));
  }
  const note = document.getElementById('sharedNote');
  note.textContent = 'תרגיל שנשלח אליך: ' + shareSummary();
  note.hidden = false;
  return true;
}

function loadExerciseFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const dataStr = params.get('exData');
  if (dataStr) {
    try {
      currentExercise = JSON.parse(dataStr);
      const typeSelect = document.getElementById('exType');
      if (Array.from(typeSelect.options).some(o => o.value === currentExercise.type)) {
        typeSelect.value = currentExercise.type;
        onExerciseTypeChange();
      }
      document.getElementById('practiceArea').style.display = 'flex';
      document.getElementById('feedback').innerText = 'תרגיל מקישור';
      document.getElementById('feedback').className = 'feedback info';
      renderStaff(currentExercise);
      setupAnswerUI();
      updateFirstNoteButtonUI();
      return true;
    } catch(e) { console.error("URL Load Error", e); }
  }
  return false;
}

function renderStaff(ex) {
  const container = document.getElementById('staffContainer');
  const dispMode = document.getElementById('displayMode').value;

  // במצב מושמע בלבד: כפתור השמעה גדול במקום החמשה
  document.getElementById('bigPlayWrap').style.display = dispMode === 'audio_only' ? 'flex' : 'none';
  // בשמיעה יש כפתור גדול, אז הכפתור הקטן בשורה נחוץ רק בקריאה
  document.getElementById('playAudioBtn').style.display = dispMode === 'audio_only' ? 'none' : '';
  if (dispMode === 'audio_only') {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';

  const svg = document.getElementById('staffSvg');
  
  let svgContent = '';

  const isScaleOrMode = (ex.type === 'scales' || ex.type === 'modes');
  // במסך צר חמשה קצרה לצליל/מרווח/אקורד, כדי שהתווים לא יתכווצו
  const width = (!isScaleOrMode && container.clientWidth < 560) ? 240 : 520;
  svg.setAttribute('viewBox', `0 0 ${width} 110`);
  const startX = isScaleOrMode ? 85 : (width === 520 ? 260 : 140);
  const spacing = isScaleOrMode ? 48 : 0;

  for (let i = 0; i < 5; i++) {
    let y = 66 - i * 8;
    svgContent += `<line x1="20" y1="${y}" x2="${width - 20}" y2="${y}" class="staff-line" stroke-width="1.2"/>`;
  }
  svgContent += `<line x1="20" y1="34" x2="20" y2="66" class="staff-line strong" stroke-width="1.5"/>`;

  svgContent += T.svg.clef(ex.clef === 'fa' ? 'fa' : 'sol', 35, STAFF);

  const layout = isScaleOrMode ? null : T.chordLayout(ex.notes);

  ex.notes.forEach((n, idx) => {
    let y = 66 - n.absLine * 4;
    let baseX = startX + (idx * spacing);
    let noteX = baseX;

    if (layout && layout[idx].shifted) noteX += 10;
    // פרימה: סימן ההיתק של התו הימני בין שני ראשי התווים
    const accBeside = layout && layout[idx].accBeside;
    if (accBeside) noteX += T.svg.accidentalWidth(n.acc, STAFF.space) + 4;

    svgContent += T.svg.ledgerLines(noteX, n.absLine, STAFF, 8);

    if (n.acc !== 0) {
      let accRightX = accBeside ? noteX - 7 : baseX - 7 - (layout ? layout[idx].accColumn * 11 : 0);
      svgContent += T.svg.accidental(n.acc, accRightX, y, STAFF.space);
    }

    svgContent += T.svg.notehead(noteX, y, STAFF.space);
  });

  svg.innerHTML = svgContent;
}

window.addEventListener('resize', () => { if (currentExercise) renderStaff(currentExercise); });

function updateFirstNoteButtonUI() {
  const btn = document.getElementById('playFirstNoteBtn');
  if (!currentExercise || currentExercise.type === 'note_id') {

    return;
  }

    btn.innerText = 'צליל ראשון (סופרן)';
  } else {
    btn.innerText = 'צליל ראשון (בס)';

// סוף ההשמעה, לפי כלי. ויברפון: דעיכה טבעית שמתחילה כבר באטק של הצליל האחרון (בהרמוני: של כולם).
// פסנתר: עם פדל, הצליל דועך לבד עד סוף הדגימה
const ENDINGS = {
  vibraphone: { curve: 'exp', melodic: 3.5, harmonic: 4 },
  piano: { curve: 'natural', melodic: 6, harmonic: 6 }
};
function ending() {
  return ENDINGS[document.getElementById('instrumentSelect').value] || ENDINGS.piano;
}
function fadeOut(param, from, len) {
  if (ending().curve !== 'exp') return;
  param.setValueAtTime(1, from);
  param.setTargetAtTime(0, from, len / 5);
}

function playCurrentExercise() {
  if (!currentExercise) return;
  // אחרי רמז השמעה, כל השמעה חוזרת בתרגיל הזה נשמעת בדרך המקלה
  if (currentExercise.hintPlay) { currentExercise.hintPlay(); return; }
  const freqs = currentExercise.notes.map(n => midiToFreq(n.midiNum));
  const ctx = getAudioContext();
  newPlayBus(ctx);

  if (currentExercise.type === 'scales' || currentExercise.type === 'modes') {
    currentPlayDirection = 'ascending';
    updateFirstNoteButtonUI();
    const now = ctx.currentTime + 0.05;
    const all = [...freqs, ...[...freqs].reverse().slice(1)];
    all.forEach((f, idx) => {
      const last = idx === all.length - 1;
      if (last) playInstrumentNote(f, now + idx * 0.3, now + idx * 0.3, 0, ending().melodic);
      else playInstrumentNote(f, now + idx * 0.3, now + (idx + 1) * 0.3);
    });
    return;
  }

  let mode = currentExercise.playMode || document.getElementById('playMode').value;
  // באקראי מגרילים סוג נגינה פעם אחת לתרגיל, וכל השמעה חוזרת שלו נשמעת אותו דבר
  if (mode === 'random' || Array.isArray(mode)) {
    const modes = Array.isArray(mode) ? mode : ['harmonic', 'ascending', 'descending'];
    if (!modes.includes(currentExercise.randomPlay)) {
      currentExercise.randomPlay = modes[Math.floor(Math.random() * modes.length)];
    }
    mode = currentExercise.randomPlay;
  }

  currentPlayDirection = mode;
  updateFirstNoteButtonUI();

  const now = ctx.currentTime + 0.05;
  if (mode === 'harmonic') {
    freqs.forEach(f => playInstrumentNote(f, now, now, 0, ending().harmonic));
  } else {
    const ordered = mode === 'descending' ? [...freqs].reverse() : freqs;
    const lastStart = now + (ordered.length - 1) * 0.35;
    ordered.forEach((f, idx) => playInstrumentNote(f, now + idx * 0.35, lastStart, 0, ending().melodic));
  }
}

function playFirstNoteOnly() {
  if (!currentExercise || !currentExercise.notes || currentExercise.notes.length === 0) return;
  
  let targetNote;
  if (currentPlayDirection === 'descending') {
    targetNote = currentExercise.notes[currentExercise.notes.length - 1];
  } else {
    targetNote = currentExercise.notes[0];
  }

  const freq = midiToFreq(targetNote.midiNum);
  const ctx = getAudioContext();
  playInstrumentNote(freq, ctx.currentTime + 0.05);
}

function triggerSuccessAndNext() {
  exerciseSolved = true;
  if (training) recordTrainingResult();
  // בלי השמעה חוזרת: הצליל דועך, רגע של שקט, ואז התרגיל הבא
  silenceAll(0.5);
  const isAudio = document.getElementById('displayMode').value === 'audio_only';
  setTimeout(goToNextExercise, isAudio ? 1500 : 1000);
}

function goToNextExercise() {
  if (training && training.index >= training.plan.length) {
    showTrainingReport();
    return;
  }
  startPractice();
  if (document.getElementById('displayMode').value !== 'audio_only') return;
  // אם התרגיל הקודם עוד מצלצל (למשל "תרגיל חדש" באמצע), משתיקים ומשאירים רגע שקט לפני ההשמעה
  if (silenceAll(0.3)) setTimeout(playCurrentExercise, 900);
  else playCurrentExercise();
}

function exerciseKey(ex) {
  return ex.clef + ':' + (ex.struct ? ex.struct.name : '') + ':' + ex.inversion + ':' + ex.notes.map(n => n.absLine + '/' + n.acc).join(',');
}

function startPractice() {
  // לא חוזרים על אותו תרגיל פעמיים ברצף, כדי שיהיה ברור שהתחלף
  const prevKey = currentExercise ? exerciseKey(currentExercise) : null;
  const cfg = training ? training.plan[training.index] : null;
  let next = generateExercise(cfg);
  for (let i = 0; next && prevKey && exerciseKey(next) === prevKey && i < 20; i++) next = generateExercise(cfg);
  currentExercise = next;
  if (!currentExercise) return;

  document.getElementById('practiceArea').style.display = 'flex';
  document.getElementById('feedback').innerText = '';
  document.getElementById('feedback').className = 'feedback';

  const popover = document.getElementById('helpPopover');
  popover.classList.remove('visible');
  popover.innerText = '';
  shownHints = new Set();
  document.getElementById('helpBtn').innerText = 'עזרה';

  selectedAccidental = '0';
  selectedChordType = null;
  selectedChordInv = null;
  selectedNoteNameIdx = null;
  pendingLetter = null;
  selectedModeType = null;
  typeAnsweredCorrectly = false;
  exerciseSolved = false;
  firstWrong = null;
  currentPlayDirection = 'ascending';
  updateTopbarProgress();

  renderStaff(currentExercise);
  setupAnswerUI();
  updateFirstNoteButtonUI();
}

function inversionIrrelevant(type, struct) {
  if (type === 'chords' && struct.id === 'augmented') return true;
  // ספטאקורד מוקטן נשמע זהה בכל ההיפוכים, אז בשמיעה לא שואלים עליו
  return type === 'septachords' && struct.id === 'diminished7' && document.getElementById('displayMode').value === 'audio_only';
}

function checkChordType(typeName, btn) {
  if (exerciseSolved) return;
  clearWrongButtons();
  if (selectedChordType === typeName) return;
  
  if (typeName === currentExercise.struct.name) {
    btn.classList.add('correct');
    selectedChordType = typeName;
    if (!typeAnsweredCorrectly) {
      currentScore += 0.5;
      typeAnsweredCorrectly = true;
      updateTopbarProgress();
    }
    document.getElementById('feedback').innerText = 'טיפוס נכון';

    checkChordComplete();
  } else {
    btn.classList.add('wrong');
    noteWrong(typeName);
    document.getElementById('feedback').innerText = 'טיפוס שגוי';
    document.getElementById('feedback').className = 'feedback error';

}

function setPendingLetter(next) {
  if (pendingLetter) pendingLetter.btn.classList.remove('pending');
  pendingLetter = next;
  if (next) next.btn.classList.add('pending');
}

// התו נכון אבל עוד לא נבחר סימן התק: מחכים לסימן במקום לסמן טעות
function waitsForAccidental(nameIdx, target) {
  return nameIdx === target.nameIndex && parseInt(selectedAccidental) === 0 && target.acc !== 0;
}

function checkModeNoteName(nameIdx, btn) {
  if (exerciseSolved) return;
  clearWrongButtons();
  const rootNote = currentExercise.notes[0];
  setPendingLetter(null);

  if (waitsForAccidental(nameIdx, rootNote)) {
    setPendingLetter({ idx: nameIdx, btn, check: checkModeNoteName });
    document.getElementById('feedback').innerText = '';
    return;
  }

  if (nameIdx === rootNote.nameIndex && parseInt(selectedAccidental) === rootNote.acc) {
    btn.classList.add('correct');
    selectedNoteNameIdx = nameIdx;
    if (!typeAnsweredCorrectly) {
      currentScore += 0.5;
      typeAnsweredCorrectly = true;
      updateTopbarProgress();

    document.getElementById('feedback').innerText = 'צליל יסוד נכון';
    document.getElementById('feedback').className = 'feedback success';
    checkModeComplete();

    btn.classList.add('wrong');
    if (nameIdx === rootNote.nameIndex) setPendingLetter({ idx: nameIdx, btn, check: checkModeNoteName });
    noteWrong('צליל יסוד', 'root');
    document.getElementById('feedback').innerText = 'צליל יסוד שגוי';

function checkModeType(typeName, btn) {

function checkModeComplete() {

  // selectedNoteNameIdx נקבע רק כשהצליל וסימן ההתק נכונים, כך ששינוי סימן אחר כך לא מבטל
  if (selectedNoteNameIdx === rootNote.nameIndex && selectedModeType === currentExercise.struct.name) {

    updateTopbarProgress();
    document.getElementById('feedback').innerText = 'נכון';

function setupNoteIdUI() {
  const container = document.getElementById('noteNameButtons');
  container.innerHTML = '';
  
  toggleAccidental('0');

  NOTE_NAMES.forEach((n, idx) => {
    const btn = document.createElement('button');
