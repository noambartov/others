function toggleAccidental(val) {
  clearWrongButtons();
  if (selectedAccidental === val) {
    selectedAccidental = '0';
  } else {
    selectedAccidental = val;
  }
  
  const accFlat = document.getElementById('accFlat');
  const accSharp = document.getElementById('accSharp');
  if (accFlat) accFlat.classList.toggle('selected', selectedAccidental === '-1');
  if (accSharp) accSharp.classList.toggle('selected', selectedAccidental === '1');

  const modeAccFlat = document.getElementById('modeAccFlat');
  const modeAccSharp = document.getElementById('modeAccSharp');
  if (modeAccFlat) modeAccFlat.classList.toggle('selected', selectedAccidental === '-1');
  if (modeAccSharp) modeAccSharp.classList.toggle('selected', selectedAccidental === '1');

  if (pendingLetter && !exerciseSolved) pendingLetter.check(pendingLetter.idx, pendingLetter.btn);
}

function renderPianoKeyboard() {
  const kb = document.getElementById('pianoKeyboard');
  kb.innerHTML = '';
  
  const keysLayout = [
    { name: 'C', pc: 0, hasBlack: true },
    { name: 'D', pc: 2, hasBlack: true },
    { name: 'E', pc: 4, hasBlack: false },
    { name: 'F', pc: 5, hasBlack: true },
    { name: 'G', pc: 7, hasBlack: true },
    { name: 'A', pc: 9, hasBlack: true },
    { name: 'B', pc: 11, hasBlack: false }
  ];

  keysLayout.forEach((k) => {
    const wKey = document.createElement('div');
    wKey.className = 'key-white';
    wKey.innerText = k.name;
    wKey.onclick = () => checkNoteAnswerByPc(k.pc, wKey);
    kb.appendChild(wKey);

    if (k.hasBlack) {
      const bKey = document.createElement('div');
      bKey.className = 'key-black';
      bKey.onclick = (e) => {
        e.stopPropagation();
        checkNoteAnswerByPc((k.pc + 1) % 12, bKey);
      };
      kb.appendChild(bKey);
    }
  });
}

function checkNoteAnswer(nameIdx, el) {
  if (exerciseSolved) return;
  clearWrongButtons();
  const correctNote = currentExercise.correctNote;
  const userAcc = parseInt(selectedAccidental);
  setPendingLetter(null);

  if (waitsForAccidental(nameIdx, correctNote)) {
    setPendingLetter({ idx: nameIdx, btn: el, check: checkNoteAnswer });
    document.getElementById('feedback').innerText = '';
    return;
  }

  if (nameIdx === correctNote.nameIndex && userAcc === correctNote.acc) {
    el.classList.add('correct');
    currentScore += 1;
    updateTopbarProgress();
    document.getElementById('feedback').innerText = 'נכון';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  } else {
    el.classList.add('wrong');
    noteWrong(NOTE_NAMES[nameIdx].name);
    if (nameIdx === correctNote.nameIndex) setPendingLetter({ idx: nameIdx, btn: el, check: checkNoteAnswer });
    document.getElementById('feedback').innerText = 'תו שגוי';
    document.getElementById('feedback').className = 'feedback error';
  }
}

function checkNoteAnswerByPc(pc, el) {
  if (exerciseSolved) return;
  clearWrongButtons();
  const correctNote = currentExercise.correctNote;
  let targetPc = (T.LETTERS[correctNote.nameIndex].pc + correctNote.acc + 12) % 12;

  if (targetPc === pc) {
    el.classList.add('correct');
    currentScore += 1;
    updateTopbarProgress();
    document.getElementById('feedback').innerText = 'נכון';
    document.getElementById('feedback').className = 'feedback success';
    triggerSuccessAndNext();
  } else {
    el.classList.add('wrong');
    document.getElementById('feedback').innerText = 'תו שגוי';
    document.getElementById('feedback').className = 'feedback error';
  }
}


// ---------- אימון שמיעה לפי רמות ----------
const TRAINING_LENGTH = 20;
const HISTORY_KEY = 'mt_training_history';

// באוזן אין הבדל בין מרווחים אנהרמוניים: סקונדה מוגדלת נשמעת כטרצה קטנה, קווינטה מוגדלת כסקסטה קטנה,
// וקוורטה מוגדלת וקווינטה מוקטנת הן טריטון אחד. בשמיעה נשאר כפתור אחד לכל מרחק, ורק בקריאה הכתיב חשוב.
const EAR_HIDDEN_INTERVALS = ['A2', 'd5', 'A5'];

function earStructures(type) {
  if (type !== 'intervals') return BASE_STRUCTURES[type];
  return BASE_STRUCTURES[type]
    .filter(st => !EAR_HIDDEN_INTERVALS.includes(st.id))
    .map(st => st.id === 'A4' ? { ...st, name: 'טריטון', abbr: 'טריטון' } : st);
}

function optionStructures(type) {
  return appMode === 'read' ? BASE_STRUCTURES[type] : earStructures(type);
}

function structsById(type, ids) {
  return ids.map(id => earStructures(type).find(x => x.id === id));
}

const EAR_INTERVALS = ['m2', 'M2', 'm3', 'M3', 'P4', 'A4', 'P5', 'm6', 'M6', 'm7', 'M7', 'P8'];
// נגינה מלמעלה למטה קשה יותר לשמיעה, אז היא מגיעה רק אחרי שהעולה וההרמוני כבר מוכרים
const UP_PLAY = ['harmonic', 'ascending'];
const EAR_LEVELS = [
  { name: 'רמה 1', desc: 'טרצות, קווינטה ואוקטבה, עולים', cats: [
    { label: 'מרווחים עולים', type: 'intervals', ids: ['m3', 'M3', 'P5', 'P8'], play: 'ascending' }
  ]},
  { name: 'רמה 2', desc: 'כל המרווחים, עולים', cats: [
    { label: 'מרווחים עולים', type: 'intervals', ids: EAR_INTERVALS, play: 'ascending' }
  ]},
  { name: 'רמה 3', desc: 'מרווחים הרמוניים, משולשים מז׳ור ומינור', cats: [
    { label: 'מרווחים הרמוניים', type: 'intervals', ids: EAR_INTERVALS, play: 'harmonic' },
    { label: 'משולשים', type: 'chords', ids: ['major', 'minor'], inversions: [0], play: 'harmonic' }
  ]},
  { name: 'רמה 4', desc: 'מרווחים יורדים, כל המשולשים וההיפוכים', cats: [
    { label: 'מרווחים יורדים', type: 'intervals', ids: EAR_INTERVALS, play: 'descending' },
    { label: 'משולשים', type: 'chords', ids: ['major', 'minor', 'diminished', 'augmented'], inversions: [0, 1, 2], play: UP_PLAY }
  ]},
  { name: 'רמה 5', desc: 'ספטאקורדים עיקריים, מז׳ור ומינור טבעי', cats: [
    { label: 'ספטאקורדים', type: 'septachords', ids: ['major7', 'dominant7', 'minor7', 'half_diminished'], inversions: [0], play: UP_PLAY },
    { label: 'סולמות', type: 'scales', ids: ['major', 'minor_natural'] }
  ]},
  { name: 'רמה 6', desc: 'אקורדים גם מלמעלה למטה, כל סוגי המינור', cats: [
    { label: 'משולשים', type: 'chords', ids: ['major', 'minor', 'diminished', 'augmented'], inversions: [0, 1, 2], play: 'random' },
    { label: 'ספטאקורדים', type: 'septachords', ids: ['major7', 'dominant7', 'minor7', 'half_diminished'], inversions: [0], play: 'random' },
    { label: 'סולמות', type: 'scales', ids: ['major', 'minor_natural', 'minor_harmonic', 'minor_melodic'] }
  ]},
  { name: 'רמה 7', desc: 'כל הספטאקורדים וההיפוכים, מודוסים', cats: [
    { label: 'ספטאקורדים', type: 'septachords', ids: T.CATALOG.septachords.map(x => x.id), inversions: [0, 1, 2, 3], play: 'random' },
    { label: 'מודוסים', type: 'modes', ids: T.CATALOG.modes.map(x => x.id) }
  ]}
];

let appMode = 'read';
let training = null;
let firstWrong = null;

function noteWrong(label, kind = 'type') {
  if (!firstWrong) firstWrong = { label, kind };
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
}

function saveHistory(entry) {
  try {
    const h = loadHistory();
    h.push(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(-200)));
  } catch (e) { /* בלי אחסון, הדוח עדיין מוצג */ }
}

function setAppMode(mode, initial = false) {
  const spellingChanged = (appMode === 'read') !== (mode === 'read');
  appMode = mode;
  try { localStorage.setItem('mt_app_mode', mode); } catch (e) {}
  document.body.classList.remove('mode-read', 'mode-ear', 'mode-train', 'in-session');
  document.body.classList.add('mode-' + mode);
  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.body.dataset.section = mode === 'read' ? 'read' : 'ear';
  if (window.SiteNav) SiteNav.setActive(document.body.dataset.section);
  document.getElementById('displayMode').value = mode === 'read' ? 'both' : 'audio_only';
  training = null;
  const exType = document.getElementById('exType');
  if (mode !== 'read' && exType.value === 'note_id') {
    exType.value = 'intervals';
    onExerciseTypeChange();
  } else if (spellingChanged && exType.value === 'intervals') {
    updateOptionsList();
  }
  closeSettings();
  if (mode === 'train') {
    showLevelPicker();
    return;
  }
  document.getElementById('trainingPanel').style.display = 'none';
  document.getElementById('practiceArea').style.display = 'flex';
  updateTopbarProgress();
  if (!initial) {
    document.getElementById('sharedNote').hidden = true;
    goToNextExercise();
  }
}

function showLevelPicker() {
  const panel = document.getElementById('trainingPanel');
  const history = loadHistory();
  document.getElementById('practiceArea').style.display = 'none';
  panel.style.display = 'block';
  updateTopbarProgress();
  const items = EAR_LEVELS.map((lv, i) => {
    const runs = history.filter(h => h.level === i);
    const best = runs.length ? Math.max(...runs.map(h => Math.round(100 * h.correct / h.total))) : null;
    return `<button class="level-item" onclick="startTraining(${i})">
      <div><div class="lv-name">${lv.name}</div><div class="lv-desc">${lv.desc}</div></div>
      <div class="lv-best">${best === null ? '' : 'שיא ' + best + '%'}</div>
    </button>`;
  }).join('');
  panel.innerHTML = `<h2>אימון שמיעה</h2>
    <p class="sub">בוחרים רמה ומקבלים ${TRAINING_LENGTH} תרגילים. נספרת רק התשובה הראשונה, ובסוף מקבלים דוח.</p>
    <div class="level-list">${items}</div>`;
}

function buildTrainingPlan(level) {
  const cats = EAR_LEVELS[level].cats.map(c => ({
    label: c.label, type: c.type, pool: structsById(c.type, c.ids), inversions: c.inversions || [0], play: c.play || null
  }));
  const plan = [];
  for (let i = 0; i < TRAINING_LENGTH; i++) plan.push(cats[i % cats.length]);
  for (let i = plan.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [plan[i], plan[j]] = [plan[j], plan[i]];
  }
  return plan;
}

function startTraining(level) {
  training = { level, plan: buildTrainingPlan(level), index: 0, results: [] };
  document.body.classList.add('in-session');
  document.getElementById('trainingPanel').style.display = 'none';
  document.getElementById('practiceArea').style.display = 'flex';
  currentExercise = null;
  goToNextExercise();
}

function recordTrainingResult() {
  const ex = currentExercise;
  const hasInv = ex.inversionsPool && ex.inversionsPool.length > 1 && !inversionIrrelevant(ex.type, ex.struct);
  training.results.push({
    category: ex.category,
    item: ex.struct.name,
    inversion: hasInv ? INVERSIONS_DATA[ex.type].find(i => i.id === ex.inversion).name : null,
    correct: !firstWrong,
    wrong: firstWrong
  });
  training.index++;
}

function skipExercise() {
  if (training && !exerciseSolved) {
    noteWrong('דילוג', 'skip');
    exerciseSolved = true;
    recordTrainingResult();
  }
  goToNextExercise();
}

function endTraining() {
  if (training && training.results.length) showTrainingReport();
  else setAppMode('train');
}

function updateTopbarProgress() {
  const label = document.getElementById('scoreLabel');
  const value = document.getElementById('scoreDisplay');
  if (training) {
    label.innerText = '';
    value.innerText = `${Math.min(training.index + 1, training.plan.length)} מתוך ${training.plan.length}`;
  } else if (appMode === 'train') {
    label.innerText = '';
    value.innerText = '';
  } else {
    label.innerText = 'ניקוד ';
    value.innerText = currentScore;
  }
}

function groupStats(results, keyFn) {
  const map = new Map();
  results.forEach(r => {
    const k = keyFn(r);
    if (!map.has(k)) map.set(k, { key: k, total: 0, correct: 0 });
    const g = map.get(k);
    g.total++;
    if (r.correct) g.correct++;
  });
  return [...map.values()];
}

function statRow(g) {
  const pct = Math.round(100 * g.correct / g.total);
  return `<div class="report-row"><div>${g.key}</div><div class="report-bar"><span style="width:${pct}%"></span></div><div class="num">${g.correct}/${g.total}</div></div>`;
}

function resumeTraining() {
  document.getElementById('trainingPanel').style.display = 'none';
  document.getElementById('practiceArea').style.display = 'flex';
  window.scrollTo(0, 0);
}

// partial: דוח ביניים באמצע אימון. האימון נשאר פתוח ולא נשמר בהיסטוריה
function showTrainingReport(partial = false) {
  const t = training;
  const results = t.results;
  const total = results.length;
  const correct = results.filter(r => r.correct).length;
  const pct = total ? Math.round(100 * correct / total) : 0;
  if (!partial) saveHistory({ t: Date.now(), level: t.level, correct, total });

  const byCat = groupStats(results, r => r.category);
  const byItem = groupStats(results, r => r.item).sort((a, b) => a.correct / a.total - b.correct / b.total);
  const invResults = results.filter(r => r.inversion);
  const byInv = groupStats(invResults, r => r.inversion);

  const confusions = new Map();
  results.filter(r => !r.correct && r.wrong && r.wrong.kind === 'type').forEach(r => {
    const k = `שמעת ${r.item} וענית ${r.wrong.label}`;
    confusions.set(k, (confusions.get(k) || 0) + 1);
  });
  const confList = [...confusions.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([k, n]) => `<li>${k}${n > 1 ? ` (${n} פעמים)` : ''}</li>`).join('');

  const strong = byItem.filter(g => g.correct === g.total && g.total >= 2).map(g => g.key);
  const weak = byItem.filter(g => g.correct / g.total < 0.7).map(g => g.key);
  const hasNext = t.level < EAR_LEVELS.length - 1;
  let advice;
  if (partial) {
    advice = total ? `ענית על ${total} מתוך ${t.plan.length} תרגילים. ההמלצה לרמה הבאה תופיע בסוף האימון.` : 'עוד לא ענית על אף תרגיל.';
  } else if (pct >= 85) {
    advice = hasNext ? 'מצוין. אפשר לעבור לרמה הבאה.' : 'מצוין. סיימת את הרמה הגבוהה ביותר.';
  } else if (weak.length) {
    advice = 'כדאי לחזור על הרמה הזו, עם דגש על מה שמופיע למטה בחיזוק.';
  } else {
    advice = 'כמעט שם. עוד סבב אחד ברמה הזו ואפשר להתקדם.';
  }

  if (!partial) {
    training = null;
    document.body.classList.remove('in-session');
  }
  document.getElementById('practiceArea').style.display = 'none';
  const panel = document.getElementById('trainingPanel');
  panel.style.display = 'block';
  updateTopbarProgress();
  const actions = partial
    ? `<button class="primary" onclick="resumeTraining()">המשך אימון</button>
      <button onclick="endTraining()">סיום אימון</button>`
    : `${hasNext && pct >= 85 ? `<button class="primary" onclick="startTraining(${t.level + 1})">לרמה הבאה</button>` : ''}
      <button class="${hasNext && pct >= 85 ? '' : 'primary'}" onclick="startTraining(${t.level})">שוב ברמה הזו</button>
      <button onclick="showLevelPicker()">כל הרמות</button>`;
  panel.innerHTML = `<h2>${EAR_LEVELS[t.level].name}: ${partial ? 'דוח עד כה' : 'סיכום'}</h2>
    ${total ? `<div class="report-score">${pct}%</div>
    <p class="sub">${correct} נכונות מתוך ${total} בניסיון הראשון</p>` : ''}
    <div class="report-section"><p class="report-advice">${advice}</p></div>
    ${byCat.length > 1 ? `<div class="report-section"><h3>לפי קטגוריה</h3>${byCat.map(statRow).join('')}</div>` : ''}
    ${total ? `<div class="report-section"><h3>לפי סוג</h3>${byItem.map(statRow).join('')}</div>` : ''}
    ${byInv.length ? `<div class="report-section"><h3>היפוכים</h3>${byInv.map(statRow).join('')}</div>` : ''}
    ${strong.length ? `<div class="report-section"><h3>חזק</h3><p class="report-advice">${strong.join(', ')}</p></div>` : ''}
    ${weak.length ? `<div class="report-section"><h3>לחיזוק</h3><p class="report-advice">${weak.join(', ')}</p></div>` : ''}
    ${confList ? `<div class="report-section"><h3>בלבולים נפוצים</h3><ul class="report-list">${confList}</ul></div>` : ''}
    <div class="report-actions">
      ${actions}
    </div>`;
  window.scrollTo(0, 0);
}

function initialAppMode() {
  const fromUrl = new URLSearchParams(location.search).get('mode');
  if (['read', 'ear', 'train'].includes(fromUrl)) return fromUrl;
  try {
    const saved = localStorage.getItem('mt_app_mode');
    if (['read', 'ear', 'train'].includes(saved)) return saved;
  } catch (e) {}
  return 'read';
}

// ===== עזרה בשלבים: קודם רמז שמקל (השמעה נוחה יותר, היפוך, משפחת האקורד), ורק בסוף התשובה =====
const INTERVAL_NUMBERS = ['פרימה', 'סקונדה', 'טרצה', 'קוורטה', 'קווינטה', 'סקסטה', 'ספטימה', 'אוקטבה'];
const TRIAD_FAMILIES = { '0,4,7': 'מז׳ורי', '0,3,7': 'מינורי', '0,3,6': 'מוקטן', '0,4,8': 'מוגדל' };

function noteLabel(n) {
  return NOTE_NAMES[n.nameIndex].name + (n.acc === 1 ? '♯' : n.acc === -1 ? '♭' : n.acc === 2 ? '𝄪' : n.acc === -2 ? '𝄫' : '');
}

// השמעה מקלה: קודם יחד, ואז צליל אחר צליל מלמטה למעלה ולאט
function playHintVersion() {
  const freqs = currentExercise.notes.map(n => midiToFreq(n.midiNum));
  const ctx = getAudioContext();
  newPlayBus(ctx);
  const now = ctx.currentTime + 0.05;
  freqs.forEach(f => playInstrumentNote(f, now, now + 1.4));
  const start = now + 1.7;
  const lastStart = start + (freqs.length - 1) * 0.55;
  freqs.forEach((f, idx) => playInstrumentNote(f, start + idx * 0.55, lastStart, 0, ending().melodic));
}

// סולם או מודוס: רק עולה, לאט, כל צליל לבד
function playScaleSlow() {
  const freqs = currentExercise.notes.map(n => midiToFreq(n.midiNum));
  const ctx = getAudioContext();
  newPlayBus(ctx);
  const now = ctx.currentTime + 0.05;
  freqs.forEach((f, idx) => {
    const last = idx === freqs.length - 1;
    if (last) playInstrumentNote(f, now + idx * 0.55, now + idx * 0.55, 0, ending().melodic);
    else playInstrumentNote(f, now + idx * 0.55, now + (idx + 1) * 0.55);
  });
}

// רמז שמצמצם את האפשרויות: keep מחליט אילו מבנים נשארים. אם נשארת אפשרות אחת זו כבר התשובה, אז לא מציעים אותו
function narrowStep(text, keep) {
  const kept = currentExercise.optionsPool.filter(keep);
  if (kept.length <= 1 || kept.length === currentExercise.optionsPool.length) return null;
  return { key: 'narrow', text, keep };
}

function intervalNumberStep(ear) {
  const ex = currentExercise;
  const num = ex.struct.stepOffsets[1];
  if (ear && ex.struct.id === 'A4') {
    return narrowStep('בין קוורטה לקווינטה', o => o.stepOffsets[1] === 3 || o.stepOffsets[1] === 4);
  }
  // בשמיעה הטריטון הוא גם קוורטה מוגדלת, אז הוא נשאר ברמז של קוורטה
  return narrowStep(`זו ${INTERVAL_NUMBERS[num]}${ear ? '' : ' (ספרו קווים ורווחים)'}`,
    o => o.stepOffsets[1] === num || (ear && num === 3 && o.id === 'A4'));
}

function chordFamilyStep() {
  const ex = currentExercise;
  if (typeAnsweredCorrectly) return null;
  if (ex.type === 'chords') {
    const third = ex.struct.semitones[1];
    return narrowStep(`הטרצה מעל השורש ${third === 4 ? 'גדולה' : 'קטנה'}`, o => o.semitones[1] === third);
  }
  const triad = ex.struct.semitones.slice(0, 3).join(',');
  return narrowStep(`המשולש שבבסיס ${TRIAD_FAMILIES[triad]}`, o => o.semitones.slice(0, 3).join(',') === triad);
}

function inversionStep() {
  const ex = currentExercise;
  if (inversionIrrelevant(ex.type, ex.struct) || ex.inversionsPool.length < 2 || selectedChordInv === ex.inversion) return null;
  return { key: 'inv', text: `היפוך: ${INVERSIONS_DATA[ex.type].find(i => i.id === ex.inversion).name}`, keepInv: ex.inversion };
}

function scaleFamilyStep() {
  const ex = currentExercise;
  if (ex.type === 'scales') {
    const minor = ex.struct.semitones[2] === 3;
    return narrowStep(minor ? 'זה אחד מסוגי המינור' : 'הטרצה גדולה', o => (o.semitones[2] === 3) === minor);
  }
  const sig = st => st.semitones[4] === 6 ? 'dim' : st.semitones[2] === 4 ? 'maj' : 'min';
  const fam = sig(ex.struct);
  const text = { maj: 'מודוס מז׳ורי (טרצה גדולה)', min: 'מודוס מינורי (טרצה קטנה)', dim: 'קווינטה מוקטנת מעל הטוניקה' }[fam];
  return narrowStep(text, o => sig(o) === fam);
}

function buildHintSteps() {
  const ex = currentExercise;
  const ear = document.getElementById('displayMode').value === 'audio_only';
  let steps = [];
  if (ex.type === 'note_id') {
    steps = [{ key: 'clef', text: ex.clef === 'fa' ? 'מפתח פה מסמן את פה על הקו הרביעי מלמטה, בין שתי הנקודות' : 'מפתח סול מסמן את סול על הקו השני מלמטה' }];
  } else if (ex.type === 'intervals') {
    if (ear) steps.push({ key: 'play', text: 'מעכשיו ההשמעה: יחד, ואז צליל אחר צליל מלמטה למעלה', play: playHintVersion });
    steps.push(intervalNumberStep(ear));
  } else if (ex.type === 'chords' || ex.type === 'septachords') {
    if (ear) steps.push({ key: 'play', text: 'מעכשיו ההשמעה: יחד, ואז צליל אחר צליל מלמטה למעלה', play: playHintVersion });
    else steps.push({ key: 'root', text: `השורש: ${noteLabel(ex.notes[(ex.notes.length - ex.inversion) % ex.notes.length])}` });
    steps.push(inversionStep(), chordFamilyStep());
  } else {
    if (ear) steps.push({ key: 'play', text: 'מעכשיו ההשמעה: רק עולה, לאט', play: playScaleSlow });
    steps.push(scaleFamilyStep());
  }
  return steps.filter(Boolean);
}

function applyHint(step) {
  if (step.play) {
    currentExercise.hintPlay = step.play;
    step.play();
  }
  if (step.keep) {
    document.querySelectorAll('#optionsButtons .opt-btn, #chordTypeButtons .opt-btn, #modeTypeButtons .opt-btn').forEach(btn => {
      const opt = currentExercise.optionsPool.find(o => o.name === btn.dataset.name);
      if (opt && !step.keep(opt)) btn.classList.add('hint-out');
    });
  }
  if (step.keepInv !== undefined) {
    document.querySelectorAll('#chordInvButtons .opt-btn').forEach(btn => {
      if (Number(btn.dataset.inv) !== step.keepInv) btn.classList.add('hint-out');
    });
  }
}

function showHelp() {
  if (!currentExercise) return;
  // הרמזים נבנים מחדש בכל לחיצה, כדי לדלג על חלק שהתלמיד כבר ענה עליו נכון
  const steps = buildHintSteps().filter(st => !shownHints.has(st.key));
  const btn = document.getElementById('helpBtn');
  if (steps.length) {
    const step = steps[0];
    applyHint(step);
    const popover = document.getElementById('helpPopover');
    popover.innerText = step.text;
    popover.classList.add('visible');
    shownHints.add(step.key);
    btn.innerText = steps.length > 1 ? 'רמז נוסף' : 'תשובה';
    return;
  }
  revealAnswer();
  btn.innerText = 'עזרה';
}

function revealAnswer() {
  if (!currentExercise) return;
  const popover = document.getElementById('helpPopover');
  let text = '';

  if (currentExercise.type === 'note_id') {
    const n = currentExercise.correctNote;
    let name = NOTE_NAMES[n.nameIndex].eng + ' / ' + NOTE_NAMES[n.nameIndex].name;
    let accStr = n.acc === 1 ? ' דיאז' : (n.acc === -1 ? ' במול' : '');
    text = `${name}${accStr}`;
  } else if (currentExercise.type === 'modes' || currentExercise.type === 'scales') {
    const rootNote = currentExercise.notes[0];
    const rootStr = NOTE_NAMES[rootNote.nameIndex].name + (rootNote.acc === 1 ? '♯' : (rootNote.acc === -1 ? '♭' : ''));
    text = `${rootStr} ${currentExercise.struct.name}`;
  } else if (currentExercise.type === 'chords' || currentExercise.type === 'septachords') {
    const invName = INVERSIONS_DATA[currentExercise.type].find(i => i.id === currentExercise.inversion).name;
    text = `${getStructureLabel(currentExercise.struct)} (${invName})`;
  } else {
    text = `${getStructureLabel(currentExercise.struct)}`;
  }

  popover.innerText = text;
  popover.classList.add('visible');
}

// כמה כפתורים נכנסים בשורה (לפחות 85px לכפתור), כמו grid auto-fit, אבל השורה האחרונה ממורכזת
function fitOptionsGrid(grid) {
  const width = grid.clientWidth;
  if (!width) return;
  const gap = parseFloat(getComputedStyle(grid).columnGap) || 0;
  const fit = Math.max(1, Math.floor((width + gap) / (85 + gap)));
  grid.style.setProperty('--cols', Math.max(1, Math.min(grid.children.length, fit)));
}
const gridResize = new ResizeObserver(entries => entries.forEach(e => fitOptionsGrid(e.target)));
const gridChildren = new MutationObserver(records => records.forEach(r => fitOptionsGrid(r.target)));
document.querySelectorAll('.options-grid').forEach(g => {
  gridResize.observe(g);
  gridChildren.observe(g, { childList: true });
});

onExerciseTypeChange();
loadSamples(document.getElementById('instrumentSelect').value);
initSilentTip();
const fromLink = new URLSearchParams(location.search).has('exData');
setAppMode(fromLink ? 'read' : initialAppMode(), true);
applySharedSettings();
if (!loadExerciseFromUrl() && appMode !== 'train') {
  startPractice();
}
</script>
<script src="update-check.js"></script>
</body>
