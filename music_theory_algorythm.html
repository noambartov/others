<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מחשב מוזיקלי מקיף: מרווחים, סולמות, ואקורדים מרובעים</title>
  <style>
    :root {
      --primary: #4a6fa5;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      direction: rtl;
    }
    .calculator-card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 580px;
    }
    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 15px;
    }
    
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 14px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .note-selects {
      display: flex;
      gap: 10px;
    }
    select {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button.calc-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button.calc-btn:hover {
      background-color: #3b5984;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef2f7;
      border-right: 4px solid var(--primary);
      border-radius: 4px;
    }
    .result-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }
    .result-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }
    .scale-section-title {
      font-weight: bold;
      color: #444;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .scale-notes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .scale-note-badge {
      background: #ffffff;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h2>מערכת חישוב מוזיקלית מקיפה</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('intervals', event)">מרווחים</button>
    <button class="tab-btn" onclick="switchTab('scales', event)">סולמות</button>
    <button class="tab-btn" onclick="switchTab('triads', event)">אקורדים משולשים</button>
    <button class="tab-btn" onclick="switchTab('tetrads', event)">אקורדים מרובעים</button>
  </div>

  <!-- לשונית 1: מרווחים -->
  <div id="intervals" class="tab-content active">
    <div class="form-group">
      <label>צליל ראשון (נקודת מוצא):</label>
      <div class="note-selects">
        <select id="note1Name">
          <option value="0">דו (C)</option>
          <option value="1" selected>רה (D)</option>
          <option value="2">מי (E)</option>
          <option value="3">פה (F)</option>
          <option value="4">סול (G)</option>
          <option value="5">לה (A)</option>
          <option value="6">סי (B)</option>
        </select>
        <select id="note1Acc">
          <option value="-2">במול כפול (bb)</option>
          <option value="-1">במול (b)</option>
          <option value="0">בקר (natural)</option>
          <option value="1">דיאז (#)</option>
          <option value="2" selected>דיאז כפול (x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>צליל שני:</label>
      <div class="note-selects">
        <select id="note2Name">
          <option value="0">דו (C)</option>
          <option value="1">רה (D)</option>
          <option value="2" selected>מי (E)</option>
          <option value="3">פה (F)</option>
          <option value="4">סול (G)</option>
          <option value="5">לה (A)</option>
          <option value="6">סי (B)</option>
        </select>
        <select id="note2Acc">
          <option value="-2">במול כפול (bb)</option>
          <option value="-1">במול (b)</option>
          <option value="0">בקר (natural)</option>
          <option value="1" selected>דיאז (#)</option>
          <option value="2">דיאז כפול (x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>כיוון המרווח:</label>
      <select id="direction">
        <option value="up">בעלייה (מהראשון לשני)</option>
        <option value="down">בירידה (מהראשון לשני)</option>
      </select>
    </div>

    <button class="calc-btn" onclick="calculateInterval()">חשב מרווח</button>

    <div class="result-box" id="intervalResultBox" style="display:none;">
      <div class="result-title">תוצאה:</div>
      <div class="result-value" id="intervalName">-</div>
      <div style="margin-top: 5px;" id="intervalTones">-</div>
    </div>
  </div>

  <!-- לשונית 2: סולמות -->
  <div id="scales" class="tab-content">
    <div class="form-group">
      <label>בחר טוניקה (צליל הבסיס):</label>
      <div class="note-selects">
        <select id="scaleRootName">
          <option value="0">דו (C)</option>
          <option value="1" selected>רה (D)</option>
          <option value="2">מי (E)</option>
          <option value="3">פה (F)</option>
          <option value="4">סול (G)</option>
          <option value="5">לה (A)</option>
          <option value="6">סי (B)</option>
        </select>
        <select id="scaleRootAcc">
          <option value="-2">במול כפול (bb)</option>
          <option value="-1">במול (b)</option>
          <option value="0" selected>בקר (natural)</option>
          <option value="1">דיאז (#)</option>
          <option value="2">דיאז כפול (x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>סוג הסולם:</label>
      <select id="scaleType">
        <option value="major">מז'ורי</option>
        <option value="minor_natural">מינורי טבעי</option>
        <option value="minor_harmonic">מינורי הרמוני</option>
        <option value="minor_melodic">מינורי מלודי</option>
      </select>
    </div>

    <button class="calc-btn" onclick="calculateScale()">חשב סולם</button>

    <div class="result-box" id="scaleResultBox" style="display:none;">
      <div id="scaleNotesDisplay"></div>
    </div>
  </div>

  <!-- לשונית 3: אקורדים משולשים -->
  <div id="triads" class="tab-content">
    <div class="form-group">
      <label>בחר צליל יסוד (שורש האקורד):</label>
      <div class="note-selects">
        <select id="triadRootName">
          <option value="0">דו (C)</option>
          <option value="1">רה (D)</option>
          <option value="2">מי (E)</option>
          <option value="3" selected>פה (F)</option>
          <option value="4">סול (G)</option>
          <option value="5">לה (A)</option>
          <option value="6">סי (B)</option>
        </select>
        <select id="triadRootAcc">
          <option value="-2">במול כפול (bb)</option>
          <option value="-1">במול (b)</option>
          <option value="0" selected>בקר (natural)</option>
          <option value="1">דיאז (#)</option>
          <option value="2">דיאז כפול (x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>סוג האקורד המשולש:</label>
      <select id="triadType">
        <option value="major">מז'ורי</option>
        <option value="minor" selected>מינורי</option>
        <option value="diminished">מוקטן</option>
        <option value="augmented">מוגדל</option>
      </select>
    </div>

    <div class="form-group">
      <label>מצב / היפוך האקורד:</label>
      <select id="triadInversion">
        <option value="0">מצב יסודי (שורש בבס)</option>
        <option value="1" selected>היפוך ראשון - סקסטאקורד (טרצה בבס)</option>
        <option value="2">היפוך שני - קוורטסקסטאקורד (קווינטה בבס)</option>
      </select>
    </div>

    <button class="calc-btn" onclick="calculateTriad()">חשב אקורד משולש</button>

    <div class="result-box" id="triadResultBox" style="display:none;">
      <div class="result-title" id="triadResultTitle">צלילי האקורד:</div>
      <div class="scale-notes-list" id="triadNotesContainer"></div>
    </div>
  </div>

  <!-- לשונית 4: אקורדים מרובעים (ספט-אקורדים) -->
  <div id="tetrads" class="tab-content">
    <div class="form-group">
      <label>בחר צליל יסוד (שורש האקורד):</label>
      <div class="note-selects">
        <select id="tetradRootName">
          <option value="0">דו (C)</option>
          <option value="1">רה (D)</option>
          <option value="2">מי (E)</option>
          <option value="3">פה (F)</option>
          <option value="4" selected>סול (G)</option>
          <option value="5">לה (A)</option>
          <option value="6">סי (B)</option>
        </select>
        <select id="tetradRootAcc">
          <option value="-2">במול כפול (bb)</option>
          <option value="-1">במול (b)</option>
          <option value="0" selected>בקר (natural)</option>
          <option value="1">דיאז (#)</option>
          <option value="2">דיאז כפול (x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>סוג האקורד המרובע (ספט-אקורד):</label>
      <select id="tetradType">
        <option value="half_diminished">חצי מוקטן (טרצה קטנה, קווינטה מוקטנת, ספטימה קטנה)</option>
        <option value="minor7">מינור (טרצה קטנה, קווינטה זכה, ספטימה קטנה)</option>
        <option value="dominant7" selected>דומיננטי (טרצה גדולה, קווינטה זכה, ספטימה קטנה)</option>
        <option value="major7">מז'ור גדול (טרצה גדולה, קווינטה זכה, ספטימה גדולה)</option>
        <option value="augmented_major7">מוגדל גדול (טרצה גדולה, קווינטה מוגדלת, ספטימה גדולה)</option>
        <option value="diminished7">מוקטן קטן (טרצה קטנה, קווינטה מוקטנת, ספטימה מוקטנת)</option>
        <option value="minor_major7">מינור גדול (טרצה קטנה, קווינטה זכה, ספטימה גדולה)</option>
        <option value="augmented7">מוגדל קטן (טרצה גדולה, קווינטה מוגדלת, ספטימה קטנה)</option>
      </select>
    </div>

    <div class="form-group">
      <label>מצב / היפוך האקורד:</label>
      <select id="tetradInversion">
        <option value="0">מצב יסודי (שורש בבס)</option>
        <option value="1">היפוך ראשון - קווינטסקסטאקורד (טרצה בבס)</option>
        <option value="2">היפוך שני - טרצקוורטאקורד (קווינטה בבס)</option>
        <option value="3">היפוך שלישי - סקונדאקורד (ספטימה בבס)</option>
      </select>
    </div>

    <button class="calc-btn" onclick="calculateTetrad()">חשב אקורד מרובע</button>

    <div class="result-box" id="tetradResultBox" style="display:none;">
      <div class="result-title" id="tetradResultTitle">צלילי האקורד:</div>
      <div class="scale-notes-list" id="tetradNotesContainer"></div>
    </div>
  </div>
</div>

<script src="theory-core.js"></script>
<script>
const T = window.TheoryCore;

function switchTab(tabId, evt) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  
  evt.target.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function readNote(prefix) {
  return {
    letter: parseInt(document.getElementById(prefix + 'Name').value),
    acc: parseInt(document.getElementById(prefix + 'Acc').value)
  };
}

// בונה מבנה מהקטלוג המשותף ומחזיר את שמות הצלילים במילים
function spellStructure(type, id, rootNote, inversion) {
  const struct = T.findStructure(type, id);
  const line = T.lineForLetter(rootNote.letter, 'sol', -2);
  const { notes } = T.build(struct, { line, acc: rootNote.acc, clef: 'sol', inversion: inversion || 0 });
  return notes.map(n => T.noteName(n.letter, n.acc, 'word'));
}

function hasUnspellable(names) {
  return names.some(n => n.includes('(?)'));
}

const UNSPELLABLE_NOTE = '<div class="result-title">שימו לב: חלק מהצלילים דורשים יותר מהיתק כפול, ולכן הסולם או האקורד לא מעשיים. צלילים כאלה מסומנים ב-(?).</div>';

function renderBadges(container, names) {
  container.innerHTML = '';
  names.forEach(name => {
    const badge = document.createElement('div');
    badge.className = 'scale-note-badge';
    badge.innerText = name;
    container.appendChild(badge);
  });
}

// === 1. חישוב מרווחים ===
function calculateInterval() {
  const n1 = readNote('note1');
  const n2 = readNote('note2');
  const dir = document.getElementById('direction').value;

  const result = T.identifyInterval(n1.letter, n1.acc, n2.letter, n2.acc, dir);

  document.getElementById('intervalName').innerText = result.name;
  document.getElementById('intervalTones').innerText = `מרחק: ${result.semitones} חצאי טונים (${result.semitones / 2} טונים)`;
  document.getElementById('intervalResultBox').style.display = 'block';
}

// === 2. חישוב סולמות ===
function calculateScale() {
  const rootNote = readNote('scaleRoot');
  const scaleType = document.getElementById('scaleType').value;
  const badges = names => names.map(n => `<div class="scale-note-badge">${n}</div>`).join('');

  const displayContainer = document.getElementById('scaleNotesDisplay');

  if (scaleType === 'minor_melodic') {
    const notesUp = spellStructure('scales', 'minor_melodic', rootNote);
    const notesDown = spellStructure('scales', 'minor_natural', rootNote).reverse();

    displayContainer.innerHTML = `
      <div class="scale-section-title">בעלייה (דרגות 6 ו-7 מועלות):</div>
      <div class="scale-notes-list">${badges(notesUp)}</div>
      <div class="scale-section-title">בירידה (כמו מינור טבעי):</div>
      <div class="scale-notes-list">${badges(notesDown)}</div>
      ${hasUnspellable(notesUp.concat(notesDown)) ? UNSPELLABLE_NOTE : ''}
    `;
  } else {
    const notes = spellStructure('scales', scaleType, rootNote);
    displayContainer.innerHTML = `
      <div class="result-title">צלילי הסולם:</div>
      <div class="scale-notes-list">${badges(notes)}</div>
      ${hasUnspellable(notes) ? UNSPELLABLE_NOTE : ''}
    `;
  }

  document.getElementById('scaleResultBox').style.display = 'block';
}

// === 3. חישוב אקורדים משולשים ===
function calculateTriad() {
  const rootNote = readNote('triadRoot');
  const chordType = document.getElementById('triadType').value;
  const inversion = parseInt(document.getElementById('triadInversion').value);

  const chordNotes = spellStructure('chords', chordType, rootNote, inversion);

  const inversionTitles = [
    "צלילי האקורד במצב יסודי (שורש - טרצה - קווינטה):",
    "צלילי האקורד בהיפוך ראשון / סקסטאקורד (בס - אמצע - סופרן):",
    "צלילי האקורד בהיפוך שני / קוורטסקסטאקורד (בס - אמצע - סופרן):"
  ];

  document.getElementById('triadResultTitle').innerText = inversionTitles[inversion] + (hasUnspellable(chordNotes) ? ' (כולל צליל לא מעשי)' : '');
  renderBadges(document.getElementById('triadNotesContainer'), chordNotes);
  document.getElementById('triadResultBox').style.display = 'block';
}

// === 4. חישוב אקורדים מרובעים (ספט-אקורדים) ===
function calculateTetrad() {
  const rootNote = readNote('tetradRoot');
  const chordType = document.getElementById('tetradType').value;
  const inversion = parseInt(document.getElementById('tetradInversion').value);

  const chordNotes = spellStructure('septachords', chordType, rootNote, inversion);

  const inversionTitles = [
    "צלילי האקורד במצב יסודי (שורש - טרצה - קווינטה - ספטימה):",
    "צלילי האקורד בהיפוך ראשון / קווינטסקסטאקורד (טרצה בבס):",
    "צלילי האקורד בהיפוך שני / טרצקוורטאקורד (קווינטה בבס):",
    "צלילי האקורד בהיפוך שלישי / סקונדאקורד (ספטימה בבס):"
  ];

  document.getElementById('tetradResultTitle').innerText = inversionTitles[inversion] + (hasUnspellable(chordNotes) ? ' (כולל צליל לא מעשי)' : '');
  renderBadges(document.getElementById('tetradNotesContainer'), chordNotes);
  document.getElementById('tetradResultBox').style.display = 'block';
}
</script>

</body>
</html>
