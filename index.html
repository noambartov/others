<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תורת המוזיקה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400&display=swap');

        * { box-sizing: border-box; }
        html, body { margin: 0; background: #fff; color: #111; font-family: 'Assistant', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        a { color: inherit; text-decoration: none; }

        main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 64px 16px 48px; }
        h1 { font-weight: 300; font-size: 40px; margin: 0; text-align: center; }
        svg.staff { display: block; width: 100%; height: auto; margin: 28px 0 40px; color: #111; }

        nav { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; margin: 0 auto; text-align: center; }
        nav a { display: block; border: 1px solid #d1d5db; border-radius: 999px; padding: 14px 20px; font-size: 20px; transition: background .15s, border-color .15s; }
        nav a:hover { background: #f5f5f5; border-color: #9ca3af; }

        /* הקרדיט בתחתית הדף, כמו בתרגול האונליין */
        footer { text-align: center; font-size: 13px; color: #aaaaaa; padding: 24px 16px; }
        footer a { color: #888888; }
        footer a:hover { color: #222222; text-decoration: underline; }
    </style>
</head>
<body>
    <main>
        <h1>תורת המוזיקה</h1>
        <svg class="staff" id="staff" viewBox="0 0 700 90" aria-hidden="true"></svg>
        <nav>
            <a href="music_theory_exercise_tool.html">תרגול אונליין</a>
            <a href="music_theory_worksheets_generator.html">דפי תרגול להדפסה</a>
            <a href="music_theory_algorythm.html">מחשבון</a>
        </nav>
    </main>

    <footer>
        נעם ברטוב <a href="https://noambartov.com" target="_blank" rel="noopener noreferrer">noambartov.com</a>
    </footer>

    <script src="theory-core.js"></script>
    <script>
        // חמשה עם מפתח סול, אקורד וסולם עולה
        const S = TheoryCore.svg;
        const staff = { bottomY: 66, space: 10 };
        let svg = '';
        for (let i = 0; i < 5; i++) {
            const y = S.lineY(staff, i * 2);
            svg += `<line x1="0" x2="700" y1="${y}" y2="${y}" stroke="#94a3b8" stroke-width="1.2"/>`;
        }
        svg += `<line x1="0.6" x2="0.6" y1="${S.lineY(staff, 8)}" y2="${S.lineY(staff, 0)}" stroke="#94a3b8" stroke-width="1.2"/>`;
        svg += S.clef('sol', 30, staff);
        [2, 4, 6].forEach(line => svg += S.notehead(240, S.lineY(staff, line), staff.space));
        for (let line = 1; line <= 8; line++) svg += S.notehead(350 + line * 30, S.lineY(staff, line), staff.space);
        document.getElementById('staff').innerHTML = svg;
    </script>
</body>
</html>
