<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל דפי תרגול - סולמות מותאמים</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 30px 15px;
      color: var(--text-color);
      direction: rtl;
    }

    .app-container { max-width: 1100px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 20px; }
    .app-header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 24px; }

    .controls-panel {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 20px;
      margin-bottom: 20px;
    }

    .row-control {
      display: grid;
      grid-template-columns: 75px 130px 95px 160px 1fr 35px;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .row-control:last-child { border-bottom: none; }
    .row-label { font-weight: 700; color: var(--primary); font-size: 13.5px; }

    select, .custom-select-btn {
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background-color: #f8fafc;
      font-size: 13px;
      color: var(--text-color);
      outline: none;
    }

    .multi-select-container { position: relative; width: 100%; }
    .multi-select-btn {
      width: 100%; text-align: right; cursor: pointer;
      box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .multi-select-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      width: 280px; background: #fff; border: 1px solid var(--border-color);
      border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 8px 12px;
    }
    .multi-select-dropdown.show { display: block; }
    .multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; cursor: pointer; }
    .select-all-btn { font-size: 11.5px; color: var(--accent); font-weight: bold; cursor: pointer; margin-bottom: 6px; border-bottom: 1px dashed #ccc; padding-bottom: 4px; display: inline-block; }

    .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; }
    .btn-add-row { background: #27ae60; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; display: inline-block; }

    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    .btn { padding: 10px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-generate { background-color: var(--accent); color: white; }
    .btn-pdf { background-color: #2ecc71; color: white; }
    .btn-answers { background-color: #9b59b6; color: white; }

    .a4-page-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 20px; }

    .worksheet-a4 {
      width: 210mm; min-height: 297mm; padding: 12mm 15mm;
      background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); box-sizing: border-box; direction: rtl;
    }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 14px; }
    .sheet-title { font-size: 18px; font-weight: bold; color: #111; }
    .sheet-fields { display: flex; gap: 20px; font-size: 11px; }
    .field-line { border-bottom: 1px dashed #555; display: inline-block; width: 75px; }

    .staff-system { margin-bottom: 16px; page-break-inside: avoid; }
    .exercise-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #222; direction: rtl; }

    .staff-svg { width: 100%; height: 95px; display: block; }
    
    .answer-row { 
      display: flex; 
      flex-direction: row; 
      justify-content: space-around; 
      font-size: 9.5px; 
      color: #333; 
      margin-top: 4px; 
      direction: ltr; 
    }
    .answer-cell { text-align: center; font-weight: bold; direction: rtl; }
    .solution-text { color: #8e44ad; font-size: 11px; font-weight: bold; }
    .read-text { color: #8e44ad; font-size: 10px; margin-bottom: 2px; font-weight: bold; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h1>מחולל תרגילים בתורת המוזיקה</h1>
  </div>

  <div class="controls-panel">
    <div id="rowsContainer"></div>
    <button class="btn-add-row" onclick="addRow()">הוסף חמשה +</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateSheet()">צור/רענן תרגילים</button>
    <button class="btn btn-answers" onclick="toggleAnswersPage()">הצג/הסתר דף תשובות</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">הורד קובץ PDF</button>
  </div>

  <div class="a4-page-container">
    <div id="worksheet-a4" class="worksheet-a4">
      <div class="sheet-header">
        <div class="sheet-title">תרגול תורת המוזיקה</div>
        <div class="sheet-fields">
          <div>שם: <span class="field-line"></span></div>
          <div>תאריך: <span class="field-line" style="width:50px;"></span></div>
        </div>
      </div>
      <div id="stavesContainer"></div>
    </div>

    <div id="answersheet-a4" class="worksheet-a4" style="display: none;">
      <div class="sheet-header">
        <div class="sheet-title" style="color: #8e44ad;">דף תשובות ופתרונות מלאים</div>
        <div class="sheet-fields">
          <div>מורה/בודק: <span class="field-line"></span></div>
        </div>
      </div>
      <div id="answersStavesContainer"></div>
    </div>
  </div>
</div>

<script>
const NOTE_NAMES_HE = ["דו", "רה", "מי", "פה", "סול", "לה", "סי"];
const DIATONIC_SEMITONES = [0, 2, 4, 5, 7, 9, 11];

function accToSymbol(acc) {
  if (acc === 1) return "♯";
  if (acc === -1) return "♭";
  if (acc === 2) return "𝄪";
  if (acc === -2) return "𝄫";
  return "";
}

function accToString(acc) {
  if (acc === 1) return "#";
  if (acc === -1) return "b";
  if (acc === 2) return "x";
  if (acc === -2) return "bb";
  return "";
}

function getNoteDetails(absLine, acc, clef) {
  let baseIndex = (clef === 'sol') ? 2 : 4; 
  let diatonicIdx = baseIndex + absLine;
  
  let nameIndex = diatonicIdx % 7;
  while (nameIndex < 0) nameIndex += 7;
  
  let octave = Math.floor(diatonicIdx / 7);
  let semitones = octave * 12 + DIATONIC_SEMITONES[nameIndex] + acc;
  
  let strAcc = accToString(acc);
  let fullName = NOTE_NAMES_HE[nameIndex] + (strAcc ? " " + strAcc : "");
  
  return { name: fullName, diatonicIdx, semitones, nameIndex };
}

function analyzeChord(notes, fallbackName) {
  if (notes.length !== 3) return fallbackName;

  let d1 = notes[1].diatonicIdx - notes[0].diatonicIdx;
  let d2 = notes[2].diatonicIdx - notes[1].diatonicIdx;
  let s1 = notes[1].semitones - notes[0].semitones;
  let s2 = notes[2].semitones - notes[1].semitones;

  let rootNote = "";
  let chordType = "";

  if (d1 === 2 && d2 === 2) {
    rootNote = notes[0].name;
    if (s1 === 4 && s2 === 3) chordType = "מז׳ור יסודי";
    else if (s1 === 3 && s2 === 4) chordType = "מינור יסודי";
    else if (s1 === 3 && s2 === 3) chordType = "מוקטן יסודי";
    else if (s1 === 4 && s2 === 4) chordType = "מוגדל יסודי";
  }
  else if (d1 === 2 && d2 === 3) {
    rootNote = notes[2].name;
    if (s1 === 3 && s2 === 5) chordType = "מז׳ור היפוך ראשון";
    else if (s1 === 4 && s2 === 5) chordType = "מינור היפוך ראשון";
    else if (s1 === 3 && s2 === 6) chordType = "מוקטן היפוך ראשון";
    else if (s1 === 4 && s2 === 4) chordType = "מוגדל היפוך ראשון";
  }
  else if (d1 === 3 && d2 === 2) {
    rootNote = notes[1].name;
    if (s1 === 5 && s2 === 4) chordType = "מז׳ור היפוך שני";
    else if (s1 === 5 && s2 === 3) chordType = "מינור היפוך שני";
    else if (s1 === 6 && s2 === 3) chordType = "מוקטן היפוך שני";
    else if (s1 === 4 && s2 === 4) chordType = "מוגדל היפוך שני";
  }

  if (chordType) {
    return `${rootNote} ${chordType}`;
  }
  
  return `${notes[0].name} - ${fallbackName}`;
}

const DEFINED_STRUCTURES = {
  intervals: [
    { name: 'סקונדה קטנה', offsets: [0, 1], accs: [0, -1] },
    { name: 'סקונדה גדולה', offsets: [0, 1], accs: [0, 0] },
    { name: 'טרצה קטנה', offsets: [0, 2], accs: [0, -1] },
    { name: 'טרצה גדולה', offsets: [0, 2], accs: [0, 0] },
    { name: 'קוורטה זכה', offsets: [0, 3], accs: [0, 0] },
    { name: 'קוורטה מוגדלת', offsets: [0, 3], accs: [0, 1] },
    { name: 'קווינטה מוקטנת', offsets: [0, 4], accs: [0, -1] },
    { name: 'קווינטה זכה', offsets: [0, 4], accs: [0, 0] }
  ],
  chords: [
    { name: 'מז׳ור יסודי', offsets: [0, 2, 4], accs: [0, 0, 0] },
    { name: 'מז׳ור היפוך ראשון', offsets: [0, 2, 5], accs: [0, -1, 0] },
    { name: 'מז׳ור היפוך שני', offsets: [0, 3, 5], accs: [0, 0, 0] },
    { name: 'מינור יסודי', offsets: [0, 2, 4], accs: [0, -1, 0] },
    { name: 'מינור היפוך ראשון', offsets: [0, 2, 5], accs: [0, 0, 0] },
    { name: 'מינור היפוך שני', offsets: [0, 3, 5], accs: [0, 0, -1] },
    { name: 'מוקטן יסודי', offsets: [0, 2, 4], accs: [0, -1, -1] },
    { name: 'מוקטן היפוך ראשון', offsets: [0, 2, 5], accs: [0, -1, 0] },
    { name: 'מוקטן היפוך שני', offsets: [0, 3, 5], accs: [0, 0, -1] },
    { name: 'מוגדל יסודי', offsets: [0, 2, 4], accs: [0, 0, 1] },
    { name: 'מוגדל היפוך ראשון', offsets: [0, 2, 5], accs: [0, 1, 0] },
    { name: 'מוגדל היפוך שני', offsets: [0, 3, 5], accs: [0, 0, 0] }
  ],
  septachords: [
    { name: 'דומיננטי 7 (מצב יסודי)', offsets: [0, 2, 4, 6], accs: [0, 0, 0, -1] },
    { name: 'דומיננטי 7 (קווינטסקסטאקורד - היפוך ראשון)', offsets: [0, 2, 4, 5], accs: [0, 0, -1, 0] },
    { name: 'דומיננטי 7 (טרצקוורטאקורד - היפוך שני)', offsets: [0, 2, 3, 5], accs: [0, -1, 0, 0] },
    { name: 'דומיננטי 7 (סקונדאקורד - היפוך שלישי)', offsets: [0, 1, 3, 5], accs: [0, 1, 1, 1] },

    { name: 'חצי מוקטן (m7b5) (מצב יסודי)', offsets: [0, 2, 4, 6], accs: [0, -1, -1, -1] },
    { name: 'חצי מוקטן (m7b5) (קווינטסקסטאקורד - היפוך ראשון)', offsets: [0, 2, 4, 5], accs: [0, 0, 0, 1] },
    { name: 'חצי מוקטן (m7b5) (טרצקוורטאקורד - היפוך שני)', offsets: [0, 2, 3, 5], accs: [0, 0, 1, 1] },
    { name: 'חצי מוקטן (m7b5) (סקונדאקורד - היפוך שלישי)', offsets: [0, 1, 3, 5], accs: [0, 1, 1, 0] },

    { name: 'מוקטן מלא (dim7) (מצב יסודי)', offsets: [0, 2, 4, 6], accs: [0, -1, -1, -2] },
    { name: 'מוקטן מלא (dim7) (קווינטסקסטאקורד - היפוך ראשון)', offsets: [0, 2, 4, 5], accs: [0, 0, -1, 1] },
    { name: 'מוקטן מלא (dim7) (טרצקוורטאקורד - היפוך שני)', offsets: [0, 2, 3, 5], accs: [0, -1, 1, 1] },
    { name: 'מוקטן מלא (dim7) (סקונדאקורד - היפוך שלישי)', offsets: [0, 1, 3, 5], accs: [0, 2, 2, 1] },

    { name: 'מינור 7 (מצב יסודי)', offsets: [0, 2, 4, 6], accs: [0, -1, 0, -1] },
    { name: 'מינור 7 (קווינטסקסטאקורד - היפוך ראשון)', offsets: [0, 2, 4, 5], accs: [0, 1, 0, 1] },
    { name: 'מינור 7 (טרצקוורטאקורד - היפוך שני)', offsets: [0, 2, 3, 5], accs: [0, -1, 0, 0] },
    { name: 'מינור 7 (סקונדאקורד - היפוך שלישי)', offsets: [0, 1, 3, 5], accs: [0, 1, 1, 0] },

    { name: 'מז׳ור גדול (Maj7) (מצב יסודי)', offsets: [0, 2, 4, 6], accs: [0, 0, 0, 0] },
    { name: 'מז׳ור גדול (Maj7) (קווינטסקסטאקורד - היפוך ראשון)', offsets: [0, 2, 4, 5], accs: [0, 0, 0, 1] },
    { name: 'מז׳ור גדול (Maj7) (טרצקוורטאקורד - היפוך שני)', offsets: [0, 2, 3, 5], accs: [0, 0, 1, 1] },
    { name: 'מז׳ור גדול (Maj7) (סקונדאקורד - היפוך שלישי)', offsets: [0, 1, 3, 5], accs: [0, 1, 1, 1] }
  ],
  scales: [
    { name: 'זיהוי לפי סימני היתק בלבד', isKeySigOnly: true, offsets: [], accs: [] },
    { name: 'מז׳ור', offsets: [0, 1, 2, 3, 4, 5, 6, 7], accs: [0, 0, 0, 0, 0, 0, 0, 0] },
    { name: 'מינור טבעי', offsets: [0, 1, 2, 3, 4, 5, 6, 7], accs: [0, 0, -1, 0, 0, -1, -1, 0] }
  ]
};

let rowCounter = 0;
const CLEFS_LIST = [{ val: 'sol', label: 'מפתח סול' }, { val: 'fa', label: 'מפתח פה' }];
const INTERVALS_LIST = DEFINED_STRUCTURES.intervals.map(s => s.name);
const CHORDS_LIST = DEFINED_STRUCTURES.chords.map(s => s.name);
const SEPTACHORDS_LIST = DEFINED_STRUCTURES.septachords.map(s => s.name);
const SCALES_LIST = DEFINED_STRUCTURES.scales.map(s => s.name);

window.addEventListener('click', function(e) {
  if (!e.target.closest('.multi-select-container')) {
    document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
      el.classList.remove('show');
    });
  }
});

function addRow() {
  rowCounter++;
  const id = rowCounter;
  const container = document.getElementById('rowsContainer');
  const row = document.createElement('div');
  row.className = 'row-control';
  row.id = `row_${id}`;

  row.innerHTML = `
    <div class="row-label">חמשה <span class="row-num"></span>:</div>
    <div class="multi-select-container">
      <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, 'clefs_${id}')">מפתחות</div>
      <div class="multi-select-dropdown" id="clefs_${id}">
        <span class="select-all-btn" onclick="toggleAll('clefs_${id}')">סמן הכל / הסר הכל</span>
        ${CLEFS_LIST.map(c => `<label><input type="checkbox" value="${c.val}" checked> ${c.label}</label>`).join('')}
      </div>
    </div>
    <select id="skill_${id}">
      <option value="id">זיהוי</option>
      <option value="write">כתיבה</option>
    </select>
    <select id="type_${id}" onchange="onTypeChange(${id})">
      <option value="intervals">מרווחים</option>
      <option value="chords" selected>אקורדים משולשים</option>
      <option value="septachords">ספטאקורדים</option>
      <option value="scales">סולמות</option>
    </select>
    <div id="sub_container_${id}"></div>
    <button class="btn-remove" onclick="removeRow(${id})">✕</button>
  `;
  container.appendChild(row);
  onTypeChange(id);
  updateRowNumbers();
}

function removeRow(id) {
  document.getElementById(`row_${id}`)?.remove();
  updateRowNumbers();
}

function updateRowNumbers() {
  document.querySelectorAll('.row-control').forEach((r, idx) => {
    r.querySelector('.row-num').innerText = idx + 1;
  });
}

function onTypeChange(i) {
  const type = document.getElementById(`type_${i}`).value;
  const container = document.getElementById(`sub_container_${i}`);
  let itemsList = (type === 'intervals') ? INTERVALS_LIST : 
                  (type === 'chords' ? CHORDS_LIST : 
                  (type === 'septachords' ? SEPTACHORDS_LIST : SCALES_LIST));

  container.innerHTML = `
    <div class="multi-select-container">
      <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, '${type}_${i}')">סינון תרגילים</div>
      <div class="multi-select-dropdown" id="${type}_${i}">
        <span class="select-all-btn" onclick="toggleAll('${type}_${i}')">סמן הכל / הסר הכל</span>
        ${itemsList.map(item => `<label><input type="checkbox" value="${item}" checked> ${item}</label>`).join('')}
      </div>
    </div>`;
}

function toggleDropdown(e, id) {
  e.stopPropagation();
  const target = document.getElementById(id);
  const wasShown = target.classList.contains('show');
  
  document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
    el.classList.remove('show');
  });

  if (!wasShown) {
    target.classList.add('show');
  }
}

function toggleAll(dropdownId) {
  const checkboxes = document.querySelectorAll(`#${dropdownId} input[type="checkbox"]`);
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
}

function getClefSVG(clef) {
  if (clef === 'fa') {
    return `<g transform="translate(25, 19) scale(0.65)">
      <path d="M 12 12 C 12 6, 22 6, 22 14 C 22 22, 10 26, 10 38" fill="none" stroke="#111" stroke-width="3.5"/>
      <circle cx="11" cy="12" r="3.5" fill="#111"/>
      <circle cx="27" cy="10" r="2.5" fill="#111"/>
      <circle cx="27" cy="22" r="2.5" fill="#111"/>
    </g>`;
  }
  return `<g transform="translate(25, 28) scale(0.125)">
    <path d="M 14 185 C 35 185 54 167 54 140 C 54 110 30 90 4 90 C -25 90 -45 112 -45 145 C -45 185 -10 220 30 220 C 75 220 105 180 105 125 C 105 50 40 -15 15 -75 C 5 -100 15 -130 35 -130 C 45 -130 55 -115 50 -90 C 40 -40 0 50 -5 120 L -5 270 C -5 295 -25 315 -50 315 C -65 315 -80 300 -80 285 C -80 270 -65 255 -50 255 C -40 255 -30 265 -25 275" fill="none" stroke="#111" stroke-width="9.5"/>
  </g>`;
}

function renderNoteGraphic(x, y, acc, shiftNoteHead = false) {
  let svg = '';
  let noteX = shiftNoteHead ? (x + 11) : x;

  if (y <= 11) { for (let ly = 19; ly >= y; ly -= 8) svg += `<line x1="${noteX-9}" y1="${ly}" x2="${noteX+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
  if (y >= 59) { for (let ly = 51; ly <= y; ly += 8) svg += `<line x1="${noteX-9}" y1="${ly}" x2="${noteX+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }

  if (acc !== 0) {
    let symbol = accToSymbol(acc);
    // הצבת סימן ההתק משמאל בצורה מרווחת וברורה (מוסט 14 פיקסלים משמאל לצליל)
    let xOffset = shiftNoteHead ? (x - 24) : (x - 14);
    svg += `<text x="${xOffset}" y="${y + 6}" font-size="20" font-weight="bold" fill="#111">${symbol}</text>`;
  }

  svg += `<ellipse cx="${noteX}" cy="${y}" rx="5.5" ry="4" fill="#111" transform="rotate(-20 ${noteX} ${y})"/>`;
  return svg;
}

function renderKeySignature(startX, clef, accType, count) {
  let svg = '';
  let sharpsSol = [8, 5, 9, 6, 3, 7, 4];
  let flatsSol = [4, 7, 3, 6, 2, 5, 1];
  let sharpsFa = [6, 3, 7, 4, 1, 5, 2];
  let flatsFa = [2, 5, 1, 4, 0, 3, -1];

  let lineOffsets = (accType === 1) ? (clef === 'sol' ? sharpsSol : sharpsFa) : (clef === 'sol' ? flatsSol : flatsFa);

  for (let i = 0; i < count; i++) {
    let lineIdx = lineOffsets[i];
    let y = 51 - lineIdx * 4;
    let x = startX + (i * 11);
    let symbol = (accType === 1) ? '♯' : '♭';
    svg += `<text x="${x}" y="${y + 6}" font-size="20" font-weight="bold" fill="#111">${symbol}</text>`;
  }
  return svg;
}

function generateSheet() {
  const studentContainer = document.getElementById('stavesContainer');
  const answersContainer = document.getElementById('answersStavesContainer');
  studentContainer.innerHTML = ''; answersContainer.innerHTML = '';

  const rows = document.querySelectorAll('.row-control');

  rows.forEach((row, idx) => {
    const id = row.id.split('_')[1];
    const type = document.getElementById(`type_${id}`).value;
    const skill = document.getElementById(`skill_${id}`).value;

    let clefsChecked = Array.from(document.querySelectorAll(`#clefs_${id} input:checked`)).map(cb => cb.value);
    let clef = clefsChecked.length > 0 ? clefsChecked[Math.floor(Math.random() * clefsChecked.length)] : 'sol';

    let selectedTypes = Array.from(document.querySelectorAll(`#${type}_${id} input:checked`)).map(cb => cb.value);
    let pool = DEFINED_STRUCTURES[type].filter(s => selectedTypes.includes(s.name));
    if (pool.length === 0) pool = DEFINED_STRUCTURES[type];

    let categoryName = (type === 'intervals') ? 'המרווחים' : 
                       (type === 'chords' ? 'האקורדים המשולשים' : 
                       (type === 'septachords' ? 'הספטאקורדים (מרובעים)' : 'הסולמות'));
    
    let instructionPrefix = (skill === 'id') ? 'זהה/י את' : 'כתוב/י את';
    let fullInstructionTitle = `${idx + 1}. ${instructionPrefix} ${categoryName} הבאים:`;

    let studentSVG = `<svg class="staff-svg" viewBox="0 0 750 95">`;
    let answerSVG = `<svg class="staff-svg" viewBox="0 0 750 95">`;

    for (let l = 0; l < 5; l++) {
      let lineY = 51 - l * 8;
      let lineHTML = `<line x1="20" y1="${lineY}" x2="730" y2="${lineY}" stroke="#333" stroke-width="1"/>`;
      studentSVG += lineHTML; answerSVG += lineHTML;
    }
    let borders = `<line x1="20" y1="19" x2="20" y2="51" stroke="#333" stroke-width="2"/><line x1="730" y1="19" x2="730" y2="51" stroke="#333" stroke-width="2"/>`;
    studentSVG += borders; answerSVG += borders;

    let exercises = [];
    let usedInThisRow = new Set();

    let exerciseCount = (type === 'scales') ? 3 : 5;
    let measureWidth = (710 - 20) / exerciseCount;

    for (let i = 0; i < exerciseCount; i++) {
      let measureX = 20 + i * measureWidth;
      studentSVG += getClefSVG(clef); answerSVG += getClefSVG(clef);

      if (i > 0) {
        let bLine = `<line x1="${measureX}" y1="19" x2="${measureX}" y2="51" stroke="#333" stroke-width="1.2"/>`;
        studentSVG += bLine; answerSVG += bLine;
      }

      let available = pool.filter(p => !usedInThisRow.has(p.name));
      if (available.length === 0) available = pool;
      
      let chosenStruct = available[Math.floor(Math.random() * available.length)];
      usedInThisRow.add(chosenStruct.name);

      let baseLine = Math.floor(Math.random() * 3) + 1;

      if (chosenStruct.isKeySigOnly) {
        let accType = Math.random() > 0.5 ? 1 : -1;
        let count = Math.floor(Math.random() * 5) + 1;
        
        let sigGraphic = renderKeySignature(measureX + 45, clef, accType, count);
        studentSVG += sigGraphic; answerSVG += sigGraphic;

        let keyNamesSharp = ["סול מז׳ור", "רה מז׳ור", "לה מז׳ור", "מי מז׳ור", "סי מז׳ור"];
        let keyNamesFlat = ["פה מז׳ור", "סי♭ מז׳ור", "מי♭ מז׳ור", "לה♭ מז׳ור", "רה♭ מז׳ור"];
        let keySolution = (accType === 1) ? keyNamesSharp[count - 1] : keyNamesFlat[count - 1];

        exercises.push({ solutionText: keySolution, promptText: '________', readPitchesText: `${count} ${accType === 1 ? 'דיאזים' : 'במולים'}` });

      } else {
        let notesDrawn = chosenStruct.offsets.map((off, oIdx) => ({
          lineIndex: baseLine + off,
          acc: chosenStruct.accs[oIdx]
        }));

        let parsedNotes = notesDrawn.map(n => getNoteDetails(n.lineIndex, n.acc, clef));
        let readPitchesText = parsedNotes.map(n => n.name).join('-');

        let solutionText = "";
        if (type === 'chords') {
          solutionText = analyzeChord(parsedNotes, chosenStruct.name);
        } else if (type === 'scales') {
          solutionText = `סולם ${parsedNotes[0].name} ${chosenStruct.name}`;
          readPitchesText = `${parsedNotes[0].name} - ${parsedNotes[7].name}`;
        } else {
          solutionText = `${parsedNotes[0].name} - ${chosenStruct.name}`;
        }

        let promptText = (skill === 'write') ? `${chosenStruct.name}` : '________';

        exercises.push({ solutionText, promptText, readPitchesText });

        let noteX = measureX + (type === 'scales' ? 55 : 70);

        if (skill === 'write') {
          let startNoteX = (type === 'scales') ? (measureX + 45) : noteX;
          let baseGraphic = renderNoteGraphic(startNoteX, 51 - baseLine * 4, chosenStruct.accs[0], false);
          studentSVG += baseGraphic;

          if (type === 'scales') {
            notesDrawn.forEach((n, nIdx) => {
              // רווח מורחב בין הצלילים (26px) לקבלת מראה אוורירי וקריא
              let scaleX = measureX + 45 + (nIdx * 26);
              answerSVG += renderNoteGraphic(scaleX, 51 - n.lineIndex * 4, n.acc, false);
            });
          } else {
            notesDrawn.forEach((n, nIdx) => {
              let y = 51 - n.lineIndex * 4;
              let isSecond = (nIdx > 0 && Math.abs(n.lineIndex - notesDrawn[nIdx - 1].lineIndex) === 1);
              answerSVG += renderNoteGraphic(noteX, y, n.acc, isSecond);
            });
          }
        } else {
          if (type === 'scales') {
            notesDrawn.forEach((n, nIdx) => {
              // רווח מורחב בין הצלילים (26px) לקבלת מראה אוורירי וקריא
              let scaleX = measureX + 45 + (nIdx * 26);
              let y = 51 - n.lineIndex * 4;
              let g = renderNoteGraphic(scaleX, y, n.acc, false);
              studentSVG += g; answerSVG += g;
            });
          } else {
            notesDrawn.forEach((n, nIdx) => {
              let y = 51 - n.lineIndex * 4;
              let isSecond = (nIdx > 0 && Math.abs(n.lineIndex - notesDrawn[nIdx - 1].lineIndex) === 1);
              let g = renderNoteGraphic(noteX, y, n.acc, isSecond);
              studentSVG += g; answerSVG += g;
            });
          }
        }
      }
    }

    studentSVG += `</svg>`;
    answerSVG += `</svg>`;

    let cellWidth = (100 / exerciseCount).toFixed(2);
    let studentAnsHTML = `<div class="answer-row">${exercises.map(e => `<div class="answer-cell" style="width: ${cellWidth}%;">${e.promptText}</div>`).join('')}</div>`;
    let answerAnsHTML = `<div class="answer-row">${exercises.map(e => `
      <div class="answer-cell" style="width: ${cellWidth}%;">
        <div class="read-text">${e.readPitchesText}</div>
        <div class="solution-text">${e.solutionText}</div>
      </div>
    `).join('')}</div>`;

    const staffDiv = document.createElement('div');
    staffDiv.className = 'staff-system';
    staffDiv.innerHTML = `<div class="exercise-title">${fullInstructionTitle}:</div>${studentSVG}${studentAnsHTML}`;
    studentContainer.appendChild(staffDiv);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'staff-system';
    ansDiv.innerHTML = `<div class="exercise-title">${fullInstructionTitle} - פתרון מלא:</div>${answerSVG}${answerAnsHTML}`;
    answersContainer.appendChild(ansDiv);
  });
}

function toggleAnswersPage() {
  const ansSheet = document.getElementById('answersheet-a4');
  ansSheet.style.display = (ansSheet.style.display === 'none') ? 'block' : 'none';
}

async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  
  const canvas1 = await html2canvas(document.getElementById('worksheet-a4'), { scale: 2 });
  pdf.addImage(canvas1.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);

  const ansSheet = document.getElementById('answersheet-a4');
  const wasHidden = ansSheet.style.display === 'none';
  
  if (wasHidden) {
    ansSheet.style.display = 'block';
  }
  
  pdf.addPage();
  const canvas2 = await html2canvas(ansSheet, { scale: 2 });
  pdf.addImage(canvas2.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
  
  if (wasHidden) {
    ansSheet.style.display = 'none';
  }

  pdf.save('music_practice.pdf');
}

window.onload = () => { addRow(); generateSheet(); };
</script>
