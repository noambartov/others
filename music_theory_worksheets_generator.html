<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דפי תרגול להדפסה - תורת המוזיקה</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="תורת המוזיקה">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --text-color: #222222;
      --muted: #999999;
      --tile: #efefef;
      --tile-hover: #e4e4e4;
      --rule: #eeeeee;

      /* דף התרגול: שחור ואפורים, בלי צבע */
      --sheet-ink: #111111;
      --sheet-text: #333333;
      --sheet-muted: #aaaaaa;
      --sheet-accent: #222222;
      --sheet-band: #f6f6f6;
      --sheet-rule: #e6e6e6;
      --sheet-line: #cccccc;
    }

    body {
      font-family: 'Assistant', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0 16px 40px;
      color: var(--text-color);
      direction: rtl;
    }

    .app-container { max-width: 900px; margin: 0 auto; }
    .app-header { text-align: center; margin: 40px 0 28px; }
    .app-header h1 { font-weight: 300; font-size: 36px; color: #111111; margin: 0; }
    /* שלבי העבודה מתחת לכותרת, בניסוח שמתאים לכולם */
    .app-steps { list-style: none; counter-reset: step; display: flex; justify-content: center; gap: 28px; margin: 14px 0 0; padding: 0; color: #777777; font-size: 15px; }
    .app-steps li { counter-increment: step; display: flex; align-items: baseline; gap: 6px; }
    .app-steps li::before { content: counter(step); color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) {
      .app-steps { flex-direction: column; align-items: flex-start; gap: 6px; text-align: right; max-width: 340px; margin-inline: auto; }
    }

    .controls-panel { border-top: 1px solid var(--rule); margin-bottom: 8px; }

    .row-control {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
      transition: background 0.2s;
    }
    .row-control.dragging { opacity: 0.4; background: #f7f7f7; }
    .row-control.drag-over { border-top: 1px solid #222222; }

    .drag-handle {
      cursor: grab;
      font-size: 18px;
      color: #cccccc;
      padding: 0 4px;
      user-select: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .row-label { font-weight: 400; color: var(--muted); font-size: 14px; white-space: nowrap; min-width: 56px; padding-bottom: 9px; }
    .drag-handle { padding-bottom: 6px; }

    /* כותרת קטנה מעל כל תפריט בשורה */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 12px; color: var(--muted); }

    select, .custom-select-btn {
      padding: 8px 12px;
      border: 1px solid var(--tile);
      border-radius: 6px;
      background-color: var(--tile);
      font: inherit;
      font-size: 14px;
      color: var(--text-color);
      outline: none;
      cursor: pointer;
    }
    select:hover, .custom-select-btn:hover { background-color: var(--tile-hover); }

    .multi-select-container { position: relative; }
    .multi-select-btn {
      text-align: right; cursor: pointer;
      box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .multi-select-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      width: 240px; background: #fff; border: 1px solid #e6e6e6;
      border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 8px 12px;
    }
    .multi-select-dropdown.show { display: block; }
    .multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
    .select-all-btn { font-size: 12px; color: #777777; cursor: pointer; margin-bottom: 6px; display: inline-block; }
    .select-all-btn:hover { color: #222222; }

    .scale-controls-wrapper { display: flex; gap: 8px; align-items: center; }

    .btn-remove {
      background: none;
      color: #bbbbbb;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 18px;
      margin-right: auto;
      padding-bottom: 8px;
      flex-shrink: 0;
    }
    .btn-remove:hover { color: #222222; }
    @media (max-width: 600px) {
      .row-control { position: relative; padding-left: 28px; }
      .btn-remove { position: absolute; left: 0; top: 10px; }
    }
    .btn-add-row { background: none; color: #777777; border: none; padding: 10px 0; font: inherit; font-size: 14px; cursor: pointer; }
    .btn-add-row:hover { color: #222222; }

    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
    .btn { padding: 11px 22px; font: inherit; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-generate { background: #555555; color: #ffffff; }
    .btn-generate:hover { background: #444444; }
    .btn-answers, .btn-pdf { background: var(--tile); color: var(--text-color); }
    .btn-answers:hover, .btn-pdf:hover { background: var(--tile-hover); }

    .a4-page-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 36px; }
    /* בטלפון התצוגה המקדימה מוקטנת לרוחב המסך (fitSheets); ה-PDF תמיד בגודל מלא */
    .a4-page-container.fit { zoom: var(--fit, 1); }

    .worksheet-a4 {
      width: 210mm; min-height: 297mm; padding: 0 15mm 12mm 15mm;
      background: white; border: 1px solid #e6e6e6; box-sizing: border-box; direction: rtl;
      display: flex; flex-direction: column; justify-content: space-between;
      font-family: 'Assistant', 'Segoe UI', sans-serif; color: var(--sheet-text);
    }
    .sheet-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--sheet-band); margin: 0 -15mm 9mm; padding: 13mm 15mm 7mm;
    }
    .sheet-eyebrow { font-size: 11px; font-weight: 400; color: var(--sheet-muted); letter-spacing: 1px; margin-bottom: 2px; }
    .sheet-title { font-size: 24px; font-weight: 400; color: var(--sheet-ink); line-height: 1.1; }
    .sheet-fields { display: flex; gap: 12px; font-size: 12px; color: var(--sheet-text); }
    .sheet-fields > div { background: #fff; border: 1px solid var(--sheet-rule); border-radius: 8px; padding: 6px 10px; }
    .field-line { display: inline-block; width: 110px; }
    .field-line.short { width: 70px; }

    .sheet-footer {
      font-size: 10px;
      color: var(--sheet-muted);
      text-align: center;
      padding-top: 8px;
      margin-top: auto;
      direction: rtl;
    }

    .staff-system { margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--sheet-band); page-break-inside: avoid; }
    .exercise-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 400; margin-bottom: 6px; color: var(--sheet-ink); direction: rtl; }
    .exercise-num {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid #c8c8c8; color: var(--sheet-text); font-size: 12px; font-weight: 400; box-sizing: border-box;
    }

    .staff-svg { width: 100%; height: auto; display: block; }
    
    .answer-row { 
      display: flex; 
      flex-direction: row; 
      justify-content: space-around; 
      font-size: 12px; 
      color: var(--sheet-text); 
      margin-top: 4px; 
      direction: ltr; 
    }
    .answer-cell { text-align: center; font-weight: 400; direction: rtl; }
    .answer-line { display: inline-block; width: 70%; height: 16px; border-bottom: 1.5px solid var(--sheet-line); }
    .solution-text { color: var(--sheet-accent); font-size: 12px; font-weight: 600; line-height: 1.25; }
    .read-text { color: var(--sheet-text); font-size: 11px; margin-bottom: 2px; }
  </style>
</head>
<body data-section="print">

<div class="app-container">
  <div class="app-header">
    <h1>דפי תרגול להדפסה</h1>
    <ol class="app-steps">
      <li>מוסיפים חמשות ובוחרים תרגיל לכל אחת</li>
      <li>לוחצים על "דף תשובות" כדי לקבל מחוון</li>
      <li>מורידים PDF ומדפיסים</li>
    </ol>
  </div>

  <div class="controls-panel">
    <div id="rowsContainer"></div>
    <button class="btn-add-row" onclick="addRow()">+ הוספת חמשה</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateSheet()">צור תרגילים</button>
    <button class="btn btn-answers" onclick="toggleAnswersPage()">דף תשובות</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">הורדת PDF</button>
  </div>

  <div class="a4-page-container fit">
    <div id="worksheet-a4" class="worksheet-a4">
      <div>
        <div class="sheet-header">
          <div>
            <div class="sheet-eyebrow">דף תרגול</div>
            <div class="sheet-title">תרגול תורת המוזיקה</div>
          </div>
          <div class="sheet-fields">
            <div>שם: <span class="field-line"></span></div>
            <div>תאריך: <span class="field-line short"></span></div>
          </div>
        </div>
        <div id="stavesContainer"></div>
      </div>
      <div class="sheet-footer">
        © נוצר על ידי נעם ברטוב · noambt@gmail.com
      </div>
    </div>

    <div id="answersheet-a4" class="worksheet-a4" style="display: none;">
      <div>
        <div class="sheet-header">
          <div>
            <div class="sheet-eyebrow">דף תשובות</div>
            <div class="sheet-title">פתרונות מלאים</div>
          </div>
          <div class="sheet-fields">
            <div>מורה/בודק: <span class="field-line"></span></div>
          </div>
        </div>
        <div id="answersStavesContainer"></div>
      </div>
      <div class="sheet-footer">
        © נוצר על ידי נעם ברטוב · noambt@gmail.com
      </div>
    </div>
  </div>
</div>

<script src="theory-core.js"></script>
<script>
const T = window.TheoryCore;
const STAFF = { bottomY: 51, space: 8 };
const INK = '#111';
const STAFF_INK = '#aaaaaa';

const INVERSION_NAMES_TRIADS = ['יסודי', 'היפוך ראשון', 'היפוך שני'];
const INVERSION_NAMES_SEPTS  = ['יסודי', 'היפוך ראשון', 'היפוך שני', 'היפוך שלישי'];

function generateAllStructures() {
  const withInversions = (list, invNames) => list.flatMap(c => invNames.map((invName, inv) => ({
    name: `${c.name} ${invName}`,
    baseStruct: c,
    inversion: inv
  })));

  return {
    intervals: T.CATALOG.intervals,
    chords: withInversions(T.CATALOG.chords, INVERSION_NAMES_TRIADS),
    septachords: withInversions(T.CATALOG.septachords, INVERSION_NAMES_SEPTS),
    scales: T.CATALOG.scales.map(s => ({ name: s.name, type: 'full', struct: s }))
      .concat([{ name: 'לפי סימני היתק בלבד', type: 'key_signature' }])
  };
}

const DEFINED_STRUCTURES = generateAllStructures();

function buildNotesForStructure(givenLine, givenAcc, item, clef, givenVoice = 'bass') {
  if (item.baseStruct) {
    return T.build(item.baseStruct, { line: givenLine, acc: givenAcc, clef, inversion: item.inversion, given: givenVoice });
  }
  return T.build(item, { line: givenLine, acc: givenAcc, clef, given: givenVoice });
}

let rowCounter = 0;
let draggedRow = null;

const CLEFS_LIST = [{ val: 'sol', label: 'מפתח סול' }, { val: 'fa', label: 'מפתח פה' }];
const INTERVALS_LIST = DEFINED_STRUCTURES.intervals.map(s => s.name);
const CHORDS_LIST = DEFINED_STRUCTURES.chords.map(s => s.name);
const SEPTACHORDS_LIST = DEFINED_STRUCTURES.septachords.map(s => s.name);

window.addEventListener('click', function(e) {
  if (!e.target.closest('.multi-select-container')) {
    document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
      el.classList.remove('show');
    });
  }
});

function addRow() {
  rowCounter++;
  const id = rowCounter;
  const container = document.getElementById('rowsContainer');
  const row = document.createElement('div');
  row.className = 'row-control';
  row.id = `row_${id}`;
  row.draggable = true;

  row.innerHTML = `
    <div class="drag-handle" title="גוררים כדי לשנות את סדר החמשות">⋮⋮</div>
    <div class="row-label">חמשה <span class="row-num"></span></div>
    <div class="field">
      <span class="field-label">מפתח</span>
      <div class="multi-select-container">
        <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, 'clefs_${id}')">סול, פה</div>
        <div class="multi-select-dropdown" id="clefs_${id}">
          <span class="select-all-btn" onclick="toggleAll('clefs_${id}')">סמן הכל / הסר הכל</span>
          ${CLEFS_LIST.map(c => `<label><input type="checkbox" value="${c.val}" checked> ${c.label}</label>`).join('')}
        </div>
      </div>
    </div>
    <div class="field">
      <span class="field-label">משימה</span>
      <select id="skill_${id}" onchange="onSkillOrTypeChange(${id})">
        <option value="id">זיהוי</option>
        <option value="write">כתיבה</option>
      </select>
    </div>
    <div class="field">
      <span class="field-label">נושא</span>
      <select id="type_${id}" onchange="onSkillOrTypeChange(${id})">
        <option value="intervals" selected>מרווחים</option>
        <option value="chords">אקורדים משולשים</option>
        <option value="septachords">ספטאקורדים</option>
        <option value="scales">סולמות</option>
      </select>
    </div>
    <div class="field" id="given_voice_field_${id}" style="display:none;">
      <span class="field-label">צליל נתון</span>
      <select id="given_voice_${id}">
        <option value="bass" selected>צליל בס</option>
        <option value="soprano">צליל סופרן</option>
      </select>
    </div>
    <div id="sub_container_${id}"></div>
    <button class="btn-remove" title="הסרת החמשה" onclick="removeRow(${id})">×</button>
  `;

  row.addEventListener('dragstart', (e) => {
    draggedRow = row;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  row.addEventListener('dragend', () => {
    draggedRow = null;
    row.classList.remove('dragging');
    document.querySelectorAll('.row-control').forEach(r => r.classList.remove('drag-over'));
    updateRowNumbers();
  });

  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (row !== draggedRow) {
      row.classList.add('drag-over');
    }
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drag-over');
  });

  row.addEventListener('drop', (e) => {
    e.preventDefault();
    row.classList.remove('drag-over');
    if (draggedRow && draggedRow !== row) {
      const container = document.getElementById('rowsContainer');
      const rows = Array.from(container.children);
      const draggedIdx = rows.indexOf(draggedRow);
      const targetIdx = rows.indexOf(row);

      if (draggedIdx < targetIdx) {
        container.insertBefore(draggedRow, row.nextSibling);
      } else {
        container.insertBefore(draggedRow, row);
      }
      updateRowNumbers();
    }
  });

  container.appendChild(row);
  onSkillOrTypeChange(id);
  updateRowNumbers();
}

function removeRow(id) {
  document.getElementById(`row_${id}`)?.remove();
  updateRowNumbers();
}

function updateRowNumbers() {
  document.querySelectorAll('.row-control').forEach((r, idx) => {
    r.querySelector('.row-num').innerText = idx + 1;
  });
}

function onSkillOrTypeChange(i) {
  const type = document.getElementById(`type_${i}`).value;
  const skill = document.getElementById(`skill_${i}`).value;
  const voiceField = document.getElementById(`given_voice_field_${i}`);
  const container = document.getElementById(`sub_container_${i}`);

  if (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) {
    voiceField.style.display = '';
  } else {
    voiceField.style.display = 'none';
  }
  
  if (type === 'scales') {
    let scalesList = DEFINED_STRUCTURES.scales.map(s => s.name);
    if (skill === 'id') {
      scalesList = scalesList.filter(s => s !== 'מינור הרמוני' && s !== 'מינור מלודי');
    }

    container.innerHTML = `
      <div class="scale-controls-wrapper">
        <div class="field">
          <span class="field-label">אילו סולמות</span>
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, '${type}_${i}')">הכל</div>
            <div class="multi-select-dropdown" id="${type}_${i}">
              <span class="select-all-btn" onclick="toggleAll('${type}_${i}')">סמן הכל / הסר הכל</span>
              ${scalesList.map(item => `<label><input type="checkbox" value="${item}" checked> ${item}</label>`).join('')}
            </div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">סימני היתק</span>
          <select id="max_acc_${i}">
            <option value="6" selected>עד 6 היתקים</option>
            <option value="0">0 היתקים</option>
            <option value="1">עד 1 היתק</option>
            <option value="2">עד 2 היתקים</option>
            <option value="3">עד 3 היתקים</option>
            <option value="4">עד 4 היתקים</option>
            <option value="5">עד 5 היתקים</option>
          </select>
        </div>
      </div>`;
  } else {
    let itemsList = (type === 'intervals') ? INTERVALS_LIST : 
                    (type === 'chords' ? CHORDS_LIST : SEPTACHORDS_LIST);

    const what = { intervals: 'אילו מרווחים', chords: 'אילו אקורדים', septachords: 'אילו ספטאקורדים' }[type];
    container.innerHTML = `
      <div class="field">
        <span class="field-label">${what}</span>
        <div class="multi-select-container">
          <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, '${type}_${i}')">הכל</div>
          <div class="multi-select-dropdown" id="${type}_${i}">
            <span class="select-all-btn" onclick="toggleAll('${type}_${i}')">סמן הכל / הסר הכל</span>
            ${itemsList.map(item => `<label><input type="checkbox" value="${item}" checked> ${item}</label>`).join('')}
          </div>
        </div>
      </div>`;
  }
}

function toggleDropdown(e, id) {
  e.stopPropagation();
  const target = document.getElementById(id);
  const wasShown = target.classList.contains('show');
  
  document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
    el.classList.remove('show');
  });

  if (!wasShown) {
    target.classList.add('show');
  }
}

function toggleAll(dropdownId) {
  const checkboxes = document.querySelectorAll(`#${dropdownId} input[type="checkbox"]`);
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
  updateSelectSummary(dropdownId);
}

// הכפתור של בחירה מרובה מראה מה נבחר: "הכל", שמות (עד שניים) או מספר
function updateSelectSummary(dropdownId) {
  const dropdown = document.getElementById(dropdownId);
  const boxes = Array.from(dropdown.querySelectorAll('input[type="checkbox"]'));
  const chosen = boxes.filter(cb => cb.checked).map(cb => cb.parentElement.textContent.trim().replace(/^מפתח /, ''));
  let text;
  if (dropdownId.startsWith('clefs_')) text = chosen.length ? chosen.join(', ') : 'לא נבחר';
  else if (chosen.length === boxes.length) text = 'הכל';
  else if (chosen.length === 0) text = 'לא נבחר';
  else if (chosen.length <= 2) text = chosen.join(', ');
  else text = `${chosen.length} נבחרו`;
  dropdown.previousElementSibling.textContent = text;
}

document.addEventListener('change', e => {
  const dropdown = e.target.closest('.multi-select-dropdown');
  if (dropdown) updateSelectSummary(dropdown.id);
});

function getClefSVG(clef) {
  return T.svg.clef(clef, 35, STAFF, INK);
}

// accColumn: עמודת סימן ההיתק משמאל לתו (0 = הכי קרובה), לפי T.chordLayout
function renderNoteGraphic(x, absLine, acc, shiftNoteHead = false, accColumn = 0) {
  let noteX = shiftNoteHead ? (x + 10) : x;
  let y = T.svg.lineY(STAFF, absLine);
  let svg = T.svg.ledgerLines(noteX, absLine, STAFF, 9, INK);

  if (acc !== 0) {
    svg += T.svg.accidental(acc, x - 7 - (accColumn || 0) * 11, y, STAFF.space, INK);
  }

  svg += T.svg.notehead(noteX, y, STAFF.space, INK);
  return svg;
}

// כל הצלילים של תרגיל אחד: סולם בשורה, או אקורד/מרווח בעמודה אחת
function renderNotes(notes, x, isScale) {
  if (isScale) {
    return notes.map((n, i) => renderNoteGraphic(x + i * 26, n.absLine, n.acc)).join('');
  }
  const layout = T.chordLayout(notes);
  return notes.map((n, i) => renderNoteGraphic(x, n.absLine, n.acc, layout[i].shifted, layout[i].accColumn)).join('');
}

function renderKeyAccidental(measureX, idx, accType, clef) {
  let lineOffset = T.keySignatureLines(clef, accType, 7)[idx];
  let y = T.svg.lineY(STAFF, lineOffset);
  let x = measureX + 45 + (idx * 11);
  return T.svg.accidental(accType, x + 4, y, STAFF.space, INK);
}

function generateSheet() {
  const studentContainer = document.getElementById('stavesContainer');
  const answersContainer = document.getElementById('answersStavesContainer');
  studentContainer.innerHTML = ''; answersContainer.innerHTML = '';

  const rows = document.querySelectorAll('.row-control');

  rows.forEach((row, idx) => {
    const id = row.id.split('_')[1];
    const type = document.getElementById(`type_${id}`).value;
    const skill = document.getElementById(`skill_${id}`).value;
    const givenVoice = document.getElementById(`given_voice_${id}`)?.value || 'bass';

    let clefsChecked = Array.from(document.querySelectorAll(`#clefs_${id} input:checked`)).map(cb => cb.value);
    let clef = clefsChecked.length > 0 ? clefsChecked[Math.floor(Math.random() * clefsChecked.length)] : 'sol';

    let selectedTypes = Array.from(document.querySelectorAll(`#${type}_${id} input:checked`)).map(cb => cb.value);
    let pool = DEFINED_STRUCTURES[type].filter(s => selectedTypes.includes(s.name));
    if (pool.length === 0) pool = DEFINED_STRUCTURES[type];

    let categoryName = (type === 'intervals') ? 'המרווחים' : 
                       (type === 'chords' ? 'האקורדים המשולשים' : 
                       (type === 'septachords' ? 'הספטאקורדים' : 'הסולמות'));
    
    let instructionPrefix = (skill === 'id') ? 'זהה/י את' : 'כתוב/י את';
    let voiceNoteStr = (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) ? `, מצליל ה${givenVoice === 'bass' ? 'בס' : 'סופרן'}` : '';
    let exerciseNum = `<span class="exercise-num">${idx + 1}</span>`;
    let fullInstructionTitle = `${instructionPrefix} ${categoryName} הבאים${voiceNoteStr}`;

    let studentSVG = `<svg class="staff-svg" viewBox="0 0 750 75">`;
    let answerSVG = `<svg class="staff-svg" viewBox="0 0 750 75">`;

    for (let l = 0; l < 5; l++) {
      let lineY = 51 - l * 8;
      let lineHTML = `<line x1="20" y1="${lineY}" x2="730" y2="${lineY}" stroke="${STAFF_INK}" stroke-width="0.9"/>`;
      studentSVG += lineHTML; answerSVG += lineHTML;
    }
    let borders = `<line x1="20" y1="19" x2="20" y2="51" stroke="${STAFF_INK}" stroke-width="1.2"/><line x1="730" y1="19" x2="730" y2="51" stroke="${STAFF_INK}" stroke-width="2"/>`;
    studentSVG += borders; answerSVG += borders;

    studentSVG += getClefSVG(clef); answerSVG += getClefSVG(clef);

    let exercises = [];
    let usedInThisRow = new Set();
    let exerciseCount = (type === 'scales') ? 3 : 5;
    let measureWidth = (710 - 20) / exerciseCount;

    for (let i = 0; i < exerciseCount; i++) {
      let measureX = 20 + i * measureWidth;
      if (i > 0) {
        let doubleBarLine = `
          <line x1="${measureX - 3}" y1="19" x2="${measureX - 3}" y2="51" stroke="${STAFF_INK}" stroke-width="0.9"/>
          <line x1="${measureX}" y1="19" x2="${measureX}" y2="51" stroke="${STAFF_INK}" stroke-width="1.6"/>
        `;
        studentSVG += doubleBarLine; answerSVG += doubleBarLine;
      }

      let available = pool.filter(p => !usedInThisRow.has(p.name));
      if (available.length === 0) available = pool;
      let chosenStruct = available[Math.floor(Math.random() * available.length)];

      if (chosenStruct.type === 'key_signature') {
        let maxAccLimit = parseInt(document.getElementById(`max_acc_${id}`)?.value || '6', 10);
        let availableKeySigs = T.KEYS.filter(k => k.accCount <= maxAccLimit && !usedInThisRow.has(k.name));
        if (availableKeySigs.length === 0) {
          availableKeySigs = T.KEYS.filter(k => k.accCount <= maxAccLimit);
        }
        if (availableKeySigs.length === 0) availableKeySigs = T.KEYS;
        
        let keySig = availableKeySigs[Math.floor(Math.random() * availableKeySigs.length)];
        usedInThisRow.add(keySig.name);

        for (let k = 0; k < keySig.accCount; k++) {
          let accSvg = renderKeyAccidental(measureX, k, keySig.accType, clef);
          if (skill !== 'write') studentSVG += accSvg;
          answerSVG += accSvg;
        }

        let solutionText = keySig.name;
        let promptText = (skill === 'write') ? keySig.name : '';
        exercises.push({ solutionText, promptText, readPitchesText: 'סימני מפתח' });
      } else {
        let chordData = null;
        let baseLine, baseAcc;

        if (type === 'scales') {
          let maxAccLimit = parseInt(document.getElementById(`max_acc_${id}`)?.value || '6', 10);
          const isMajor = chosenStruct.struct.id === 'major';
          const scaleKey = k => `${k.name}_${chosenStruct.name}`;
          let keys = T.KEYS.filter(k => k.accCount <= maxAccLimit && !usedInThisRow.has(scaleKey(k)));
          if (keys.length === 0) keys = T.KEYS.filter(k => k.accCount <= maxAccLimit);

          let chosenKey = keys[Math.floor(Math.random() * keys.length)];
          usedInThisRow.add(scaleKey(chosenKey));

          const [rootLetter, rootAcc] = isMajor ? chosenKey.major : chosenKey.minor;
          baseLine = T.lineForLetter(rootLetter, clef, -2);
          baseAcc = rootAcc;
          chordData = T.build(chosenStruct.struct, { line: baseLine, acc: baseAcc, clef });
          chordData.notes = chordData.notes.slice(0, 7);
        } else {
          usedInThisRow.add(chosenStruct.name);
          let attempts = 0;
          while (attempts < 500) {
            if (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) {
              if (givenVoice === 'bass') {
                baseLine = Math.floor(Math.random() * 3) - 2; 
              } else {
                baseLine = Math.floor(Math.random() * 4) + 3; // 3, 4, 5, 6
              }
            } else {
              baseLine = Math.floor(Math.random() * 5) - 1; 
            }

            baseAcc = (Math.random() < 0.2) ? (Math.random() < 0.5 ? -1 : 1) : 0; 
            chordData = buildNotesForStructure(baseLine, baseAcc, chosenStruct, clef, (type === 'chords' || type === 'septachords' || type === 'intervals') ? givenVoice : 'bass');
            
            let maxAbsLine = Math.max(...chordData.notes.map(n => n.absLine));
            let minAbsLine = Math.min(...chordData.notes.map(n => n.absLine));
            
            let isSopranoValid = (skill === 'write' && givenVoice === 'soprano') ? (maxAbsLine >= 3) : true;

            if (isSopranoValid && maxAbsLine <= 6 && minAbsLine >= -3 && chordData.notes.every(n => Math.abs(n.acc) <= 1)) {
              break;
            }
            attempts++;
          }
        }

        let parsedNotes = chordData.notes;
        let rootNoteName = chordData.root.name;
        let readPitchesText = parsedNotes.map(n => n.name).join('-');

        let solutionText = (type === 'scales') ? `סולם ${parsedNotes[0].name} ${chosenStruct.name}` :
                           (type === 'intervals') ? `${chosenStruct.name}` :
                           `${rootNoteName} ${chosenStruct.name}`;

        let promptText = (skill === 'write') ? (type === 'scales' ? `סולם ${parsedNotes[0].name} ${chosenStruct.name}` : `${chosenStruct.name}`) : '';
        exercises.push({ solutionText, promptText, readPitchesText });

        let noteX = measureX + (type === 'scales' ? 55 : 70);

        if (skill === 'write') {
          let givenNoteIdx = (givenVoice === 'soprano' && (type === 'chords' || type === 'septachords' || type === 'intervals')) ? (parsedNotes.length - 1) : 0;
          let givenNote = parsedNotes[givenNoteIdx];

          if (type === 'scales') {
            let baseGraphic = renderNoteGraphic(measureX + 45, parsedNotes[0].absLine, parsedNotes[0].acc, false);
            studentSVG += baseGraphic;
          } else {
            let g = renderNoteGraphic(noteX, givenNote.absLine, givenNote.acc, false);
            studentSVG += g;
          }

          answerSVG += renderNotes(parsedNotes, type === 'scales' ? measureX + 45 : noteX, type === 'scales');
        } else {
          let g = renderNotes(parsedNotes, type === 'scales' ? measureX + 45 : noteX, type === 'scales');
          studentSVG += g; answerSVG += g;
        }
      }
    }

    studentSVG += `</svg>`;
    answerSVG += `</svg>`;

    let cellWidth = (100 / exerciseCount).toFixed(2);
    let studentAnsHTML = `<div class="answer-row">${exercises.map(e => `<div class="answer-cell" style="width: ${cellWidth}%;">${e.promptText || '<span class="answer-line"></span>'}</div>`).join('')}</div>`;
    let answerAnsHTML = `<div class="answer-row">${exercises.map(e => `
      <div class="answer-cell" style="width: ${cellWidth}%;">
        <div class="read-text">${e.readPitchesText}</div>
        <div class="solution-text">${e.solutionText}</div>
      </div>
    `).join('')}</div>`;

    const staffDiv = document.createElement('div');
    staffDiv.className = 'staff-system';
    staffDiv.innerHTML = `<div class="exercise-title">${exerciseNum}<span dir="rtl">${fullInstructionTitle}:</span></div>${studentSVG}${studentAnsHTML}`;
    studentContainer.appendChild(staffDiv);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'staff-system';
    ansDiv.innerHTML = `<div class="exercise-title">${exerciseNum}<span dir="rtl">${fullInstructionTitle}:</span></div>${answerSVG}${answerAnsHTML}`;
    answersContainer.appendChild(ansDiv);
  });
}

function toggleAnswersPage() {
  const ansSheet = document.getElementById('answersheet-a4');
  ansSheet.style.display = (ansSheet.style.display === 'none') ? 'flex' : 'none';
}

async function downloadPDF() {
  await document.fonts.ready;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  
  const pages = document.querySelector('.a4-page-container');
  pages.classList.remove('fit');

  const canvas1 = await html2canvas(document.getElementById('worksheet-a4'), { scale: 2 });
  pdf.addImage(canvas1.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);

  const ansSheet = document.getElementById('answersheet-a4');
  const wasHidden = ansSheet.style.display === 'none';
  
  if (wasHidden) {
    ansSheet.style.display = 'flex';
  }
  
  pdf.addPage();
  const canvas2 = await html2canvas(ansSheet, { scale: 2 });
  pdf.addImage(canvas2.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
  
  if (wasHidden) {
    ansSheet.style.display = 'none';
  }

  pages.classList.add('fit');
  pdf.save('דפי_תרגול.pdf');
}

// מקטין את התצוגה המקדימה של דף ה-A4 כשהמסך צר ממנו
function fitSheets() {
  const pages = document.querySelector('.a4-page-container');
  const sheetWidth = document.getElementById('worksheet-a4').offsetWidth;
  pages.style.setProperty('--fit', Math.min(1, pages.parentElement.clientWidth / sheetWidth));
}
window.addEventListener('resize', fitSheets);

window.onload = () => { addRow(); generateSheet(); fitSheets(); };
</script>
