<script>
const NOTE_NAMES_HE = ["דו", "רה", "מי", "פה", "סול", "לה", "סי"];
const DIATONIC_SEMITONES = [0, 2, 4, 5, 7, 9, 11];

function accToSymbol(acc) {
  if (acc === 1) return "♯";
  if (acc === -1) return "♭";
  return "";
}

function accToString(acc) {
  if (acc === 1) return "♯";
  if (acc === -1) return "♭";
  return "";
}

function getNoteDetails(absLine, acc, clef) {
  let baseIndex = (clef === 'sol') ? 2 : 4; 
  let diatonicIdx = baseIndex + absLine;
  
  let nameIndex = diatonicIdx % 7;
  while (nameIndex < 0) nameIndex += 7;
  
  let octave = Math.floor(diatonicIdx / 7);
  let semitones = octave * 12 + DIATONIC_SEMITONES[nameIndex] + acc;
  
  let strAcc = accToString(acc);
  let fullName = NOTE_NAMES_HE[nameIndex] + (strAcc ? strAcc : "");
  
  return { name: fullName, diatonicIdx, semitones, nameIndex, acc, absLine };
}

const INVERSION_NAMES_TRIADS = ['יסודי', 'היפוך ראשון', 'היפוך שני'];
const INVERSION_NAMES_SEPTS  = ['יסודי', 'היפוך ראשון', 'היפוך שני', 'היפוך שלישי'];

function generateAllStructures() {
  let chords = [];
  BASE_STRUCTURES.chords.forEach(c => {
    for (let inv = 0; inv < 3; inv++) {
      chords.push({
        name: `${c.baseName} ${INVERSION_NAMES_TRIADS[inv]}`,
        baseStruct: c,
        inversion: inv,
        isSept: false
      });
    }
  });

  let septachords = [];
  BASE_STRUCTURES.septachords.forEach(s => {
    for (let inv = 0; inv < 4; inv++) {
      septachords.push({
        name: `${s.baseName} ${INVERSION_NAMES_SEPTS[inv]}`,
        baseStruct: s,
        inversion: inv,
        isSept: true
      });
    }
  });

  return {
    intervals: BASE_STRUCTURES.intervals,
    chords: chords,
    septachords: septachords,
    scales: BASE_STRUCTURES.scales
  };
}

  { type: 'מינור טבעי', name: 'סול', line: 4, acc: 0, accCount: 2 },

];

function buildChordNotes(givenLine, givenAcc, chordItem, clef, givenVoice = 'bass') {
  let baseStruct = chordItem.baseStruct;
  let inv = chordItem.inversion;
  let numNotes = baseStruct.stepOffsets.length;

  let targetOffsetIdx = (givenVoice === 'soprano') ? (numNotes - 1) : 0;
  let rotatedOffsets = [];
  let rotatedSemitones = [];

  for (let i = 0; i < numNotes; i++) {
    let origIdx = (i + inv) % numNotes;
    let stepOff = baseStruct.stepOffsets[origIdx];
    let semiOff = baseStruct.semitones[origIdx];
    if (origIdx < inv) {
      stepOff += 7;
      semiOff += 12;
    }
    rotatedOffsets.push(stepOff);
    rotatedSemitones.push(semiOff);
  }

  let givenStepOffset = rotatedOffsets[targetOffsetIdx];
  let givenSemiOffset = rotatedSemitones[targetOffsetIdx];

  let rootLine = givenLine - givenStepOffset;
  let givenDetails = getNoteDetails(givenLine, givenAcc, clef);
  let rootSemitones = givenDetails.semitones - givenSemiOffset;

  let notes = [];
  for (let i = 0; i < numNotes; i++) {
    let targetLine = rootLine + rotatedOffsets[i];
    let targetDiatonicIdx = ((clef === 'sol' ? 2 : 4) + targetLine);
    let nameIdx = targetDiatonicIdx % 7;
    while (nameIdx < 0) nameIndex += 7;
    
    let targetOctave = Math.floor(targetDiatonicIdx / 7);
    let naturalSemitones = targetOctave * 12 + DIATONIC_SEMITONES[nameIdx];
    let requiredSemitones = rootSemitones + rotatedSemitones[i];
    
    let requiredAcc = requiredSemitones - naturalSemitones;
    notes.push(getNoteDetails(targetLine, requiredAcc, clef));
  }

  let rootDetails = getNoteDetails(rootLine, notes[0].acc - (notes[0].semitones - rootSemitones), clef);
  return { rootName: rootDetails.name, notes: notes };
}

function buildNotesForStructure(givenLine, givenAcc, struct, clef, givenVoice = 'bass') {
  if (struct.baseStruct) {
    return buildChordNotes(givenLine, givenAcc, struct, clef, givenVoice);
  }

  let numNotes = struct.stepOffsets.length;
  let targetOffsetIdx = (givenVoice === 'soprano' && numNotes > 1) ? (numNotes - 1) : 0;

  let givenStepOffset = struct.stepOffsets[targetOffsetIdx];
  let givenSemiOffset = struct.semitones[targetOffsetIdx];

  let baseLine = givenLine - givenStepOffset;
  let givenDetails = getNoteDetails(givenLine, givenAcc, clef);
  let baseSemitones = givenDetails.semitones - givenSemiOffset;

  let notes = [];
  for (let i = 0; i < numNotes; i++) {
    let targetLine = baseLine + struct.stepOffsets[i];
    let targetDiatonicIdx = ((clef === 'sol' ? 2 : 4) + targetLine);
    let nameIdx = targetDiatonicIdx % 7;
    while (nameIdx < 0) nameIdx += 7;
    
    let targetOctave = Math.floor(targetDiatonicIdx / 7);
    let naturalSemitones = targetOctave * 12 + DIATONIC_SEMITONES[nameIdx];
    let requiredSemitones = baseSemitones + struct.semitones[i];
    
    let requiredAcc = requiredSemitones - naturalSemitones;
    notes.push(getNoteDetails(targetLine, requiredAcc, clef));
  }
  let baseDetails = getNoteDetails(baseLine, notes[0].acc, clef);
  return { rootName: baseDetails.name, notes: notes };
}

let rowCounter = 0;
let draggedRow = null;

const CLEFS_LIST = [{ val: 'sol', label: 'מפתח סול' }, { val: 'fa', label: 'מפתח פה' }];
const INTERVALS_LIST = DEFINED_STRUCTURES.intervals.map(s => s.name);
const CHORDS_LIST = DEFINED_STRUCTURES.chords.map(s => s.name);
const SEPTACHORDS_LIST = DEFINED_STRUCTURES.septachords.map(s => s.name);

window.addEventListener('click', function(e) {
  if (!e.target.closest('.multi-select-container')) {
    document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
      el.classList.remove('show');
    });
  }
});

function addRow() {
  rowCounter++;
  const id = rowCounter;
  const container = document.getElementById('rowsContainer');
  const row = document.createElement('div');
  row.className = 'row-control';
  row.id = `row_${id}`;
  row.draggable = true;

  row.innerHTML = `
    <div class="drag-handle" title="לחץ וגרור לשרירות סדר החמשות">⋮⋮</div>
    <div class="row-label">חמשה <span class="row-num"></span>:</div>
    <div class="multi-select-container">
      <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, 'clefs_${id}')">מפתחות</div>
      <div class="multi-select-dropdown" id="clefs_${id}">
        <span class="select-all-btn" onclick="toggleAll('clefs_${id}')">סמן הכל / הסר הכל</span>
        ${CLEFS_LIST.map(c => `<label><input type="checkbox" value="${c.val}" checked> ${c.label}</label>`).join('')}
      </div>
    </div>
    <select id="skill_${id}" onchange="onSkillOrTypeChange(${id})">
      <option value="id">זיהוי</option>
      <option value="write">כתיבה</option>
    </select>
    <select id="type_${id}" onchange="onSkillOrTypeChange(${id})">
      <option value="intervals" selected>מרווחים</option>
      <option value="chords">אקורדים משולשים</option>
      <option value="septachords">ספטאקורדים</option>
      <option value="scales">סולמות</option>
    </select>
    <select id="given_voice_${id}" title="צליל נתון לבנייה" style="display:none;">
      <option value="bass" selected>צליל בס</option>
      <option value="soprano">צליל סופרן</option>
    </select>
    <div id="sub_container_${id}"></div>
    <button class="btn-remove" onclick="removeRow(${id})">✕</button>
  `;

  row.addEventListener('dragstart', (e) => {
    draggedRow = row;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });

  row.addEventListener('dragend', () => {
    draggedRow = null;
    row.classList.remove('dragging');
    document.querySelectorAll('.row-control').forEach(r => r.classList.remove('drag-over'));
    updateRowNumbers();
  });

  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (row !== draggedRow) {
      row.classList.add('drag-over');
    }
  });

  row.addEventListener('dragleave', () => {
    row.classList.remove('drag-over');
  });

  row.addEventListener('drop', (e) => {
    e.preventDefault();
    row.classList.remove('drag-over');
    if (draggedRow && draggedRow !== row) {
      const container = document.getElementById('rowsContainer');
      const rows = Array.from(container.children);
      const draggedIdx = rows.indexOf(draggedRow);
      const targetIdx = rows.indexOf(row);

      if (draggedIdx < targetIdx) {
        container.insertBefore(draggedRow, row.nextSibling);
      } else {
        container.insertBefore(draggedRow, row);
      }
      updateRowNumbers();
    }
  });

  container.appendChild(row);
  onSkillOrTypeChange(id);
  updateRowNumbers();
}

function removeRow(id) {
  document.getElementById(`row_${id}`)?.remove();
  updateRowNumbers();
}

function updateRowNumbers() {
  document.querySelectorAll('.row-control').forEach((r, idx) => {
    r.querySelector('.row-num').innerText = idx + 1;
  });
}

function onSkillOrTypeChange(i) {
  const type = document.getElementById(`type_${i}`).value;
  const skill = document.getElementById(`skill_${i}`).value;
  const voiceSelect = document.getElementById(`given_voice_${i}`);
  const container = document.getElementById(`sub_container_${i}`);

  if (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) {
    voiceSelect.style.display = 'inline-block';
  } else {
    voiceSelect.style.display = 'none';
  }
  
  if (type === 'scales') {
    let scalesList = DEFINED_STRUCTURES.scales.map(s => s.name);
    if (skill === 'id') {
      scalesList = scalesList.filter(s => s !== 'מינור הרמוני' && s !== 'מינור מלודי');
    }

    container.innerHTML = `
      <div class="scale-controls-wrapper">
        <div class="multi-select-container">
          <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, '${type}_${i}')">סינון תרגילים</div>
          <div class="multi-select-dropdown" id="${type}_${i}">
            <span class="select-all-btn" onclick="toggleAll('${type}_${i}')">סמן הכל / הסר הכל</span>
            ${scalesList.map(item => `<label><input type="checkbox" value="${item}" checked> ${item}</label>`).join('')}
          </div>
        </div>
        <select id="max_acc_${i}" title="מקסימום סימני היתק בסולם">
          <option value="6" selected>עד 6 היתקים</option>
          <option value="0">0 היתקים</option>
          <option value="1">עד 1 היתק</option>
          <option value="2">עד 2 היתקים</option>
          <option value="3">עד 3 היתקים</option>
          <option value="4">עד 4 היתקים</option>
          <option value="5">עד 5 היתקים</option>
        </select>
      </div>`;
  } else {
    let itemsList = (type === 'intervals') ? INTERVALS_LIST : 
                    (type === 'chords' ? CHORDS_LIST : SEPTACHORDS_LIST);

    container.innerHTML = `
      <div class="multi-select-container">
        <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown(event, '${type}_${i}')">סינון תרגילים</div>
        <div class="multi-select-dropdown" id="${type}_${i}">
          <span class="select-all-btn" onclick="toggleAll('${type}_${i}')">סמן הכל / הסר הכל</span>
          ${itemsList.map(item => `<label><input type="checkbox" value="${item}" checked> ${item}</label>`).join('')}
        </div>
      </div>`;
  }
}

function toggleDropdown(e, id) {
  e.stopPropagation();
  const target = document.getElementById(id);
  const wasShown = target.classList.contains('show');
  
  document.querySelectorAll('.multi-select-dropdown.show').forEach(el => {
    el.classList.remove('show');
  });

  if (!wasShown) {
    target.classList.add('show');
  }
}

function toggleAll(dropdownId) {
  const checkboxes = document.querySelectorAll(`#${dropdownId} input[type="checkbox"]`);
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
}

function getClefSVG(clef) {
  if (clef === 'fa') {
    return `<use href="#clef-bass" x="35" y="27" />`;
  }
  return `<use href="#clef-treble" x="35" y="43" />`;
}

function renderNoteGraphic(x, y, acc, shiftNoteHead = false, accShiftLeft = false) {
  let svg = '';
  let noteX = shiftNoteHead ? (x + 11) : x;

  if (y <= 11) { for (let ly = 19; ly >= y; ly -= 8) svg += `<line x1="${noteX-9}" y1="${ly}" x2="${noteX+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
  if (y >= 59) { for (let ly = 51; ly <= y; ly += 8) svg += `<line x1="${noteX-9}" y1="${ly}" x2="${noteX+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }

  if (acc !== 0) {
    let symbol = accToSymbol(acc);
    let xOffset = shiftNoteHead ? (x - 24) : (x - 14);
    if (accShiftLeft) {
      xOffset -= 12;
    }
    svg += `<text x="${xOffset}" y="${y}" font-size="23" font-weight="bold" fill="#111" dominant-baseline="central" text-anchor="middle">${symbol}</text>`;
  }

  svg += `<ellipse cx="${noteX}" cy="${y}" rx="5.5" ry="4" fill="#111" transform="rotate(-20 ${noteX} ${y})"/>`;
  return svg;
}

function renderKeyAccidental(measureX, idx, accType, clef) {
  const sharpsSol = [8, 5, 9, 6, 3, 7, 4]; 
  const sharpsFa  = [6, 3, 7, 4, 8, 5, 2]; 

  const flatsSol  = [4, 7, 3, 6, 2, 5, 1]; 
  const flatsFa   = [2, 5, 1, 4, 0, 3, -1]; 

  let lineOffset;
  if (clef === 'sol') {
    lineOffset = (accType === 1) ? sharpsSol[idx] : flatsSol[idx];
  } else {
    lineOffset = (accType === 1) ? sharpsFa[idx] : flatsFa[idx];
  }

  let y = 51 - lineOffset * 4;
  let x = measureX + 45 + (idx * 11);
  let symbol = accToSymbol(accType);

  return `<text x="${x}" y="${y}" font-size="22" font-weight="bold" fill="#111" dominant-baseline="central" text-anchor="middle">${symbol}</text>`;
}

function generateSheet() {
  const studentContainer = document.getElementById('stavesContainer');
  const answersContainer = document.getElementById('answersStavesContainer');
  studentContainer.innerHTML = ''; answersContainer.innerHTML = '';

  const rows = document.querySelectorAll('.row-control');

  rows.forEach((row, idx) => {
    const id = row.id.split('_')[1];
    const type = document.getElementById(`type_${id}`).value;
    const skill = document.getElementById(`skill_${id}`).value;
    const givenVoice = document.getElementById(`given_voice_${id}`)?.value || 'bass';

    let clefsChecked = Array.from(document.querySelectorAll(`#clefs_${id} input:checked`)).map(cb => cb.value);
    let clef = clefsChecked.length > 0 ? clefsChecked[Math.floor(Math.random() * clefsChecked.length)] : 'sol';

    let selectedTypes = Array.from(document.querySelectorAll(`#${type}_${id} input:checked`)).map(cb => cb.value);
    let pool = DEFINED_STRUCTURES[type].filter(s => selectedTypes.includes(s.name));
    if (pool.length === 0) pool = DEFINED_STRUCTURES[type];

    let categoryName = (type === 'intervals') ? 'המרווחים' : 
                       (type === 'chords' ? 'האקורדים המשולשים' : 
                       (type === 'septachords' ? 'הספטאקורדים' : 'הסולמות'));
    
    let instructionPrefix = (skill === 'id') ? 'זהה/י את' : 'כתוב/י את';
    let voiceNoteStr = (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) ? ` (מצליל ה${givenVoice === 'bass' ? 'בס' : 'סופרן'})` : '';
    let fullInstructionTitle = `${idx + 1}. ${instructionPrefix} ${categoryName}${voiceNoteStr} הבאים`;

    let studentSVG = `<svg class="staff-svg" viewBox="0 0 750 95">`;
    let answerSVG = `<svg class="staff-svg" viewBox="0 0 750 95">`;

    for (let l = 0; l < 5; l++) {
      let lineY = 51 - l * 8;
      let lineHTML = `<line x1="20" y1="${lineY}" x2="730" y2="${lineY}" stroke="#333" stroke-width="1"/>`;
      studentSVG += lineHTML; answerSVG += lineHTML;
    }
    let borders = `<line x1="20" y1="19" x2="20" y2="51" stroke="#333" stroke-width="2"/><line x1="730" y1="19" x2="730" y2="51" stroke="#333" stroke-width="3"/>`;
    studentSVG += borders; answerSVG += borders;

    let exercises = [];
    let usedInThisRow = new Set();
    let exerciseCount = (type === 'scales') ? 3 : 5;
    let measureWidth = (710 - 20) / exerciseCount;

    for (let i = 0; i < exerciseCount; i++) {
      let measureX = 20 + i * measureWidth;
      studentSVG += getClefSVG(clef); answerSVG += getClefSVG(clef);

      if (i > 0) {
        let doubleBarLine = `
          <line x1="${measureX - 4}" y1="19" x2="${measureX - 4}" y2="51" stroke="#333" stroke-width="1"/>
          <line x1="${measureX}" y1="19" x2="${measureX}" y2="51" stroke="#333" stroke-width="3"/>
        `;
        studentSVG += doubleBarLine; answerSVG += doubleBarLine;
      }

      let available = pool.filter(p => !usedInThisRow.has(p.name));
      if (available.length === 0) available = pool;
      let chosenStruct = available[Math.floor(Math.random() * available.length)];

      if (chosenStruct.type === 'key_signature') {
        let maxAccLimit = parseInt(document.getElementById(`max_acc_${id}`)?.value || '6', 10);
        let availableKeySigs = KEY_SIGNATURES.filter(k => k.accCount <= maxAccLimit && !usedInThisRow.has(k.name));
        if (availableKeySigs.length === 0) {
          availableKeySigs = KEY_SIGNATURES.filter(k => k.accCount <= maxAccLimit);
        }
        if (availableKeySigs.length === 0) availableKeySigs = KEY_SIGNATURES;
        
        let keySig = availableKeySigs[Math.floor(Math.random() * availableKeySigs.length)];
        usedInThisRow.add(keySig.name);

        for (let k = 0; k < keySig.accCount; k++) {
          let accSvg = renderKeyAccidental(measureX, k, keySig.accType, clef);
          studentSVG += accSvg; answerSVG += accSvg;
        }

        let solutionText = keySig.name;
        let promptText = (skill === 'write') ? keySig.name : '________';
        exercises.push({ solutionText, promptText, readPitchesText: 'סימני מפתח' });
      } else {
        let chordData = null;
        let baseLine, baseAcc;

        if (type === 'scales') {
          let maxAccLimit = parseInt(document.getElementById(`max_acc_${id}`)?.value || '6', 10);
          let filteredAllowed = ALLOWED_13_SCALES.filter(s => s.type === chosenStruct.name && s.accCount <= maxAccLimit && !usedInThisRow.has(`${s.name}_${s.type}`));
          if (filteredAllowed.length === 0) {
            filteredAllowed = ALLOWED_13_SCALES.filter(s => s.type === chosenStruct.name && s.accCount <= maxAccLimit);
          }
          if (filteredAllowed.length === 0) {
            filteredAllowed = ALLOWED_13_SCALES.filter(s => s.type === chosenStruct.name);
          }
          
          let chosenScaleDef = filteredAllowed[Math.floor(Math.random() * filteredAllowed.length)];
          usedInThisRow.add(`${chosenScaleDef.name}_${chosenScaleDef.type}`);

          baseLine = chosenScaleDef.line;
          baseAcc = chosenScaleDef.acc;
          chordData = buildNotesForStructure(baseLine, baseAcc, chosenStruct, clef);
        } else {
          usedInThisRow.add(chosenStruct.name);
          let attempts = 0;
          while (attempts < 500) {
            if (skill === 'write' && (type === 'chords' || type === 'septachords' || type === 'intervals')) {
              if (givenVoice === 'bass') {
                baseLine = Math.floor(Math.random() * 3) - 2; 
              } else {
                baseLine = Math.floor(Math.random() * 4) + 3; // 3, 4, 5, 6
              }
            } else {
              baseLine = Math.floor(Math.random() * 5) - 1; 
            }

            baseAcc = (Math.random() < 0.2) ? (Math.random() < 0.5 ? -1 : 1) : 0; 
            chordData = buildNotesForStructure(baseLine, baseAcc, chosenStruct, clef, (type === 'chords' || type === 'septachords' || type === 'intervals') ? givenVoice : 'bass');
            
            let maxAbsLine = Math.max(...chordData.notes.map(n => n.absLine));
            let minAbsLine = Math.min(...chordData.notes.map(n => n.absLine));
            
            let isSopranoValid = (skill === 'write' && givenVoice === 'soprano') ? (maxAbsLine >= 3) : true;

            if (isSopranoValid && maxAbsLine <= 6 && minAbsLine >= -3 && chordData.notes.every(n => Math.abs(n.acc) <= 1)) {
              break;
            }
            attempts++;
          }
        }

        let parsedNotes = chordData.notes;
        let rootNoteName = chordData.rootName;
        let readPitchesText = parsedNotes.map(n => n.name).join('-');

        let solutionText = (type === 'scales') ? `סולם ${parsedNotes[0].name} ${chosenStruct.name}` :
                           (type === 'intervals') ? `${chosenStruct.name}` :
                           `${rootNoteName} ${chosenStruct.name}`;

        let promptText = (skill === 'write') ? (type === 'scales' ? `סולם ${parsedNotes[0].name} ${chosenStruct.name}` : `${chosenStruct.name}`) : '________';
        exercises.push({ solutionText, promptText, readPitchesText });

        let noteX = measureX + (type === 'scales' ? 55 : 70);

        if (skill === 'write') {
          let givenNoteIdx = (givenVoice === 'soprano' && (type === 'chords' || type === 'septachords' || type === 'intervals')) ? (parsedNotes.length - 1) : 0;
          let givenNote = parsedNotes[givenNoteIdx];

          if (type === 'scales') {
            let baseGraphic = renderNoteGraphic(measureX + 45, 51 - (parsedNotes[0].diatonicIdx - (clef === 'sol' ? 2 : 4)) * 4, parsedNotes[0].acc, false);
            studentSVG += baseGraphic;
          } else {
            let g = renderNoteGraphic(noteX, 51 - (givenNote.diatonicIdx - (clef === 'sol' ? 2 : 4)) * 4, givenNote.acc, false);
            studentSVG += g;
          }

          parsedNotes.forEach((n, nIdx) => {
            let y = 51 - (n.diatonicIdx - (clef === 'sol' ? 2 : 4)) * 4;
            let scaleX = measureX + 45 + (nIdx * 23);
            let isSecond = (nIdx > 0 && Math.abs(n.diatonicIdx - parsedNotes[nIdx - 1].diatonicIdx) === 1);
            let isAccShift = (type !== 'scales' && nIdx > 0 && n.acc !== 0 && parsedNotes[nIdx - 1].acc !== 0 && Math.abs(n.diatonicIdx - parsedNotes[nIdx - 1].diatonicIdx) <= 2);
            answerSVG += renderNoteGraphic(type === 'scales' ? scaleX : noteX, y, n.acc, (type !== 'scales' && isSecond), isAccShift);
          });
        } else {
          parsedNotes.forEach((n, nIdx) => {
            let y = 51 - (n.diatonicIdx - (clef === 'sol' ? 2 : 4)) * 4;
            let scaleX = measureX + 45 + (nIdx * 23);
            let isSecond = (nIdx > 0 && Math.abs(n.diatonicIdx - parsedNotes[nIdx - 1].diatonicIdx) === 1);
            let isAccShift = (type !== 'scales' && nIdx > 0 && n.acc !== 0 && parsedNotes[nIdx - 1].acc !== 0 && Math.abs(n.diatonicIdx - parsedNotes[nIdx - 1].diatonicIdx) <= 2);
            let g = renderNoteGraphic(type === 'scales' ? scaleX : noteX, y, n.acc, (type !== 'scales' && isSecond), isAccShift);
            studentSVG += g; answerSVG += g;
          });
        }
      }
    }

    studentSVG += `</svg>`;
    answerSVG += `</svg>`;

    let cellWidth = (100 / exerciseCount).toFixed(2);
    let studentAnsHTML = `<div class="answer-row">${exercises.map(e => `<div class="answer-cell" style="width: ${cellWidth}%;">${e.promptText}</div>`).join('')}</div>`;
    let answerAnsHTML = `<div class="answer-row">${exercises.map(e => `
      <div class="answer-cell" style="width: ${cellWidth}%;">
        <div class="read-text">${e.readPitchesText}</div>
        <div class="solution-text">${e.solutionText}</div>
      </div>
    `).join('')}</div>`;

    const staffDiv = document.createElement('div');
    staffDiv.className = 'staff-system';
    staffDiv.innerHTML = `<div class="exercise-title">${fullInstructionTitle}:</div>${studentSVG}${studentAnsHTML}`;
    studentContainer.appendChild(staffDiv);

    const ansDiv = document.createElement('div');
    ansDiv.className = 'staff-system';
    ansDiv.innerHTML = `<div class="exercise-title">${fullInstructionTitle} - פתרון מלא:</div>${answerSVG}${answerAnsHTML}`;
    answersContainer.appendChild(ansDiv);
  });
}

function toggleAnswersPage() {
  const ansSheet = document.getElementById('answersheet-a4');
  ansSheet.style.display = (ansSheet.style.display === 'none') ? 'flex' : 'none';
}

async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  
  const canvas1 = await html2canvas(document.getElementById('worksheet-a4'), { scale: 2 });
  pdf.addImage(canvas1.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);

  const ansSheet = document.getElementById('answersheet-a4');
  const wasHidden = ansSheet.style.display === 'none';
  
  if (wasHidden) {
    ansSheet.style.display = 'flex';
  }
  
  pdf.addPage();
  const canvas2 = await html2canvas(ansSheet, { scale: 2 });
  pdf.addImage(canvas2.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
  
  if (wasHidden) {
    ansSheet.style.display = 'none';
  }

  pdf.save('music_practice.pdf');
}

window.onload = () => { addRow(); generateSheet(); };
