<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל דפי תרגול במוזיקה</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 30px 15px;
      color: var(--text-color);
      direction: rtl;
    }

    .app-container { max-width: 1100px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 20px; }
    .app-header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }

    .controls-panel {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 20px;
      margin-bottom: 20px;
    }

    .row-control {
      display: grid;
      grid-template-columns: 75px 130px 95px 140px 1fr 35px;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .row-control:last-child { border-bottom: none; }
    .row-label { font-weight: 700; color: var(--primary); font-size: 13.5px; }

    select, .custom-select-btn {
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background-color: #f8fafc;
      font-size: 13px;
      color: var(--text-color);
      outline: none;
    }

    .multi-select-container { position: relative; width: 100%; }
    .multi-select-btn {
      width: 100%; text-align: right; cursor: pointer;
      box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .multi-select-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      width: 250px; background: #fff; border: 1px solid var(--border-color);
      border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 8px 12px;
    }
    .multi-select-dropdown.show { display: block; }
    .multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; cursor: pointer; }

    .dropdown-actions {
      display: flex; justify-content: space-between; padding-bottom: 6px; margin-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .btn-toggle-all {
      background: none; border: none; color: var(--accent); font-size: 11.5px;
      font-weight: bold; cursor: pointer; padding: 0;
    }
    .btn-toggle-all:hover { text-decoration: underline; }

    .sub-group { display: flex; gap: 8px; align-items: center; width: 100%; }
    .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; }
    .btn-add-row { background: #27ae60; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; display: inline-block; }

    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    .btn { padding: 10px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-generate { background-color: var(--accent); color: white; }
    .btn-pdf { background-color: #2ecc71; color: white; }

    .a4-page-container { display: flex; justify-content: center; }
    #worksheet-a4 {
      width: 210mm; min-height: 297mm; padding: 12mm 15mm;
      background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); box-sizing: border-box; direction: rtl;
    }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 14px; }
    .sheet-title { font-size: 18px; font-weight: bold; color: #111; }
    .sheet-fields { display: flex; gap: 20px; font-size: 11px; }
    .field-line { border-bottom: 1px dashed #555; display: inline-block; width: 75px; }

    .staff-system { margin-bottom: 16px; page-break-inside: avoid; }
    .exercise-title { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #222; direction: rtl; }

    .staff-svg { width: 100%; height: 85px; display: block; }
    .answer-row { display: flex; justify-content: space-around; font-size: 9px; color: #333; margin-top: 2px; }
    .answer-cell { width: 18%; text-align: center; }
    .scale-answer-row { display: flex; justify-content: space-between; font-size: 9.5px; color: #333; margin-top: 2px; padding: 0 10px; }
    .scale-answer-cell { width: 48%; text-align: right; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h1>מחולל דפי תרגול בתורת המוזיקה</h1>
  </div>

  <div class="controls-panel">
    <div id="rowsContainer"></div>
    <button class="btn-add-row" onclick="addRow()">הוסף חמשה +</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateSheet()">צור/רענן תרגילים</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">הורד קובץ PDF</button>
  </div>

  <br>

  <div class="a4-page-container">
    <div id="worksheet-a4">
      <div class="sheet-header">
        <div class="sheet-title">תרגול תורת המוזיקה</div>
        <div class="sheet-fields">
          <div>שם: <span class="field-line"></span></div>
          <div>תאריך: <span class="field-line" style="width:50px;"></span></div>
          <div>ציון: <span class="field-line" style="width:35px;"></span></div>
        </div>
      </div>
      <div id="stavesContainer"></div>
    </div>
  </div>
</div>

<script>
  let rowCounter = 0;

  const CLEFS_LIST = [{ val: 'sol', label: 'מפתח סול' }, { val: 'fa', label: 'מפתח פה' }];
  const INTERVALS_LIST = ['פרימה זכה', 'סקונדה קטנה', 'סקונדה גדולה', 'טרצה קטנה', 'טרצה גדולה', 'קוורטה זכה', 'קוורטה מוגדלת', 'קווינטה מוקטנת', 'טריטון', 'קווינטה זכה', 'סקסטה קטנה', 'סקסטה גדולה', 'ספטימה קטנה', 'ספטימה גדולה', 'אוקטבה זכה'];
  const CHORDS_LIST = ['מז׳ור יסודי', 'מז׳ור היפוך ראשון', 'מז׳ור היפוך שני', 'מינור יסודי', 'מינור היפוך ראשון', 'מינור היפוך שני', 'מוקטן יסודי', 'מוקטן היפוך ראשון', 'מוקטן היפוך שני', 'מוגדל יסודי', 'מוגדל היפוך ראשון', 'מוגדל היפוך שני'];
  const SCALE_MODES = ['מז׳ור', 'מינור טבעי', 'מינור הרמוני', 'מינור מלודי'];
  const ROOT_NOTES = ['דו', 'דו דיאז', 'רה במול', 'רה', 'רה דיאז', 'מי במול', 'מי', 'פה', 'פה דיאז', 'סול במול', 'סול', 'סול דיאז', 'לה במול', 'לה', 'לה דיאז', 'סי במול', 'סי'];
  const KEY_SIGNATURES = [{ val: '0', label: 'ללא סימני התק' }, { val: '1d', label: '1 דיאז' }, { val: '2d', label: '2 דיאזים' }, { val: '3d', label: '3 דיאזים' }, { val: '4d', label: '4 דיאזים' }, { val: '5d', label: '5 דיאזים' }, { val: '6d', label: '6 דיאזים' }, { val: '7d', label: '7 דיאזים' }, { val: '1b', label: '1 במול' }, { val: '2b', label: '2 במולים' }, { val: '3b', label: '3 במולים' }, { val: '4b', label: '4 במולים' }, { val: '5b', label: '5 במולים' }, { val: '6b', label: '6 במולים' }, { val: '7b', label: '7 במולים' }];

  function getDiverseSelection(pool, count = 5) {
    let selection = [];
    let counts = {};

    for (let i = 0; i < count; i++) {
      let available = pool.filter(item => (counts[item] || 0) < 3);
      if (available.length === 0) available = pool;

      let chosen = available[Math.floor(Math.random() * available.length)];
      selection.push(chosen);
      counts[chosen] = (counts[chosen] || 0) + 1;
    }
    return selection;
  }

  function buildDropdownHTML(dropdownId, items, labelProperty = null) {
    const list = items.map(item => {
      const val = labelProperty ? item.val : item;
      const lbl = labelProperty ? item.label : item;
      return `<label><input type="checkbox" value="${val}" checked onchange="updateBtnText('${dropdownId}', ${items.length})"> ${lbl}</label>`;
    }).join('');

    return `
      <div class="dropdown-actions">
        <button class="btn-toggle-all" onclick="selectAll('${dropdownId}', true, ${items.length})">בחר הכל</button>
        <button class="btn-toggle-all" onclick="selectAll('${dropdownId}', false, ${items.length})">הסר הכל</button>
      </div>
      ${list}
    `;
  }

  function addRow() {
    rowCounter++;
    const id = rowCounter;
    const container = document.getElementById('rowsContainer');
    const row = document.createElement('div');
    row.className = 'row-control';
    row.id = `row_${id}`;

    row.innerHTML = `
      <div class="row-label">חמשה <span class="row-num"></span>:</div>
      <div class="multi-select-container">
        <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('clefs_${id}')">מפתחות (הכל)</div>
        <div class="multi-select-dropdown" id="clefs_${id}">
          ${buildDropdownHTML(`clefs_${id}`, CLEFS_LIST, true)}
        </div>
      </div>
      <select id="skill_${id}" onchange="onSkillChange(${id})">
        <option value="id">זיהוי</option>
        <option value="write">כתיבה</option>
      </select>
      <select id="type_${id}" onchange="onTypeChange(${id})">
        <option value="intervals">מרווחים הרמוניים</option>
        <option value="chords">אקורדים משולשים</option>
        <option value="scales">סולמות</option>
      </select>
      <div id="sub_container_${id}"></div>
      <button class="btn-remove" onclick="removeRow(${id})">✕</button>
    `;
    container.appendChild(row);
    onTypeChange(id);
    updateRowNumbers();
  }

  function removeRow(id) {
    const row = document.getElementById(`row_${id}`);
    if (row) row.remove();
    updateRowNumbers();
  }

  function updateRowNumbers() {
    document.querySelectorAll('.row-control').forEach((r, idx) => {
      r.querySelector('.row-num').innerText = idx + 1;
    });
  }

  function onSkillChange(i) {
    onTypeChange(i);
  }

  function onTypeChange(i) {
    const type = document.getElementById(`type_${i}`).value;
    const container = document.getElementById(`sub_container_${i}`);
    container.innerHTML = '';

    if (type === 'intervals') {
      container.innerHTML = `
        <div class="sub-group">
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('intervals_${i}')">מרווחים (הכל)</div>
            <div class="multi-select-dropdown" id="intervals_${i}">
              ${buildDropdownHTML(`intervals_${i}`, INTERVALS_LIST)}
            </div>
          </div>
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('keys_${i}')">סימני התק</div>
            <div class="multi-select-dropdown" id="keys_${i}">
              ${buildDropdownHTML(`keys_${i}`, KEY_SIGNATURES, true)}
            </div>
          </div>
        </div>`;
    } else if (type === 'chords') {
      container.innerHTML = `
        <div class="sub-group">
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('chords_${i}')">אקורדים (הכל)</div>
            <div class="multi-select-dropdown" id="chords_${i}">
              ${buildDropdownHTML(`chords_${i}`, CHORDS_LIST)}
            </div>
          </div>
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('keys_${i}')">סימני התק</div>
            <div class="multi-select-dropdown" id="keys_${i}">
              ${buildDropdownHTML(`keys_${i}`, KEY_SIGNATURES, true)}
            </div>
          </div>
        </div>`;
    } else if (type === 'scales') {
      container.innerHTML = `
        <div class="sub-group">
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('modes_${i}')">סולמות</div>
            <div class="multi-select-dropdown" id="modes_${i}">
              ${buildDropdownHTML(`modes_${i}`, SCALE_MODES)}
            </div>
          </div>
          <div class="multi-select-container">
            <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('keys_${i}')">סימני התק</div>
            <div class="multi-select-dropdown" id="keys_${i}">
              ${buildDropdownHTML(`keys_${i}`, KEY_SIGNATURES, true)}
            </div>
          </div>
        </div>`;
    }
  }

  function toggleDropdown(id) { document.getElementById(id).classList.toggle('show'); }

  function selectAll(id, state, total) {
    const checkboxes = document.querySelectorAll(`#${id} input[type="checkbox"]`);
    checkboxes.forEach(cb => cb.checked = state);
    updateBtnText(id, total);
  }

  function updateBtnText(id, total) {
    const checkboxes = document.querySelectorAll(`#${id} input[type="checkbox"]:checked`);
    const btn = document.getElementById(id).previousElementSibling;
    if (checkboxes.length === total) btn.innerText = 'בחר (הכל)';
    else if (checkboxes.length === 0) btn.innerText = 'לא נבחר';
    else btn.innerText = `נבחרו ${checkboxes.length}`;
  }

  function getClefPlaceholderSVG(xOffset = 25) {
    return `<rect x="${xOffset}" y="15" width="26" height="40" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="2,2" rx="3"/>`;
  }

  function drawLedgerLines(x, y) {
    let svg = '';
    if (y <= 11) { for (let ly = 19; ly >= y; ly -= 8) svg += `<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
    if (y >= 59) { for (let ly = 51; ly <= y; ly += 8) svg += `<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
    return svg;
  }

  function drawSingleNote(x, y) {
    const middleY = 35;
    let svg = drawLedgerLines(x, y);
    svg += `<ellipse cx="${x}" cy="${y}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y})"/>`;
    
    if (y > middleY) {
      svg += `<line x1="${x+4.5}" y1="${y}" x2="${x+4.5}" y2="${y-28}" stroke="#111" stroke-width="1.5"/>`;
    } else {
      svg += `<line x1="${x-4.5}" y1="${y}" x2="${x-4.5}" y2="${y+28}" stroke="#111" stroke-width="1.5"/>`;
    }
    return svg;
  }

  function drawStructure(x, type, skill, chordInversion = 0) {
    const middleY = 35;

    if (skill === 'write') {
      const allowedY = [35, 39, 43, 47, 51, 55, 59];
      let baseY = allowedY[Math.floor(Math.random() * allowedY.length)];
      return drawSingleNote(x, baseY);
    }

    let svg = '';

    if (type === 'intervals') {
      const allowedBassY = [35, 39, 43, 47, 51, 55];
      let y1 = allowedBassY[Math.floor(Math.random() * allowedBassY.length)];
      let intervalStep = (Math.floor(Math.random() * 4) + 1) * 4;
      let y2 = y1 - intervalStep;

      svg += drawLedgerLines(x, y1) + drawLedgerLines(x, y2);
      svg += `<ellipse cx="${x}" cy="${y1}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y1})"/>`;
      svg += `<ellipse cx="${x}" cy="${y2}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y2})"/>`;

      let avgY = (y1 + y2) / 2;
      if (avgY <= middleY) {
        svg += `<line x1="${x-4.5}" y1="${y2}" x2="${x-4.5}" y2="${y1+24}" stroke="#111" stroke-width="1.5"/>`;
      } else {
        svg += `<line x1="${x+4.5}" y1="${y1}" x2="${x+4.5}" y2="${y2-24}" stroke="#111" stroke-width="1.5"/>`;
      }

    } else if (type === 'chords') {
      let step1 = (chordInversion === 1) ? 8 : (chordInversion === 2 ? 12 : 8);
      let step2 = (chordInversion === 1) ? 12 : (chordInversion === 2 ? 8 : 8);

      const allowedBassY = [35, 39, 43, 47, 51, 55];
      let y1 = allowedBassY[Math.floor(Math.random() * allowedBassY.length)];
      let y2 = y1 - step1;
      let y3 = y2 - step2;

      svg += drawLedgerLines(x, y1) + drawLedgerLines(x, y3);
      svg += `<ellipse cx="${x}" cy="${y1}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y1})"/>`;
      svg += `<ellipse cx="${x}" cy="${y2}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y2})"/>`;
      svg += `<ellipse cx="${x}" cy="${y3}" rx="5" ry="4" fill="#111" transform="rotate(-20 ${x} ${y3})"/>`;

      let avgY = y2;
      if (avgY <= middleY) {
        svg += `<line x1="${x-4.5}" y1="${y3}" x2="${x-4.5}" y2="${y1+24}" stroke="#111" stroke-width="1.5"/>`;
      } else {
        svg += `<line x1="${x+4.5}" y1="${y1}" x2="${x+4.5}" y2="${y3-24}" stroke="#111" stroke-width="1.5"/>`;
      }
    }
    return svg;
  }

  function drawKeySignatureSVG(keyVal, clef, xStart = 60) {
    if (!keyVal || keyVal === '0') return '';
    let svg = '';
    const isSharp = keyVal.includes('d');
    const count = parseInt(keyVal);

    const sharpY_sol = [19, 31, 15, 27, 39, 23, 35]; 
    const flatY_sol  = [35, 23, 39, 27, 43, 31, 47];
    const sharpY_fa  = [27, 39, 23, 35, 47, 31, 43];
    const flatY_fa   = [43, 31, 47, 35, 51, 39, 55];

    const sharpY = (clef === 'fa') ? sharpY_fa : sharpY_sol;
    const flatY  = (clef === 'fa') ? flatY_fa  : flatY_sol;

    for (let k = 0; k < count; k++) {
      let x = xStart + (k * 7.5);
      let y = isSharp ? sharpY[k] : flatY[k];
      let symbol = isSharp ? '♯' : '♭';
      svg += `<text x="${x}" y="${y+6}" font-size="17" font-weight="bold" fill="#111">${symbol}</text>`;
    }
    return svg;
  }

  function drawStaffSVG(skill, type, clef, keysPool, keyVal2 = null) {
    let svg = `<svg class="staff-svg" viewBox="0 0 750 85">`;
    
    for (let l = 0; l < 5; l++) {
      let y = 19 + l * 8;
      svg += `<line x1="20" y1="${y}" x2="730" y2="${y}" stroke="#333" stroke-width="1"/>`;
    }
    svg += `<line x1="20" y1="19" x2="20" y2="51" stroke="#333" stroke-width="2"/>`;
    svg += `<line x1="730" y1="19" x2="730" y2="51" stroke="#333" stroke-width="2"/>`;

    if (type === 'scales') {
      let midX = 375;
      svg += `<line x1="${midX-2}" y1="19" x2="${midX-2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
      svg += `<line x1="${midX+2}" y1="19" x2="${midX+2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
      
      svg += getClefPlaceholderSVG(25);
      let keyVal1 = (keysPool && keysPool.length > 0) ? keysPool[0] : '0';
      if (skill === 'id' && keyVal1 && keyVal1 !== '0') {
        svg += drawKeySignatureSVG(keyVal1, clef, 60);
      }

      svg += getClefPlaceholderSVG(385);
      if (skill === 'id' && keyVal2 && keyVal2 !== '0') {
        svg += drawKeySignatureSVG(keyVal2, clef, 420);
      }

    } else {
      let stepX = 142;
      for (let i = 1; i < 5; i++) {
        let bx = 20 + i * stepX;
        svg += `<line x1="${bx-2}" y1="19" x2="${bx-2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
        svg += `<line x1="${bx+2}" y1="19" x2="${bx+2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
      }

      for (let i = 0; i < 5; i++) {
        let measureStartX = 20 + i * stepX;
        
        svg += getClefPlaceholderSVG(measureStartX + 5);

        let currentKey = '0';
        if (keysPool && keysPool.length > 0) {
          currentKey = keysPool[Math.floor(Math.random() * keysPool.length)];
        }

        if (currentKey && currentKey !== '0') {
          svg += drawKeySignatureSVG(currentKey, clef, measureStartX + 35);
        }

        let keyCount = parseInt(currentKey) || 0;
        let noteX = measureStartX + 35 + (keyCount * 7.5) + 25;
        if (noteX > measureStartX + stepX - 15) {
          noteX = measureStartX + stepX - 15;
        }

        let chordInversion = Math.floor(Math.random() * 3);
        svg += drawStructure(noteX, type, skill, chordInversion);
      }
    }

    svg += `</svg>`;
    return svg;
  }

  function generateSheet() {
    const container = document.getElementById('stavesContainer');
    container.innerHTML = '';
    const rows = document.querySelectorAll('.row-control');

    rows.forEach((row, idx) => {
      const id = row.id.split('_')[1];
      const type = document.getElementById(`type_${id}`).value;
      const skill = document.getElementById(`skill_${id}`).value;

      let clefsChecked = Array.from(document.querySelectorAll(`#clefs_${id} input:checked`)).map(cb => cb.value);
      if (clefsChecked.length === 0) clefsChecked = ['sol'];
      let clef = clefsChecked[Math.floor(Math.random() * clefsChecked.length)];

      let keysChecked = Array.from(document.querySelectorAll(`#keys_${id} input:checked`)).map(cb => cb.value);
      if (keysChecked.length === 0) keysChecked = KEY_SIGNATURES.map(k => k.val);

      let keyVal2 = '';
      let answersHTML = '';

      if (type === 'scales') {
        let modesChecked = Array.from(document.querySelectorAll(`#modes_${id} input:checked`)).map(cb => cb.value);
        if (modesChecked.length === 0) modesChecked = SCALE_MODES;

        let mode1 = modesChecked[Math.floor(Math.random() * modesChecked.length)];
        let root1 = ROOT_NOTES[Math.floor(Math.random() * ROOT_NOTES.length)];

        let mode2 = modesChecked[Math.floor(Math.random() * modesChecked.length)];
        let root2 = ROOT_NOTES[Math.floor(Math.random() * ROOT_NOTES.length)];
        keyVal2 = keysChecked[Math.floor(Math.random() * keysChecked.length)];

        if (skill === 'id') {
          answersHTML = `
            <div class="scale-answer-row">
              <div class="scale-answer-cell">א. זהה/י את הסולם: ____________________</div>
              <div class="scale-answer-cell">ב. זהה/י את הסולם: ____________________</div>
            </div>`;
        } else {
          answersHTML = `
            <div class="scale-answer-row">
              <div class="scale-answer-cell">א. כתוב/י סולם <b>${root1} ${mode1}</b></div>
              <div class="scale-answer-cell">ב. כתוב/י סולם <b>${root2} ${mode2}</b></div>
            </div>`;
        }

        let clefName = (clef === 'fa') ? 'מפתח פה' : 'מפתח סול';
        let skillLabel = (skill === 'id') ? 'זהה/י' : 'כתוב/י';

        const staffDiv = document.createElement('div');
        staffDiv.className = 'staff-system';
        staffDiv.innerHTML = `
          <div class="exercise-title">${idx + 1}. צייר/י ${clefName} ו${skillLabel} סולמות</div>
          ${drawStaffSVG(skill, type, clef, keysChecked, keyVal2)}
          ${answersHTML}
        `;
        container.appendChild(staffDiv);

      } else {
        let checkedBoxes = document.querySelectorAll(`#${type}_${id} input:checked`);
        let pool = Array.from(checkedBoxes).map(cb => cb.value);
        if (pool.length === 0) pool = (type === 'intervals') ? INTERVALS_LIST : CHORDS_LIST;

        let selectedItems = getDiverseSelection(pool, 5);

        if (skill === 'id') {
          answersHTML = `
            <div class="answer-row">
              <div class="answer-cell">________</div>
              <div class="answer-cell">________</div>
              <div class="answer-cell">________</div>
              <div class="answer-cell">________</div>
              <div class="answer-cell">________</div>
            </div>`;
        } else {
          answersHTML = `
            <div class="answer-row">
              <div class="answer-cell">${selectedItems[0]}</div>
              <div class="answer-cell">${selectedItems[1]}</div>
              <div class="answer-cell">${selectedItems[2]}</div>
              <div class="answer-cell">${selectedItems[3]}</div>
              <div class="answer-cell">${selectedItems[4]}</div>
            </div>`;
        }

        let clefName = (clef === 'fa') ? 'מפתח פה' : 'מפתח סול';
        let typeLabel = (type === 'intervals') ? 'מרווחים הרמוניים' : 'אקורדים משולשים';
        let skillLabel = (skill === 'id') ? 'זהה/י' : 'כתוב/י';

        const staffDiv = document.createElement('div');
        staffDiv.className = 'staff-system';

        staffDiv.innerHTML = `
          <div class="exercise-title">${idx + 1}. צייר/י ${clefName} ו${skillLabel} ${typeLabel}</div>
          ${drawStaffSVG(skill, type, clef, keysChecked)}
          ${answersHTML}
        `;

        container.appendChild(staffDiv);
      }
    });
  }

  async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const element = document.getElementById('worksheet-a4');
    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF('p', 'mm', 'a4');
    pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
    pdf.save('music_theory_worksheet.pdf');
  }

  window.onclick = function(event) {
    if (!event.target.matches('.multi-select-btn') && !event.target.closest('.multi-select-dropdown')) {
      document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('show'));
    }
  }

  window.onload = () => {
    addRow();
    generateSheet();
  };
</script>

</body>
</html>
