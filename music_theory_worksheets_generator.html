<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל דפי תרגול במוזיקה</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 30px 15px;
      color: var(--text-color);
      direction: rtl;
    }

    .app-container { max-width: 1100px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 20px; }
    .app-header h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }

    .controls-panel {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      padding: 20px;
      margin-bottom: 20px;
    }

    .row-control {
      display: grid;
      grid-template-columns: 75px 130px 95px 160px 1fr 35px;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .row-control:last-child { border-bottom: none; }
    .row-label { font-weight: 700; color: var(--primary); font-size: 13.5px; }

    select, .custom-select-btn {
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background-color: #f8fafc;
      font-size: 13px;
      color: var(--text-color);
      outline: none;
    }

    .multi-select-container { position: relative; width: 100%; }
    .multi-select-btn {
      width: 100%; text-align: right; cursor: pointer;
      box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .multi-select-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); right: 0;
      width: 270px; background: #fff; border: 1px solid var(--border-color);
      border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 8px 12px;
    }
    .multi-select-dropdown.show { display: block; }
    .multi-select-dropdown label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; cursor: pointer; }

    .dropdown-actions {
      display: flex; justify-content: space-between; padding-bottom: 6px; margin-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .btn-toggle-all {
      background: none; border: none; color: var(--accent); font-size: 11.5px;
      font-weight: bold; cursor: pointer; padding: 0;
    }
    .btn-toggle-all:hover { text-decoration: underline; }

    .sub-group { display: flex; gap: 8px; align-items: center; width: 100%; }
    .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; }
    .btn-add-row { background: #27ae60; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; display: inline-block; }

    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    .btn { padding: 10px 24px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-generate { background-color: var(--accent); color: white; }
    .btn-pdf { background-color: #2ecc71; color: white; }

    .a4-page-container { display: flex; justify-content: center; margin-top: 20px; }

    #worksheet-a4 {
      width: 210mm; min-height: 297mm; padding: 12mm 15mm;
      background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); box-sizing: border-box; direction: rtl;
    }
    .sheet-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #222; padding-bottom: 6px; margin-bottom: 14px; }
    .sheet-title { font-size: 18px; font-weight: bold; color: #111; }
    .sheet-fields { display: flex; gap: 20px; font-size: 11px; }
    .field-line { border-bottom: 1px dashed #555; display: inline-block; width: 75px; }

    .staff-system { margin-bottom: 16px; page-break-inside: avoid; }
    .exercise-title { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #222; direction: rtl; }

    .staff-svg { width: 100%; height: 95px; display: block; }
    .answer-row { display: flex; justify-content: space-around; font-size: 9.5px; color: #333; margin-top: 2px; }
    .answer-cell { width: 18%; text-align: center; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h1>מחולל דפי תרגול בתורת המוזיקה</h1>
  </div>

  <div class="controls-panel">
    <div id="rowsContainer"></div>
    <button class="btn-add-row" onclick="addRow()">הוסף חמשה +</button>
  </div>

  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateSheet()">צור/רענן תרגילים</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">הורד קובץ PDF</button>
  </div>

  <div class="a4-page-container">
    <div id="worksheet-a4">
      <div class="sheet-header">
        <div class="sheet-title">תרגול תורת המוזיקה</div>
        <div class="sheet-fields">
          <div>שם: <span class="field-line"></span></div>
          <div>תאריך: <span class="field-line" style="width:50px;"></span></div>
          <div>ציון: <span class="field-line" style="width:35px;"></span></div>
        </div>
      </div>
      <div id="stavesContainer"></div>
    </div>
  </div>
</div>

<script>
  let rowCounter = 0;

  const CLEFS_LIST = [{ val: 'sol', label: 'מפתח סול' }, { val: 'fa', label: 'מפתח פה' }];
  
  const INTERVALS_LIST = [
    'פרימה זכה', 'סקונדה קטנה', 'סקונדה גדולה', 'טרצה קטנה', 'טרצה גדולה', 
    'קוורטה זכה', 'קוורטה מוגדלת', 'קווינטה מוקטנת', 'קווינטה זכה', 
    'סקסטה קטנה', 'סקסטה גדולה', 'ספטימה קטנה', 'ספטימה גדולה', 'אוקטבה זכה'
  ];

  const CHORDS_LIST = [
    'מז׳ור יסודי', 'מז׳ור היפוך ראשון', 'מז׳ור היפוך שני',
    'מינור יסודי', 'מינור היפוך ראשון', 'מינור היפוך שני',
    'מוקטן יסודי', 'מוקטן היפוך ראשון', 'מוקטן היפוך שני',
    'מוגדל יסודי', 'מוגדל היפוך ראשון', 'מוגדל היפוך שני'
  ];

  const SEPTACHORDS_LIST = [
    'דומיננטי יסודי (7)', 'דומיננטי 6/5', 'דומיננטי 4/3', 'דומיננטי 2',
    'שבע גדול יסודי (Maj7)', 'שבע גדול 6/5', 'שבע גדול 4/3', 'שבע גדול 2',
    'מינור שבע יסודי (m7)', 'מינור שבע 6/5', 'מינור שבע 4/3', 'מינור שבע 2',
    'חצי מוקטן יסודי (m7b5)', 'חצי מוקטן 6/5', 'חצי מוקטן 4/3', 'חצי מוקטן 2'
  ];

  const SCALES_LIST = ['דו מז׳ור', 'לה מינור טבעי', 'לה מינור הרמוני', 'סול מז׳ור', 'רמינור'];

  const KEY_SIGNATURES = [
    { val: '0', label: 'ללא סימני התק' },
    { val: '1d', label: '1 דיאז' }, { val: '2d', label: '2 דיאזים' }, { val: '3d', label: '3 דיאזים' },
    { val: '1b', label: '1 במול' }, { val: '2b', label: '2 במולים' }, { val: '3b', label: '3 במולים' }
  ];

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getDiverseSelection(pool, count = 5) {
    let shuffled = shuffle(pool);
    let result = [];
    for (let i = 0; i < count; i++) {
      result.push(shuffled[i % shuffled.length]);
    }
    return shuffle(result);
  }

  function buildDropdownHTML(dropdownId, items, labelProperty = null) {
    const list = items.map(item => {
      const val = labelProperty ? item.val : item;
      const lbl = labelProperty ? item.label : item;
      return `<label><input type="checkbox" value="${val}" checked onchange="updateBtnText('${dropdownId}', ${items.length})"> ${lbl}</label>`;
    }).join('');

    return `
      <div class="dropdown-actions">
        <button class="btn-toggle-all" onclick="selectAll('${dropdownId}', true, ${items.length})">בחר הכל</button>
        <button class="btn-toggle-all" onclick="selectAll('${dropdownId}', false, ${items.length})">הסר הכל</button>
      </div>
      ${list}
    `;
  }

  function addRow() {
    rowCounter++;
    const id = rowCounter;
    const container = document.getElementById('rowsContainer');
    const row = document.createElement('div');
    row.className = 'row-control';
    row.id = `row_${id}`;

    row.innerHTML = `
      <div class="row-label">חמשה <span class="row-num"></span>:</div>
      <div class="multi-select-container">
        <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('clefs_${id}')">מפתחות (הכל)</div>
        <div class="multi-select-dropdown" id="clefs_${id}">
          ${buildDropdownHTML(`clefs_${id}`, CLEFS_LIST, true)}
        </div>
      </div>
      <select id="skill_${id}" onchange="onSkillChange(${id})">
        <option value="id">זיהוי</option>
        <option value="write">כתיבה</option>
      </select>
      <select id="type_${id}" onchange="onTypeChange(${id})">
        <option value="intervals">מרווחים הרמוניים</option>
        <option value="chords">אקורדים משולשים</option>
        <option value="septachords">ספטאקורדים (מרובעים)</option>
        <option value="scales">סולמות</option>
      </select>
      <div id="sub_container_${id}"></div>
      <button class="btn-remove" onclick="removeRow(${id})">✕</button>
    `;
    container.appendChild(row);
    onTypeChange(id);
    updateRowNumbers();
  }

  function removeRow(id) {
    const row = document.getElementById(`row_${id}`);
    if (row) row.remove();
    updateRowNumbers();
  }

  function updateRowNumbers() {
    document.querySelectorAll('.row-control').forEach((r, idx) => {
      r.querySelector('.row-num').innerText = idx + 1;
    });
  }

  function onSkillChange(i) { onTypeChange(i); }

  function onTypeChange(i) {
    const type = document.getElementById(`type_${i}`).value;
    const container = document.getElementById(`sub_container_${i}`);
    container.innerHTML = '';

    let itemsList = [];
    let titleName = '';

    if (type === 'intervals') { itemsList = INTERVALS_LIST; titleName = 'מרווחים'; }
    else if (type === 'chords') { itemsList = CHORDS_LIST; titleName = 'אקורדים'; }
    else if (type === 'septachords') { itemsList = SEPTACHORDS_LIST; titleName = 'ספטאקורדים'; }
    else if (type === 'scales') { itemsList = SCALES_LIST; titleName = 'סולמות'; }

    container.innerHTML = `
      <div class="sub-group">
        <div class="multi-select-container">
          <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('${type}_${i}')">${titleName} (הכל)</div>
          <div class="multi-select-dropdown" id="${type}_${i}">
            ${buildDropdownHTML(`${type}_${i}`, itemsList)}
          </div>
        </div>
        <div class="multi-select-container">
          <div class="multi-select-btn custom-select-btn" onclick="toggleDropdown('keys_${i}')">סימני התק</div>
          <div class="multi-select-dropdown" id="keys_${i}">
            ${buildDropdownHTML(`keys_${i}`, KEY_SIGNATURES, true)}
          </div>
        </div>
      </div>`;
  }

  function toggleDropdown(id) { document.getElementById(id).classList.toggle('show'); }

  function selectAll(id, state, total) {
    const checkboxes = document.querySelectorAll(`#${id} input[type="checkbox"]`);
    checkboxes.forEach(cb => cb.checked = state);
    updateBtnText(id, total);
  }

  function updateBtnText(id, total) {
    const checkboxes = document.querySelectorAll(`#${id} input[type="checkbox"]:checked`);
    const btn = document.getElementById(id).previousElementSibling;
    if (checkboxes.length === total) btn.innerText = 'בחר (הכל)';
    else if (checkboxes.length === 0) btn.innerText = 'לא נבחר';
    else btn.innerText = `נבחרו ${checkboxes.length}`;
  }

  function getClefSVG(clef, xOffset = 25) {
    if (clef === 'fa') {
      return `<g transform="translate(${xOffset + 2}, 19) scale(0.65)">
        <path d="M 12 12 C 12 6, 22 6, 22 14 C 22 22, 10 26, 10 38" fill="none" stroke="#111" stroke-width="3.5"/>
        <circle cx="11" cy="12" r="3.5" fill="#111"/>
        <circle cx="27" cy="10" r="2.5" fill="#111"/>
        <circle cx="27" cy="22" r="2.5" fill="#111"/>
      </g>`;
    }
    return `<g transform="translate(${xOffset + 2}, 28) scale(0.125)">
      <path d="M 14 185 C 35 185 54 167 54 140 C 54 110 30 90 4 90 C -25 90 -45 112 -45 145 C -45 185 -10 220 30 220 C 75 220 105 180 105 125 C 105 50 40 -15 15 -75 C 5 -100 15 -130 35 -130 C 45 -130 55 -115 50 -90 C 40 -40 0 50 -5 120 L -5 270 C -5 295 -25 315 -50 315 C -65 315 -80 300 -80 285 C -80 270 -65 255 -50 255 C -40 255 -30 265 -25 275" fill="none" stroke="#111" stroke-width="9.5" stroke-linecap="round"/>
    </g>`;
  }

  function drawLedgerLines(x, y) {
    let svg = '';
    if (y <= 11) { for (let ly = 19; ly >= y; ly -= 8) svg += `<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
    if (y >= 59) { for (let ly = 51; ly <= y; ly += 8) svg += `<line x1="${x-9}" y1="${ly}" x2="${x+9}" y2="${ly}" stroke="#111" stroke-width="1.2"/>`; }
    return svg;
  }

  function getStepOffsets(type, item) {
    if (type === 'intervals') {
      const mapping = {
        'פרימה זכה': 0, 'סקונדה קטנה': 1, 'סקונדה גדולה': 1,
        'טרצה קטנה': 2, 'טרצה גדולה': 2, 'קוורטה זכה': 3,
        'קוורטה מוגדלת': 3, 'קווינטה מוקטנת': 4, 'קווינטה זכה': 4,
        'סקסטה קטנה': 5, 'סקסטה גדולה': 5, 'ספטימה קטנה': 6,
        'ספטימה גדולה': 6, 'אוקטבה זכה': 7
      };
      return [0, mapping[item] !== undefined ? mapping[item] : 2];
    } else if (type === 'chords') {
      if (item.includes('היפוך ראשון')) return [0, 2, 5];
      if (item.includes('היפוך שני')) return [0, 3, 5];
      return [0, 2, 4];
    } else if (type === 'septachords') {
      if (item.includes('6/5')) return [0, 2, 4, 5];
      if (item.includes('4/3')) return [0, 2, 3, 5];
      if (item.includes('2'))   return [0, 1, 3, 5];
      return [0, 2, 4, 6];
    }
    return [0];
  }

  function drawStructure(x, type, item, clef, skill, startY, currentKey = '0') {
    if (type === 'scales') return '';

    let svg = '';
    let baseStepY = 4;
    let offsets = getStepOffsets(type, item);
    
    if (skill === 'write') {
      offsets = [offsets[0]]; // במשימת כתיבה - מציגים רק את תו הבסיס
    }

    let yPositions = offsets.map(off => startY - (off * baseStepY));
    let minY = Math.min(...yPositions);
    let maxY = Math.max(...yPositions);

    // ציור סימני התק מוגדלים (+25%) על התווים עם היסט שמאלה למניעת חפיפה
    if (currentKey && currentKey !== '0') {
      const isSharp = currentKey.includes('d');
      const count = parseInt(currentKey) || 1;
      const symbol = isSharp ? '♯' : '♭';

      yPositions.forEach((y, i) => {
        if (i < count) {
          // העליון (אינדקס גבוה יותר) זז שמאלה יותר כדי לא לעלות על התחתון
          let shiftLeft = (yPositions.length - 1 - i) * 11;
          let accX = x - 15 - shiftLeft;
          svg += `<text x="${accX}" y="${y+6}" font-size="17" font-weight="bold" fill="#111">${symbol}</text>`;
        }
      });
    }

    yPositions.forEach((y, i) => {
      let offsetX = 0;
      if (i > 0 && Math.abs(yPositions[i] - yPositions[i-1]) === 4) {
        offsetX = 9.5;
      }

      let noteX = x + offsetX;
      svg += drawLedgerLines(noteX, y);
      svg += `<ellipse cx="${noteX}" cy="${y}" rx="5.5" ry="4" fill="#111" transform="rotate(-20 ${noteX} ${y})"/>`;
    });

    if (yPositions.length > 1) {
      svg += `<line x1="${x+5}" y1="${maxY}" x2="${x+5}" y2="${minY-26}" stroke="#111" stroke-width="1.5"/>`;
    }

    return svg;
  }

  function drawKeySignatureSVG(keyVal, clef, measureStartX) {
    if (!keyVal || keyVal === '0') return '';
    let svg = '';
    const isSharp = keyVal.includes('d');
    const count = parseInt(keyVal);

    let xStart = measureStartX + 42; 

    const sharpY_sol = [19, 31, 15, 27, 39, 23, 35]; 
    const flatY_sol  = [35, 23, 39, 27, 43, 31, 47];
    const sharpY_fa  = [27, 39, 23, 35, 47, 31, 43];
    const flatY_fa   = [43, 31, 47, 35, 51, 39, 55];

    const sharpY = (clef === 'fa') ? sharpY_fa : sharpY_sol;
    const flatY  = (clef === 'fa') ? flatY_fa  : flatY_sol;

    for (let k = 0; k < count; k++) {
      let x = xStart + (k * 10);
      let y = isSharp ? sharpY[k] : flatY[k];
      let symbol = isSharp ? '♯' : '♭';
      // סימני מפתח בסולמות הוגדלו גם הם ב-25%
      svg += `<text x="${x}" y="${y+6}" font-size="18" font-weight="bold" fill="#111">${symbol}</text>`;
    }
    return svg;
  }

  function drawStaffSVG(skill, type, clef, keysPool, items = []) {
    let svg = `<svg class="staff-svg" viewBox="0 0 750 95">`;
    
    for (let l = 0; l < 5; l++) {
      let y = 19 + l * 8;
      svg += `<line x1="20" y1="${y}" x2="730" y2="${y}" stroke="#333" stroke-width="1"/>`;
    }
    svg += `<line x1="20" y1="19" x2="20" y2="51" stroke="#333" stroke-width="2"/>`;
    svg += `<line x1="730" y1="19" x2="730" y2="51" stroke="#333" stroke-width="2"/>`;

    let stepX = 142;
    for (let i = 1; i < 5; i++) {
      let bx = 20 + i * stepX;
      svg += `<line x1="${bx-2}" y1="19" x2="${bx-2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
      svg += `<line x1="${bx+2}" y1="19" x2="${bx+2}" y2="51" stroke="#333" stroke-width="1.2"/>`;
    }

    const minYAllowed = 11;
    const maxYAllowed = 59;
    const baseStepY = 4;

    for (let i = 0; i < 5; i++) {
      let measureStartX = 20 + i * stepX;
      svg += getClefSVG(clef, measureStartX + 5);

      let currentKey = (keysPool && keysPool.length > 0) ? keysPool[Math.floor(Math.random() * keysPool.length)] : '0';

      if (type === 'scales' && skill === 'write') {
        // סולמות בכתיבה - חמשה ריקה
      } else if (type === 'scales') {
        svg += drawKeySignatureSVG(currentKey, clef, measureStartX);
      } else {
        let noteX = measureStartX + 85;

        let item = items[i] || '';
        let offsets = (skill === 'write') ? [0] : getStepOffsets(type, item);
        let maxOffset = Math.max(...offsets);

        let validBaseYs = [];
        for (let y = minYAllowed + (maxOffset * baseStepY); y <= maxYAllowed; y += 4) {
          validBaseYs.push(y);
        }

        let startY = validBaseYs.length > 0 
          ? validBaseYs[Math.floor(Math.random() * validBaseYs.length)] 
          : maxYAllowed;

        svg += drawStructure(noteX, type, item, clef, skill, startY, currentKey);
      }
    }

    svg += `</svg>`;
    return svg;
  }

  function generateSheet() {
    const studentContainer = document.getElementById('stavesContainer');
    studentContainer.innerHTML = '';

    const rows = document.querySelectorAll('.row-control');

    rows.forEach((row, idx) => {
      const id = row.id.split('_')[1];
      const type = document.getElementById(`type_${id}`).value;
      const skill = document.getElementById(`skill_${id}`).value;

      let clefsChecked = Array.from(document.querySelectorAll(`#clefs_${id} input:checked`)).map(cb => cb.value);
      if (clefsChecked.length === 0) clefsChecked = ['sol'];
      let clef = clefsChecked[Math.floor(Math.random() * clefsChecked.length)];

      let keysChecked = Array.from(document.querySelectorAll(`#keys_${id} input:checked`)).map(cb => cb.value);
      if (keysChecked.length === 0) keysChecked = KEY_SIGNATURES.map(k => k.val);

      let checkedBoxes = document.querySelectorAll(`#${type}_${id} input:checked`);
      let pool = Array.from(checkedBoxes).map(cb => cb.value);

      if (pool.length === 0) {
        if (type === 'intervals') pool = INTERVALS_LIST;
        else if (type === 'chords') pool = CHORDS_LIST;
        else if (type === 'septachords') pool = SEPTACHORDS_LIST;
        else if (type === 'scales') pool = SCALES_LIST;
      }

      let selectedItems = getDiverseSelection(pool, 5);
      let studentAnswersHTML = '';

      if (skill === 'id') {
        studentAnswersHTML = `
          <div class="answer-row">
            <div class="answer-cell">________</div>
            <div class="answer-cell">________</div>
            <div class="answer-cell">________</div>
            <div class="answer-cell">________</div>
            <div class="answer-cell">________</div>
          </div>`;
      } else {
        studentAnswersHTML = `
          <div class="answer-row">
            <div class="answer-cell">${selectedItems[0]}</div>
            <div class="answer-cell">${selectedItems[1]}</div>
            <div class="answer-cell">${selectedItems[2]}</div>
            <div class="answer-cell">${selectedItems[3]}</div>
            <div class="answer-cell">${selectedItems[4]}</div>
          </div>`;
      }

      let clefName = (clef === 'fa') ? 'מפתח פה' : 'מפתח סול';
      let typeLabel = (type === 'intervals') ? 'מרווחים הרמוניים' : (type === 'chords' ? 'אקורדים משולשים' : (type === 'septachords' ? 'ספטאקורדים' : 'סולמות'));
      let skillLabel = (skill === 'id') ? 'זהה/י' : 'כתוב/י';

      const staffDiv = document.createElement('div');
      staffDiv.className = 'staff-system';
      staffDiv.innerHTML = `
        <div class="exercise-title">${idx + 1}. הוראות: ${clefName} / ${skillLabel} ${typeLabel}</div>
        ${drawStaffSVG(skill, type, clef, keysChecked, selectedItems)}
        ${studentAnswersHTML}
      `;
      studentContainer.appendChild(staffDiv);
    });
  }

  async function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const element = document.getElementById('worksheet-a4');
    
    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF('p', 'mm', 'a4');
    pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
    pdf.save('music_theory_worksheet.pdf');
  }

  window.onclick = function(event) {
    if (!event.target.matches('.multi-select-btn') && !event.target.closest('.multi-select-dropdown')) {
      document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('show'));
    }
  }

  window.onload = () => {
    addRow();
    generateSheet();
  };
</script>

</body>
</html>
