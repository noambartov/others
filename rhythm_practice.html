---
# Jekyll ממלא כאן את זמן הבנייה, כדי ש-update-check.js יזהה עותק ישן מהמטמון
---
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="site-version" content="{{ site.time | date: \'%s\' }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>תרגול קצב</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="תורת המוזיקה">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="rewards.css?v={{ site.time | date: '%s' }}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600&display=swap');

    * { box-sizing: border-box; touch-action: manipulation; }
    html { height: 100%; }
    body {
      min-height: 100%; margin: 0; padding: 8px; background: #ffffff; color: #222222;
      font-family: 'Assistant', -apple-system, BlinkMacSystemFont, sans-serif; direction: rtl;
      display: flex; flex-direction: column;
    }
    button { font-family: inherit; }
    .container { max-width: 820px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }

    /* פס עליון: הגדרות מימין, ניקוד משמאל */
    .topbar { position: relative; border-bottom: 1px solid #eeeeee; padding: 10px 0; min-height: 22px; }
    .topscore { position: absolute; left: 0; top: 10px; font-size: 15px; color: #999999; }
    details summary { color: #555555; font-weight: 500; font-size: 15px; list-style: none; display: inline-block; cursor: pointer; }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary { color: #222222; }
    .settings { display: flex; flex-direction: column; gap: 14px; padding: 14px 0 6px; }
    .setting label { display: block; font-size: 13px; color: #999999; margin-bottom: 6px; }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .seg button { font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; background: #ffffff; border: 1px solid #e6e6e6; color: #999999; }
    .seg button.active { background: #e6e6e6; border-color: #e6e6e6; color: #222222; }

    /* סוגי התרגיל */
    .ex-types { display: flex; justify-content: center; gap: 18px; padding: 12px 0 2px; white-space: nowrap; }
    .ex-types button { background: none; border: none; padding: 2px 0; font-size: 15px; color: #999999; cursor: pointer; transition: color .15s; }
    .ex-types button:hover, .ex-types button.active { color: #222222; }
    .level-line { text-align: center; font-size: 13px; color: #999999; padding-top: 4px; }
    .level-line button { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .level-line button:hover { color: #222222; }

    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 20px 0 10px; }
    .prompt { text-align: center; font-size: 14px; color: #999999; min-height: 20px; }

    .big-play-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .big-play {
      width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer; background: #222222; color: #ffffff;
      display: flex; align-items: center; justify-content: center; padding-inline-start: 6px; direction: ltr;
    }
    .big-play:hover { background: #000000; }
    .big-play:active { transform: scale(0.96); }

    .score-view { color: #222222; padding: 6px 0; display: flex; flex-direction: column; gap: 10px; }

    /* אפשרויות: אריחים אפורים כמו בתרגול השמיעה */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tiles.symbols { grid-template-columns: repeat(4, 1fr); max-width: 520px; width: 100%; margin: 0 auto; }
    .tile {
      background: #efefef; color: #222222; border: none; border-radius: 6px; cursor: pointer;
      padding: 14px 10px 8px; display: flex; align-items: center; justify-content: center; min-height: 92px;
    }
    .tile:hover { background: #e2e2e2; }
    .tile.correct, .tile.correct:hover { background: #222222; color: #ffffff; }
    .tile.wrong, .tile.wrong:hover { background: #ffffff; color: #c4c4c4; box-shadow: inset 0 0 0 1px #eeeeee; }
    .tile.done { cursor: default; }
    .tile.hint-out { opacity: 0.3; pointer-events: none; }
    .tile.done.playable { cursor: pointer; }
    .tiles.symbols .tile { min-height: 84px; padding: 8px; }

    /* משטח ההקשה */
    .tap-pad {
      width: 100%; height: 130px; border: none; border-radius: 10px; background: #efefef; color: #999999;
      font-size: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      transition: background .06s;
    }
    .tap-pad.hit { background: #dcdcdc; }
    .tap-pad.live { color: #222222; }
    .count { text-align: center; font-size: 34px; font-weight: 400; color: #222222; min-height: 44px; line-height: 44px; }
    .count.muted { color: #bbbbbb; }
    .summary { text-align: center; font-size: 15px; line-height: 1.7; color: #555555; }
    .summary strong { font-weight: 600; color: #222222; }
    .legend { text-align: center; font-size: 13px; color: #999999; }

    .action-bar { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; padding: 8px 0 4px; }
    .action-bar button { background: none; border: none; padding: 2px 0; font-size: 15px; font-weight: 500; color: #777777; cursor: pointer; }
    .action-bar button:hover { color: #222222; }
    .action-bar button.primary { color: #222222; }
    .action-bar button[hidden] { display: none; }


    /* מראה האתר: גלולות עם מסגרת דקה כמו בדף הבית */
    .page-title { font-weight: 300; font-size: 36px; text-align: center; margin: 26px 0 0; color: #111111; }
    body.in-rewards .page-title { display: none; }
    .ex-types { gap: 6px; padding-top: 14px; flex-wrap: wrap; }
    .ex-types button { border: 1px solid #e3e3e3; border-radius: 999px; padding: 5px 14px; font-size: 14px; color: #888888; }
    .ex-types button:hover { color: #222222; border-color: #c8c8c8; }
    .ex-types button.active { background: #333333; border-color: #333333; color: #ffffff; }
    .big-play { background: #ffffff; color: #222222; border: 1px solid #d1d5db; }
    .big-play:hover { background: #f5f5f5; border-color: #9ca3af; }
    .tile { background: #ffffff; border: 1px solid #d1d5db; border-radius: 18px; }
    .tile:hover { background: #f5f5f5; border-color: #9ca3af; }
    .tile.correct, .tile.correct:hover { background: #333333; border-color: #333333; color: #ffffff; }
    .tile.wrong, .tile.wrong:hover { background: #ffffff; border-color: #eeeeee; box-shadow: none; }
    .tap-pad { background: #ffffff; border: 1px solid #d1d5db; border-radius: 24px; }
    .tap-pad.hit { background: #f0f0f0; }
    .action-bar { gap: 8px; }
    .action-bar button { border: 1px solid #e3e3e3; border-radius: 999px; padding: 6px 16px; font-weight: 400; }
    .action-bar button:hover { border-color: #c8c8c8; }
    .action-bar button.primary { border-color: #9ca3af; }

    /* חופשי / לפי שלבים, באמצע הסרגל העליון כמו בתרגול השמיעה */
    .mode-tabs { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 18px; white-space: nowrap; }
    .mode-tabs button { background: none; border: none; padding: 2px 0; font: inherit; font-size: 15px; color: #999999; cursor: pointer; transition: color .15s; }
    .mode-tabs button:hover, .mode-tabs button.active { color: #222222; }
    body.mode-train .no-train { display: none !important; }
    body.mode-train #kindRow, body.mode-train:not(.in-session) .level-line,
    body.mode-train:not(.in-session) #stage, body.mode-train:not(.in-session) #actions { display: none; }
    body.mode-train .page-title { display: none; }
    body:not(.in-session) .train-only { display: none !important; }
    .level-line .train-end { margin-inline-start: 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #dddddd; }
    .training-panel { text-align: right; padding: 28px 0 24px; }
    .training-panel[hidden] { display: none; }
    .training-panel h2 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
    .training-panel .sub { color: #999999; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
    .level-list { display: grid; gap: 8px; }
    .level-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #ffffff; border: 1px solid #d1d5db; border-radius: 14px; padding: 14px 16px;
      font: inherit; text-align: right; cursor: pointer; color: #222222;
    }
    .level-item:hover { background: #f5f5f5; border-color: #9ca3af; }
    .level-item .lv-name { font-size: 16px; font-weight: 500; }
    .level-item .lv-desc { font-size: 13px; color: #999999; margin-top: 2px; }
    .level-item .lv-best { font-size: 13px; color: #999999; white-space: nowrap; }
    .report-score { font-size: 44px; font-weight: 300; margin: 8px 0 0; }
    .report-section { margin-top: 26px; }
    .report-section h3 { font-size: 13px; font-weight: 400; color: #999999; margin: 0 0 10px; border-bottom: 1px solid #eeeeee; padding-bottom: 6px; }
    .report-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; align-items: center; gap: 12px; font-size: 14px; padding: 5px 0; }
    .report-bar { height: 6px; background: #efefef; border-radius: 3px; overflow: hidden; }
    .report-bar > span { display: block; height: 100%; background: #333333; }
    .report-row .num { color: #999999; text-align: left; font-size: 13px; }
    .report-advice { font-size: 15px; line-height: 1.6; margin: 0; }
    .report-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
    .report-actions button { border: 1px solid #e3e3e3; border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 15px; cursor: pointer; background: #ffffff; color: #555555; }
    .report-actions button:hover { border-color: #c8c8c8; color: #222222; }
    .report-actions button.primary { background: #333333; border-color: #333333; color: #ffffff; }

    footer { text-align: center; font-size: 13px; color: #aaaaaa; padding: 24px 16px 8px; }
    footer a { color: #888888; text-decoration: none; }

    @media (max-width: 560px) {
      .tiles { grid-template-columns: 1fr; }
      .tiles.symbols { grid-template-columns: repeat(4, 1fr); }
      .tile { min-height: 78px; }
      .page-title { display: none; }
      .tap-pad { font-size: 15px; }
      .big-play { width: 84px; height: 84px; }
      .tap-pad { height: 150px; }
      .mode-tabs { gap: 12px; }
      .mode-tabs button { font-size: 14px; }
    }
  </style>
</head>
<body data-section="rhythm">

<div class="container">
  <div class="topbar">
    <span class="topscore" id="score">0 מתוך 0</span>
    <button class="reward-chip" id="rewardChip" onclick="Rewards.open()" aria-label="האוסף שלי"><span class="chip-row"><span class="chip-label">היום</span> <span class="chip-num">0/20</span></span><span class="chip-bar"><span></span></span></button>
    <nav class="mode-tabs" id="modeTabs">
      <button data-mode="free" onclick="setMode('free')">חופשי</button>
      <button data-mode="train" onclick="setMode('train')">לפי שלבים</button>
    </nav>
    <details id="settingsBox">
      <summary>הגדרות</summary>
      <div class="settings">
        <div class="setting no-train"><label>שלב</label><div class="seg" id="levelSeg"></div></div>
        <div class="setting no-train"><label>מרכיבים (אפשר לבחור כמה)</label><div class="seg" id="partsSeg"></div></div>
        <div class="setting no-train"><label>מהירות (פעמות לדקה)</label><div class="seg" id="tempoSeg"></div></div>
        <div class="setting"><label>הברות ספירה (קונוקול) מתחת לתווים</label><div class="seg" id="sylSeg"></div></div>
        <div class="setting" id="metroSetting"><label>מטרונום בזמן ההשמעה</label><div class="seg" id="metroSeg"></div></div>
      </div>
    </details>
  </div>

  <h1 class="page-title">תרגול קצב</h1>

  <nav class="ex-types" id="kindRow">
    <button data-kind="dictation">הכתבה</button>
    <button data-kind="tap">קריאה והקשה</button>
    <button data-kind="complete">השלמת תיבה</button>
  </nav>
  <div class="level-line"><button id="levelLine" onclick="openSettings()"></button><button class="train-only train-end" onclick="endTraining()">סיום אימון</button></div>

  <div class="training-panel" id="trainingPanel" hidden></div>

  <div class="stage" id="stage"></div>

  <div class="action-bar" id="actions"></div>

  <div class="rewards-panel" id="rewardsPanel" style="display: none;"></div>

  <footer>
    נעם ברטוב <a href="https://noambartov.com" target="_blank" rel="noopener noreferrer">noambartov.com</a>
  </footer>
</div>

<script src="site-nav.js"></script>
<script src="rhythm-core.js"></script>
<script src="theory-core.js"></script>
<script src="rewards.js?v={{ site.time | date: '%s' }}"></script>
<script>
const R = window.RhythmCore;
const PLAY_ICON = '<svg viewBox="0 0 24 24" width="36" height="36"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
const KINDS = ['dictation', 'tap', 'complete'];
const TEMPOS = [60, 70, 80, 90, 100, 110, 120];
const SETTINGS_KEY = 'mt_rhythm_settings';

const state = { kind: 'dictation', level: 1, tempo: 60, parts: R.DEFAULT_PARTS.slice(), metro: true, syllables: false, right: 0, total: 0 };
let cur = null; // התרגיל הנוכחי

// ===== הגדרות =====
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if (KINDS.includes(s.kind)) state.kind = s.kind;
    if (s.level >= 1 && s.level <= R.LEVELS.length) state.level = s.level;
    if (TEMPOS.includes(s.tempo)) state.tempo = s.tempo;
    if (Array.isArray(s.parts)) state.parts = R.normParts(s.parts);
    if (typeof s.metro === 'boolean') state.metro = s.metro;
    if (typeof s.syllables === 'boolean') state.syllables = s.syllables;
  } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (KINDS.includes(q.get('ex'))) state.kind = q.get('ex');
  const lv = parseInt(q.get('level'), 10);
  if (lv >= 1 && lv <= R.LEVELS.length) { state.level = lv; state.tempo = R.LEVELS[lv - 1].tempo; }
  if (q.get('parts')) state.parts = R.normParts(q.get('parts').split(','));
  const tp = parseInt(q.get('tempo'), 10);
  if (TEMPOS.includes(tp)) state.tempo = tp;
}
function saveSettings() {
  // באימון השלב קובע רמה, מרכיבים, טמפו וסוג; נשמרות ההגדרות של התרגול החופשי
  const b = training ? training.saved : state;
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ kind: b.kind, level: b.level, tempo: b.tempo, parts: b.parts, metro: state.metro, syllables: state.syllables })); } catch (e) {}
}

function seg(id, items, current, onPick) {
  const el = document.getElementById(id);
  el.innerHTML = items.map(([v, label]) => `<button data-v="${v}" class="${String(v) === String(current) ? 'active' : ''}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => onPick(b.dataset.v));
}

function renderSettings() {
  // שינוי רמה מחזיר את הטמפו ההתחלתי שלה (ואפשר לשנות אחר כך)
  seg('levelSeg', R.LEVELS.map(l => [l.n, `${l.n}. ${l.name}`]), state.level, v => { state.level = +v; state.tempo = R.LEVELS[state.level - 1].tempo; changed(); });
  // מרכיבים: בחירה מרובה. חייב להישאר לפחות ערך רגיל אחד (טריולות או קשתות לבד לא מספיקות)
  const pEl = document.getElementById('partsSeg');
  pEl.innerHTML = R.PARTS.map(p => `<button data-v="${p.id}" class="${state.parts.includes(p.id) ? 'active' : ''}" aria-pressed="${state.parts.includes(p.id)}">${p.name}</button>`).join('');
  pEl.querySelectorAll('button').forEach(b => b.onclick = () => {
    const id = b.dataset.v;
    const next = state.parts.includes(id) ? state.parts.filter(p => p !== id) : state.parts.concat([id]);
    if (!next.some(p => ['h', 'q', '8', '16'].includes(p))) return;
    state.parts = R.normParts(next);
    changed();
  });
  seg('tempoSeg', TEMPOS.map(t => [t, t]), state.tempo, v => { state.tempo = +v; changed(false); });
  seg('metroSeg', [['1', 'עם'], ['0', 'בלי']], state.metro ? '1' : '0', v => { state.metro = v === '1'; changed(false); });
  seg('sylSeg', [['1', 'להציג'], ['0', 'לא להציג']], state.syllables ? '1' : '0', v => { state.syllables = v === '1'; changed(false); rerender(); });
  document.getElementById('metroSetting').style.display = state.kind === 'tap' ? 'none' : '';
  document.querySelectorAll('#kindRow button').forEach(b => b.classList.toggle('active', b.dataset.kind === state.kind));
  const L = R.LEVELS[state.level - 1];
  const names = R.PARTS.filter(p => state.parts.includes(p.id)).map(p => p.name).join(', ');
  document.getElementById('levelLine').innerHTML = training
    ? `שלב ${training.step + 1}: ${R.STEPS[training.step].desc} · ${KIND_NAMES[state.kind]} · ${state.tempo} לדקה`
    : `רמה ${L.n}: ${L.name} · ${names} · ${state.tempo} לדקה`;
  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === appMode));
}

// מתג ההברות: מציירים מחדש את התרגיל הנוכחי בלי להחליף אותו
function rerender() {
  if (!cur) return;
  if (cur.kind === 'tap') { if (!tapRun) renderTap(cur.result || undefined); return; }
  if (cur.kind === 'complete') {
    const bar = document.getElementById('bar');
    if (bar) bar.innerHTML = cur.answered ? bigScore(cur.c.ex, cur.hint ? { beatNumbers: true } : {})
      : bigScore(cur.c.ex, Object.assign({ missing: cur.c.missing }, cur.hint ? { beatNumbers: true } : {}));
    return;
  }
  const svgs = sameScale(cur.d.options, { scale: 1.25, counts: state.syllables });
  document.querySelectorAll('#tiles .tile').forEach((t, i) => { t.innerHTML = svgs[i]; });
}

function changed(regenerate = true) {
  saveSettings();
  renderSettings();
  if (regenerate) newExercise(false);
}

function openSettings() {
  const d = document.getElementById('settingsBox');
  d.open = true;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('#kindRow button').forEach(b => b.onclick = () => {
  if (state.kind === b.dataset.kind) return;
  state.kind = b.dataset.kind;
  changed();
});

function updateScore() {
  document.getElementById('score').textContent = training
    ? `${Math.min(training.index + 1, training.plan.length)} מתוך ${training.plan.length}`
    : `${state.right} מתוך ${state.total}`;
}
function count(ok) {
  if (cur.counted) return;
  // מערכת התגמולים: התשובה הראשונה בכל תרגיל נספרת במיומנות הקצב (rewards.js)
  if (window.Rewards) {
    const unlocked = Rewards.solved(ok, 'rhythm:' + cur.kind);
    if (unlocked.length) {
      // שיר חדש נפתח: עוצרים, מציגים אותו, ואחרי הסגירה ממשיכים לתרגיל הבא אם היה אמור לעבור
      const ex = cur;
      setTimeout(() => {
        if (cur !== ex) return;
        stopAll();
        Rewards.showUnlock(unlocked, () => { if (cur === ex && ex.nextOnResume) ex.nextOnResume(); });
      }, 1200);
    }
  }
  cur.counted = true;
  if (training) recordResult(ok);
  state.total++;
  if (ok) state.right++;
  updateScore();
}

// ===== שמע =====
let audioCtx = null, audioStale = false, master = null;
let scheduled = [];
let timers = [];

function setPlaybackSession() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
}
function getAudioContext() {
  if (audioCtx && (audioStale || audioCtx.state === 'closed')) {
    const old = audioCtx;
    audioCtx = null; master = null;
    try { old.close(); } catch (e) {}
  }
  audioStale = false;
  if (!audioCtx) {
    setPlaybackSession();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0.9;
    master.connect(audioCtx.destination);
    // באייפון הקשר נפתח רק כשמשמיעים בו משהו בתוך לחיצה
    try {
      const src = audioCtx.createBufferSource();
      src.buffer = audioCtx.createBuffer(1, 1, 22050);
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
  }
  if (audioCtx.state !== 'running') {
    const p = audioCtx.resume();
    if (p && p.catch) p.catch(() => {});
  }
  return audioCtx;
}
setPlaybackSession();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopAll(); if (audioCtx) audioStale = true; }
  else setPlaybackSession();
});
window.addEventListener('pagehide', () => { stopAll(); if (audioCtx) audioStale = true; });

function stopAll() {
  scheduled.forEach(n => { try { n.stop(); } catch (e) {} });
  scheduled = [];
  timers.forEach(clearTimeout);
  timers = [];
  if (tapRun) tapRun = null;
}

function env(ctx, t, peak, attack, hold, release) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  if (hold > 0) g.gain.setValueAtTime(peak, t + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  g.connect(master);
  return g;
}

// מקל מטרונום: צליל קצר, הפעמה הראשונה בתיבה גבוהה יותר
function click(t, kind, vol = 1) {
  const ctx = audioCtx;
  const freq = kind === 'accent' ? 1760 : kind === 'sub' ? 1180 : 1320;
  const peak = (kind === 'sub' ? 0.12 : kind === 'accent' ? 0.42 : 0.3) * vol;
  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.value = freq;
  o.connect(env(ctx, t, peak, 0.002, 0, 0.045));
  o.start(t); o.stop(t + 0.06);
  scheduled.push(o);
}

// צליל הקצב: מוחזק לאורך כל המשך, כדי שישמעו את ההבדל בין חצי לרבע והפסקה
function tone(t, dur, vol = 1) {
  // צליל רך: סינוס על סול 4 עם שלוש הרמוניות חלשות, מוחזק לאורך המשך (נבחר מהדוגמאות, 12)
  const ctx = audioCtx;
  const len = Math.max(0.06, dur * 0.88 - 0.02);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35 * vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.22 * vol, t + Math.min(0.15, len));
  g.gain.setValueAtTime(0.22 * vol, t + len);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.06);
  g.connect(master);
  [[392, 1], [784, 0.18], [1176, 0.07], [1568, 0.03]].forEach(([f, a]) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const og = ctx.createGain(); og.gain.value = a;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + len + 0.08);
    scheduled.push(o);
  });
}

function tapSound(t) {
  const ctx = audioCtx;
  const o = ctx.createOscillator();
  o.type = 'triangle'; o.frequency.value = 880;
  o.connect(env(ctx, t, 0.25, 0.002, 0, 0.05));
  o.start(t); o.stop(t + 0.07);
}

// פעמות המטרונום מ-t0, לאורך bars תיבות. במשקל מורכב, או כשמבקשים חלוקה, גם צליל חלש בין הפעמות
// במשקל אי-זוגי (5/8, 7/8) הפעמות לא שוות, ותמיד נשמעות גם השמיניות
function metronome(ex, t0, bars, vol, tempo = state.tempo, subdivide = false) {
  const m = R.METERS[ex.meter];
  const bt = R.beatTimes(ex.meter, tempo);
  const bar = R.barSeconds(ex, tempo);
  for (let b = 0; b < bars; b++) {
    bt.forEach((off, i) => {
      const t = t0 + b * bar + off;
      const len = m.groups[i] * 60 / tempo / m.beatTicks;
      click(t, i === 0 ? 'accent' : 'beat', vol);
      if (m.groups[i] === 18) { click(t + len / 3, 'sub', vol); click(t + len * 2 / 3, 'sub', vol); }
      else if (subdivide || m.odd) click(t + len / 2, 'sub', vol * (subdivide ? 1.6 : 1));
    });
  }
}

// השמעת תרגיל: תיבת ספירה ואז הקצב. מחזיר את זמן ההתחלה של הקצב
function playExercise(ex, { countIn = true, metro = state.metro, onEnd, tempo = state.tempo, subdivide = false } = {}) {
  stopAll();
  const ctx = getAudioContext();
  const t0 = ctx.currentTime + 0.12;
  const bar = R.barSeconds(ex, tempo);
  const start = countIn ? t0 + bar : t0;
  if (countIn) metronome(ex, t0, 1, 1, tempo, subdivide);
  if (metro) metronome(ex, start, ex.bars.length, subdivide ? 0.7 : 0.45, tempo, subdivide);
  R.timeline(ex, tempo).forEach(n => { if (!n.rest) tone(start + n.start, n.dur); });
  const end = start + bar * ex.bars.length;
  if (countIn) countDisplay(ex, t0, tempo);
  if (onEnd) timers.push(setTimeout(onEnd, (end - ctx.currentTime) * 1000));
  return start;
}

// ספירה על המסך בזמן תיבת הספירה
function countDisplay(ex, t0, tempo = state.tempo) {
  const el = document.getElementById('count');
  if (!el) return;
  const bt = R.beatTimes(ex.meter, tempo).concat([R.barSeconds(ex, tempo)]);
  const nb = bt.length - 1;
  for (let i = 0; i <= nb; i++) {
    const ms = (t0 + bt[i] - audioCtx.currentTime) * 1000;
    timers.push(setTimeout(() => {
      el.textContent = i < nb ? String(i + 1) : '';
      el.classList.toggle('muted', false);
    }, Math.max(0, ms)));
  }
}

const SLOW = 0.75;          // רמז "לאט יותר": שלושה רבעים מהמהירות
const NEXT_DELAY = 1500;    // אחרי תשובה נכונה, כמו בתרגול השמיעה

// ===== תרגילים =====
function newExercise(autoplay) {
  stopAll();
  if (state.kind === 'dictation') newDictation(autoplay);
  else if (state.kind === 'tap') newTap();
  else newComplete();
}

function goNext() { if (training) trainingNext(true); else newExercise(true); }
function goNextQuiet() { if (training) trainingNext(false); else newExercise(false); }
function scheduleNext(ms = NEXT_DELAY, fn = goNext) {
  cur.nextOnResume = fn;
  timers.push(setTimeout(fn, ms));
}

function actions(list) {
  const el = document.getElementById('actions');
  el.innerHTML = '';
  list.forEach(([label, fn, cls]) => {
    if (!label) return;
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = fn;
    el.appendChild(b);
  });
}

// עזרה מדורגת: עזרה ← רמז נוסף ← תשובה. תרגיל שנעזרו בו לא נספר כנכון
const HELP_LABELS = ['עזרה', 'רמז נוסף', 'תשובה'];
function helpAction(steps) {
  if (cur.answered || cur.hint >= steps) return [null];
  return [HELP_LABELS[Math.min(cur.hint, 2)], () => { cur.helped = true; cur.hint++; applyHint(); }];
}
function applyHint() {
  if (cur.kind === 'dictation') dictationHint();
  else if (cur.kind === 'tap') tapHint();
  else completeHint();
}

function scoreSvg(ex, opts) {
  return R.svgFor(ex, Object.assign({ line: '#9a9a9a' }, opts));
}

// תווים גדולים: בטלפון התיבות נשברות לשורות כדי שהתווים לא יהיו זעירים
function bigScore(ex, opts) {
  const avail = Math.min(820, document.querySelector('.container').clientWidth || 820);
  const maxNatural = avail < 600 ? avail / 0.95 : avail / 1.1;
  return R.svgLines(ex, Object.assign({ line: '#9a9a9a', scale: 1.7, counts: state.syllables }, opts), maxNatural);
}

// כמה אפשרויות באותו קנה מידה
function sameScale(list, opts) {
  const W = Math.max(...list.map(ex => R.naturalWidth(ex, opts)));
  return list.map(ex => scoreSvg(ex, Object.assign({ boxWidth: W }, opts)));
}

function setPrompt(s) { const el = document.getElementById('prompt'); if (el) el.textContent = s; }

// --- הכתבה ---
function newDictation(autoplay) {
  const d = R.dictation(state.level, null, state.parts, stepMeter());
  cur = { kind: 'dictation', d, answered: false, counted: false, hint: 0, helped: false, slow: false };
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="big-play-wrap"><button class="big-play" id="bigPlay" aria-label="השמע">${PLAY_ICON}</button><div class="count muted" id="count"></div></div>
    <div class="prompt" id="prompt">מה שמעתם? אחרי תיבת ספירה אחת מתחיל הקצב</div>
    <div class="tiles" id="tiles">${sameScale(d.options, { scale: 1.25, counts: state.syllables }).map((svg, i) => `<button class="tile" data-i="${i}">${svg}</button>`).join('')}</div>`;
  document.getElementById('bigPlay').onclick = playDictation;
  stage.querySelectorAll('.tile').forEach(t => t.onclick = () => pickDictation(+t.dataset.i, t));
  dictationActions();
  if (autoplay) playDictation();
}

function playDictation() {
  const d = cur.d;
  if (cur.slow) playExercise(d.answer, { tempo: Math.round(state.tempo * SLOW), metro: true, subdivide: true });
  else playExercise(d.answer);
}

function dictationActions() {
  actions([['השמע שוב', playDictation], helpAction(3), ['לתרגיל הבא', goNext, 'primary']]);
}

function dictationHint() {
  const d = cur.d;
  const tiles = [...document.querySelectorAll('#tiles .tile')];
  if (cur.hint === 1) {
    cur.slow = true;
    setPrompt('לאט יותר, והמטרונום מכה גם את החלוקה');
    playDictation();
  } else if (cur.hint === 2) {
    // נשארות שתי אפשרויות: הנכונה ועוד אחת
    const wrong = tiles.filter((t, i) => i !== d.correct && !t.classList.contains('wrong'));
    const keep = wrong[Math.floor(Math.random() * wrong.length)];
    tiles.forEach((t, i) => { if (i !== d.correct && t !== keep) t.classList.add('hint-out'); });
    setPrompt('נשארו שתי אפשרויות');
  } else {
    revealDictation();
  }
  dictationActions();
}

function revealDictation() {
  const d = cur.d;
  count(false);
  cur.answered = true;
  const tiles = [...document.querySelectorAll('#tiles .tile')];
  tiles.forEach(t => { t.classList.remove('hint-out'); t.classList.add('done', 'playable'); });
  tiles[d.correct].classList.add('correct');
  setPrompt('זו התשובה. אפשר ללחוץ על כל תיבה כדי לשמוע אותה');
  dictationActions();
  playDictation();
}

function pickDictation(i, el) {
  const d = cur.d;
  if (cur.answered) { playExercise(d.options[i], { countIn: false }); return; }
  if (el.classList.contains('wrong') || el.classList.contains('hint-out')) return;
  if (i === d.correct) {
    count(!cur.helped);
    cur.answered = true;
    el.classList.add('correct');
    document.querySelectorAll('#tiles .tile').forEach(t => { t.classList.remove('hint-out'); t.classList.add('done', 'playable'); });
    setPrompt('נכון');
    dictationActions();
    scheduleNext();
  } else {
    count(false);
    el.classList.add('wrong');
    setPrompt('לא זה. אפשר להשמיע שוב');
  }
}

// --- השלמת תיבה ---
function newComplete() {
  const c = R.completion(state.level, null, state.parts, stepMeter());
  cur = { kind: 'complete', c, answered: false, counted: false, hint: 0, helped: false };
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="score-view" id="bar">${bigScore(c.ex, { missing: c.missing })}</div>
    <div class="count muted" id="count"></div>
    <div class="prompt" id="prompt">איזה סימן משלים את התיבה?</div>
    <div class="tiles symbols" id="tiles">${c.options.map((s, i) => `<button class="tile" data-i="${i}" aria-label="${s}">${R.symbolSvg(s, { height: 62 })}</button>`).join('')}</div>`;
  stage.querySelectorAll('.tile').forEach(t => t.onclick = () => pickComplete(+t.dataset.i, t));
  completeActions();
}

function completeActions() {
  const c = cur.c;
  actions([cur.answered ? ['השמע', () => playExercise(c.ex)] : [null], helpAction(3), ['לתרגיל הבא', goNext, 'primary']]);
}

// כמה חסר, במילים: בפעמות, ובמשקל מורכב בשמיניות
function missingText(c) {
  const m = R.METERS[c.ex.meter];
  const ticks = R.symbolTicks(c.answer);
  const words = { 0.25: 'רבע פעמה', 0.5: 'חצי פעמה', 0.75: 'שלושה רבעים של פעמה', 1: 'פעמה אחת', 1.5: 'פעמה וחצי', 2: 'שתי פעמות', 3: 'שלוש פעמות', 4: 'ארבע פעמות' };
  if (m.compound || m.odd) {
    const e = ticks / 6;
    const w = { 0.5: 'חצי שמינית', 1: 'שמינית אחת', 1.5: 'שמינית וחצי', 2: 'שתי שמיניות', 3: 'שלוש שמיניות', 6: 'שש שמיניות' }[e];
    return w ? `חסרות ${w}`.replace('חסרות שמינית אחת', 'חסרה שמינית אחת').replace('חסרות חצי', 'חסרה חצי').replace('חסרות שמינית וחצי', 'חסרה שמינית וחצי') : '';
  }
  const w = words[ticks / m.beatTicks];
  if (!w) return '';
  return (/^(שתי|שלוש|ארבע)/.test(w) ? 'חסרות ' : 'חסרה ') + w;
}

function completeHint() {
  const c = cur.c;
  if (cur.hint === 1) {
    document.getElementById('bar').innerHTML = bigScore(c.ex, { missing: c.missing, beatNumbers: true });
    setPrompt('מספרי הפעמות מתחת לתיבה. איזו פעמה לא מלאה?');
  } else if (cur.hint === 2) {
    setPrompt(missingText(c) || 'כמה חסר כדי למלא את התיבה?');
  } else {
    count(false);
    showCompleteAnswer(false);
    return;
  }
  completeActions();
}

function showCompleteAnswer(right) {
  const c = cur.c;
  cur.answered = true;
  const tiles = [...document.querySelectorAll('#tiles .tile')];
  tiles.forEach(t => t.classList.add('done'));
  tiles[c.correct].classList.add('correct');
  document.getElementById('bar').innerHTML = bigScore(c.ex, cur.hint ? { beatNumbers: true } : {});
  setPrompt(`${right ? 'נכון: ' : 'התשובה: '}${symbolName(c.answer)}`);
  completeActions();
  // התיבה המלאה מתנגנת, ואחרי תשובה נכונה עוברים לתרגיל הבא
  if (right) cur.nextOnResume = goNext;
  playExercise(c.ex, { countIn: true, onEnd: right ? () => scheduleNext(600) : null });
}

function pickComplete(i, el) {
  const c = cur.c;
  if (cur.answered || el.classList.contains('wrong')) return;
  if (i === c.correct) {
    count(!cur.helped);
    showCompleteAnswer(true);
  } else {
    count(false);
    el.classList.add('wrong');
    setPrompt('הסימן הזה לא משלים את התיבה. כמה פעמות חסרות?');
  }
}

function symbolName(sym) {
  const rest = sym[0] === 'R';
  const t = rest ? sym.slice(1) : sym;
  const dotted = t.endsWith('.');
  const base = { w: 'שלם', h: 'חצי', q: 'רבע', '8': 'שמינית', '16': 'שש-עשרית' }[dotted ? t.slice(0, -1) : t];
  const fem = base === 'שמינית' || base === 'שש-עשרית';
  return (rest ? 'הפסקת ' + base : base) + (dotted ? (rest || fem ? ' מנוקדת' : ' מנוקד') : '');
}

// --- קריאה והקשה ---
let tapRun = null;

function newTap() {
  const ex = R.generate(state.level, 'tap', null, stepMeter(), state.parts);
  cur = { kind: 'tap', ex, counted: false, hint: 0, helped: false, counts: false, guided: false };
  renderTap();
}

function tapTempo() { return cur.guided ? Math.round(state.tempo * SLOW) : state.tempo; }
function playTapExample() { playExercise(cur.ex, { metro: true, tempo: tapTempo() }); }

function renderTap(result) {
  const ex = cur.ex;
  const stage = document.getElementById('stage');
  const marks = result ? result.errors.map(err => ({ err, good: result.good })) : null;
  const noteStyle = result ? result.errors.map(err => ({ color: err !== null && Math.abs(err) <= result.good ? null : '#a8a8a8' })) : null;
  const intro = cur.guided
    ? 'ניסיון איטי: הקצב מתנגן חלש, ומקישים יחד איתו'
    : 'לחצו "התחל". אחרי תיבת ספירה אחת מקישים את הקצב עם המטרונום';
  stage.innerHTML = `
    <div class="score-view">${bigScore(ex, { marks, noteStyle, counts: cur.counts || state.syllables })}</div>
    ${result ? summaryHtml(result) : `<div class="prompt" id="prompt">${intro}</div><div class="count muted" id="count"></div>`}
    ${result ? '' : `<button class="tap-pad" id="tapPad">הקישו כאן את הקצב, או במקש רווח</button>`}`;
  if (!result) {
    const pad = document.getElementById('tapPad');
    pad.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e); });
  }
  cur.result = result || null;
  tapActions();
}

function tapActions() {
  const help = cur.hint < 3 ? [HELP_LABELS[cur.hint] === 'תשובה' ? 'ניסיון איטי' : HELP_LABELS[cur.hint], () => { cur.helped = true; cur.hint++; applyHint(); }] : [null];
  actions(cur.result
    ? [['נסו שוב', () => { renderTap(); startTap(); }, 'primary'], ['השמע איך זה נשמע', playTapExample], help, ['לתרגיל הבא', goNextQuiet]]
    : [['התחל', startTap, 'primary'], ['השמע איך זה נשמע', playTapExample], help, ['לתרגיל הבא', goNextQuiet]]);
}

function tapHint() {
  if (cur.hint === 1) {
    if (cur.result) renderTap();
    setPrompt('כך זה נשמע. אחר כך לחצו "התחל"');
    playTapExample();
  } else if (cur.hint === 2) {
    cur.counts = true;
    renderTap();
    setPrompt('הספירה מתחת לתווים. ספרו בקול והקישו על התווים');
  } else {
    cur.guided = true;
    renderTap();
  }
  tapActions();
}

function summaryHtml(res) {
  const n = res.errors.length;
  const parts = [];
  if (res.early) parts.push(`מוקדם: ${res.early}`);
  if (res.late) parts.push(`מאוחר: ${res.late}`);
  if (res.missed) parts.push(`לא הוקשו: ${res.missed}`);
  if (res.extra) parts.push(`הקשות מיותרות: ${res.extra}`);
  const head = res.perfect ? '<strong>מדויק. כל התווים בזמן</strong>' : res.passed ? `<strong>טוב מאוד: ${res.onTime} מתוך ${n} בזמן</strong>` : `<strong>${res.onTime} מתוך ${n} בזמן</strong>`;
  return `<div class="summary">${head}${parts.length ? '<br>' + parts.join(' · ') : ''}</div>
    <div class="legend">הנקודה מתחת לתו: משמאל לקו = מוקדם, מימין = מאוחר. עיגול ריק = לא הוקש</div>`;
}

function startTap() {
  stopAll();
  const ex = cur.ex;
  const tempo = tapTempo();
  const ctx = getAudioContext();
  const t0 = ctx.currentTime + 0.15;
  const bar = R.barSeconds(ex, tempo);
  const start = t0 + bar;
  metronome(ex, t0, 1 + ex.bars.length, 1, tempo);
  // בניסיון האיטי הקצב עצמו מתנגן חלש, להקיש יחד איתו
  if (cur.guided) R.timeline(ex, tempo).forEach(n => { if (!n.rest) tone(start + n.start, n.dur, 0.45); });
  countDisplay(ex, t0, tempo);
  const latency = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  const expected = R.timeline(ex, tempo).filter(n => !n.rest).map(n => start + n.start);
  tapRun = { start, expected, taps: [], latency, ex, tempo };
  const pad = document.getElementById('tapPad');
  if (pad) { pad.textContent = 'הקישו כאן'; pad.classList.add('live'); }
  const end = start + bar * ex.bars.length + 0.35;
  timers.push(setTimeout(() => {
    if (pad) { pad.textContent = ''; }
  }, (start - ctx.currentTime) * 1000));
  timers.push(setTimeout(finishTap, (end - ctx.currentTime) * 1000));
}

function onTap(e) {
  if (!tapRun || !audioCtx) return;
  // זמן ההקשה בשעון השמע: מורידים את העיכוב מאז האירוע ואת עיכוב הרמקול
  const delay = e && e.timeStamp ? Math.max(0, Math.min(0.1, (performance.now() - e.timeStamp) / 1000)) : 0;
  const t = audioCtx.currentTime - delay - tapRun.latency;
  if (t < tapRun.start - 0.3) return; // הקשות בזמן תיבת הספירה לא נספרות
  tapRun.taps.push(t);
  tapSound(audioCtx.currentTime);
  const pad = document.getElementById('tapPad');
  if (pad) { pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 90); }
}

function finishTap() {
  if (!tapRun) return;
  const run = tapRun;
  tapRun = null;
  const res = R.scoreTaps(run.expected, run.taps, { beat: 60 / run.tempo });
  cur.tapRes = res;
  count(res.passed && !cur.helped);
  renderTap(res);
  // הכול בזמן: עוברים לבד לתרגיל הבא
  if (res.passed) scheduleNext(1800, goNextQuiet);
}

document.addEventListener('keydown', e => {
  if (state.kind !== 'tap' || e.repeat) return;
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (tapRun) onTap(e);
    else if (document.getElementById('tapPad')) startTap();
  }
});

// ===== אימון לפי שלבים =====
const KIND_NAMES = { dictation: 'הכתבה', tap: 'קריאה והקשה', complete: 'השלמת תיבה' };
const TRAIN_HISTORY_KEY = 'mt_rhythm_training_history';
const PASS_PCT = 80;
let appMode = 'free';
let training = null;

function loadTrainHistory() {
  try { return JSON.parse(localStorage.getItem(TRAIN_HISTORY_KEY)) || []; } catch (e) { return []; }
}
function saveTrainHistory(entry) {
  try {
    const h = loadTrainHistory();
    h.push(entry);
    localStorage.setItem(TRAIN_HISTORY_KEY, JSON.stringify(h.slice(-200)));
  } catch (e) {}
}

// במשקלים של השלב (אם יש לו), אחרת לפי הרמה
function stepMeter() {
  const st = training && R.STEPS[training.step];
  return st && st.meters ? st.meters[Math.floor(Math.random() * st.meters.length)] : null;
}

function setMode(mode, initial = false) {
  if (window.Rewards && document.body.classList.contains('in-rewards')) Rewards.close();
  stopAll();
  tapRun = null;
  if (training) leaveTraining();
  appMode = mode;
  try { localStorage.setItem('mt_rhythm_mode', mode); } catch (e) {}
  document.body.classList.toggle('mode-train', mode === 'train');
  document.getElementById('settingsBox').open = false;
  renderSettings();
  updateScore();
  if (mode === 'train') { showStepPicker(); return; }
  document.getElementById('trainingPanel').hidden = true;
  if (!initial) newExercise(false);
}

function showStepPicker() {
  const panel = document.getElementById('trainingPanel');
  const history = loadTrainHistory();
  const items = R.STEPS.map((st, i) => {
    const runs = history.filter(h => h.step === i);
    const best = runs.length ? Math.max(...runs.map(h => Math.round(100 * h.correct / h.total))) : null;
    const meters = st.meters || R.LEVELS[st.level - 1].meters;
    return `<button class="level-item" data-step="${i}">
      <div><div class="lv-name">שלב ${st.n}: ${st.desc}</div><div class="lv-desc"><span dir="ltr">${meters.join(' ')}</span> · ${R.PARTS.filter(p => st.parts.includes(p.id)).map(p => p.name).join(', ')}</div></div>
      <div class="lv-best">${best === null ? '' : 'שיא ' + best + '%'}</div>
    </button>`;
  }).join('');
  panel.innerHTML = `<h2>אימון קצב</h2>
    <p class="sub">בוחרים שלב ומקבלים ${R.trainingPlan().length} תרגילים מעורבים: הכתבה, השלמת תיבה וקריאה והקשה. נספרת רק התשובה הראשונה, ובסוף מקבלים דוח.</p>
    <div class="level-list">${items}</div>`;
  panel.querySelectorAll('.level-item').forEach(b => b.onclick = () => startTraining(+b.dataset.step));
  panel.hidden = false;
  window.scrollTo(0, 0);
}

function startTraining(i) {
  stopAll();
  if (training) leaveTraining();
  const st = R.STEPS[i];
  training = {
    step: i, plan: R.trainingPlan(), index: 0, results: [],
    saved: { kind: state.kind, level: state.level, parts: state.parts.slice(), tempo: state.tempo }
  };
  state.level = st.level;
  state.parts = R.normParts(st.parts);
  state.tempo = st.tempo;
  state.kind = training.plan[0];
  document.body.classList.add('in-session');
  document.getElementById('trainingPanel').hidden = true;
  renderSettings();
  updateScore();
  newExercise(false);
  window.scrollTo(0, 0);
}

// מחזירים את ההגדרות של התרגול החופשי
function leaveTraining() {
  Object.assign(state, training.saved);
  training = null;
  document.body.classList.remove('in-session');
}

function recordResult(ok) {
  const c = cur;
  const r = { kind: c.kind, ok };
  if (c.kind === 'dictation') { r.parts = R.exerciseParts(c.d.answer); r.meter = c.d.answer.meter; }
  else if (c.kind === 'complete') {
    r.parts = [R.symbolPart(c.c.answer)].concat(c.c.answer.endsWith('.') ? ['dot'] : []);
    r.meter = c.c.ex.meter;
  } else {
    r.parts = R.exerciseParts(c.ex);
    r.meter = c.ex.meter;
    if (c.tapRes) r.tap = { errors: c.tapRes.errors, good: c.tapRes.good };
  }
  training.results.push(r);
}

function trainingNext(autoplay) {
  if (!training) return;
  stopAll();
  // דילוג נספר באימון כטעות (במערכת התגמולים לא נרשם כלום)
  if (cur && !cur.counted) { cur.counted = true; recordResult(false); }
  training.index++;
  if (training.index >= training.plan.length) { showTrainingReport(); return; }
  state.kind = training.plan[training.index];
  renderSettings();
  updateScore();
  newExercise(autoplay && state.kind === 'dictation');
}

function endTraining() {
  stopAll();
  tapRun = null;
  if (training && training.results.length) showTrainingReport();
  else setMode('train');
}

const PART_NAMES = Object.assign({ dot: 'ערכים מנוקדים' }, Object.fromEntries(R.PARTS.map(p => [p.id, p.name])));

function statRow(g) {
  const pct = Math.round(100 * g.correct / g.total);
  return `<div class="report-row"><div>${g.key}</div><div class="report-bar"><span style="width:${pct}%"></span></div><div class="num">${g.correct}/${g.total}</div></div>`;
}
function groupBy(results, keysFn) {
  const map = new Map();
  results.forEach(r => keysFn(r).forEach(k => {
    if (!map.has(k)) map.set(k, { key: k, total: 0, correct: 0 });
    const g = map.get(k);
    g.total++;
    if (r.ok) g.correct++;
  }));
  return [...map.values()];
}

// הקשה: כמה תווים בזמן, ונטייה להקדים או לאחר
function tapSummary(results) {
  const errs = [];
  let notes = 0, onTime = 0;
  results.forEach(r => {
    if (!r.tap) return;
    r.tap.errors.forEach(e => {
      notes++;
      if (e !== null) { errs.push(e); if (Math.abs(e) <= r.tap.good) onTime++; }
    });
  });
  if (!notes) return '';
  let lean = '';
  if (errs.length >= 4) {
    const mean = errs.reduce((a, b) => a + b, 0) / errs.length;
    if (mean < -0.03) lean = ` · נטייה להקדים (בממוצע ${Math.round(-mean * 1000)} אלפיות שנייה)`;
    else if (mean > 0.03) lean = ` · נטייה לאחר (בממוצע ${Math.round(mean * 1000)} אלפיות שנייה)`;
    else lean = ' · בלי נטייה להקדים או לאחר';
  }
  return `<p class="report-advice">${onTime} מתוך ${notes} תווים בזמן${lean}</p>`;
}

function showTrainingReport() {
  const t = training;
  const results = t.results;
  const total = results.length;
  const correct = results.filter(r => r.ok).length;
  const pct = total ? Math.round(100 * correct / total) : 0;
  const st = R.STEPS[t.step];
  saveTrainHistory({ t: Date.now(), step: t.step, correct, total });
  // במערכת התגמולים "עברת שלב" נספר מ-85%; כאן ההמלצה להתקדם היא מ-80%, אז שלב שעבר נרשם כעובר
  if (window.Rewards) Rewards.trainingDone('rhythm:' + t.step, pct >= PASS_PCT ? Math.max(pct, 85) : pct);

  const byKind = groupBy(results, r => [KIND_NAMES[r.kind]]);
  const order = R.PARTS.map(p => p.id).concat(['dot']);
  const byPart = groupBy(results, r => r.parts)
    .sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key))
    .map(g => Object.assign(g, { key: PART_NAMES[g.key] }));
  const byMeter = groupBy(results, r => [r.meter]);
  const weak = byPart.filter(g => g.correct / g.total < 0.7).map(g => g.key);
  const hasNext = t.step < R.STEPS.length - 1;
  const passed = pct >= PASS_PCT;
  let advice;
  if (passed) advice = hasNext ? 'מצוין. אפשר לעבור לשלב הבא.' : 'מצוין. סיימת את השלב האחרון.';
  else if (weak.length) advice = `כדאי לחזור על השלב הזה, עם דגש על ${weak.join(', ')}.`;
  else advice = 'כמעט שם. עוד סבב אחד בשלב הזה ואפשר להתקדם.';
  const tapHtml = tapSummary(results);

  leaveTraining();
  renderSettings();
  updateScore();
  const panel = document.getElementById('trainingPanel');
  panel.innerHTML = `<h2>שלב ${st.n}: ${st.desc} · סיכום</h2>
    <div class="report-score">${pct}%</div>
    <p class="sub">${correct} נכונות מתוך ${total} בניסיון הראשון</p>
    <div class="report-section"><p class="report-advice">${advice}</p></div>
    <div class="report-section"><h3>לפי סוג תרגיל</h3>${byKind.map(statRow).join('')}</div>
    <div class="report-section"><h3>לפי מרכיב</h3>${byPart.map(statRow).join('')}</div>
    ${byMeter.length > 1 ? `<div class="report-section"><h3>לפי משקל</h3>${byMeter.map(g => statRow(Object.assign({}, g, { key: `<span dir="ltr">${g.key}</span>` }))).join('')}</div>` : ''}
    ${tapHtml ? `<div class="report-section"><h3>הקשה</h3>${tapHtml}</div>` : ''}
    <div class="report-actions">
      ${hasNext && passed ? `<button class="primary" onclick="startTraining(${t.step + 1})">לשלב הבא</button>` : ''}
      <button class="${hasNext && passed ? '' : 'primary'}" onclick="startTraining(${t.step})">שוב בשלב הזה</button>
      <button onclick="showStepPicker()">כל השלבים</button>
    </div>`;
  panel.hidden = false;
  window.scrollTo(0, 0);
}

// ===== התחלה =====
loadSettings();
(function initialMode() {
  let mode = 'free';
  try { if (localStorage.getItem('mt_rhythm_mode') === 'train') mode = 'train'; } catch (e) {}
  const q = new URLSearchParams(location.search).get('mode');
  if (q === 'train' || q === 'free') mode = q;
  if (new URLSearchParams(location.search).get('ex')) mode = q || 'free';
  setMode(mode, true);
})();
renderSettings();
updateScore();
if (appMode === 'free') newExercise(false);
</script>
<script src="update-check.js"></script>
</body>
</html>
